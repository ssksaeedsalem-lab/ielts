      el('p', { style: 'font-size:.8rem;color:var(--ink-faint);margin-bottom:10px' }, 'Proficiency is a rough internal estimate from practice data — not a CEFR or IELTS classification.'),
      ...skills.map(([name, est, when, href]) =>
        el('div', { class: 'skill-row' },
          el('div', { class: 'grow' },
            el('div', { style: 'display:flex;justify-content:space-between' },
              el('strong', { style: 'font-size:.9rem' }, name),
              el('span', { class: 'mono' }, est + (when ? ' · ' + when : ' · no data yet'))
            ),
            el('div', { class: 'bar slim', style: 'margin-top:6px', role: 'img', 'aria-label': name + ' estimated proficiency ' + est }, el('i', { style: 'width:' + est.replace('%', '') + '%' }))
          ),
          el('a', { class: 'btn small ghost', href }, 'Practice')
        )
      )
    );
  }

  function estimateSkill(skill) {
    // Simple, honest heuristic: activity volume & accuracy → 0-100 "practice index"
    let items = 0, score = 0;
    const S = Store.s;
    for (const d of Object.values(S.activity)) { items += d.skills[skill] ? 1 : 0; }
    if (skill === 'vocab') { const c = SRS.counts(); return Math.min(100, Math.round((c.known / Math.max(20, c.total || 20)) * 100)) + '%'; }
    if (skill === 'grammar') {
      const gs = Object.entries(S.lessons).filter(([id]) => id.startsWith('g-'));
      if (!gs.length) return '0%';
      const avg = gs.reduce((a, [, L]) => a + (L.best || 0), 0) / gs.length;
      return Math.round(avg * 0.7 + Math.min(30, gs.length * 4)) + '%';
    }
    if (skill === 'reading') {
      const rs = Object.values(S.reading).filter(r => r.attempts > 0);
      if (!rs.length) return '0%';
      return Math.min(100, Math.round(rs.reduce((a, r) => a + (r.best || 0), 0) / rs.length + rs.length * 3)) + '%';
    }
    return Math.min(100, items * 12) + '%';
  }

  function lastActive(skill) {
    const S = Store.s;
    const days = Object.entries(S.activity).filter(([, d]) => d.skills[skill]).map(([k]) => k).sort();
    if (!days.length) return null;
    return 'active ' + days[days.length - 1].slice(5);
  }

  function recommendations() {
    const S = Store.s;
    const recs = [];
    const due = SRS.counts().dueNow;
    if (due > 0) recs.push(['Review ' + due + ' vocabulary card' + (due > 1 ? 's' : '') + ' scheduled for today.', 'Spaced repetition works only if you review on time.', '#/review']);
    const worst = Object.entries(S.mistakes).sort((a, b) => b[1].count - a[1].count).slice(0, 3);
    for (const [key, m] of worst) if (m.count >= 2) recs.push(['Revisit a recurring difficulty: "' + (m.ref || key).slice(0, 60) + '…"', 'You have missed this ' + m.count + ' times.', '#/review']);
    if (!S.profile.placementDone) recs.push(['Take the placement assessment.', 'It calibrates your starting point (≈5 minutes).', '#/assessments']);
    const unfinished = Object.entries(S.lessons).find(([, L]) => L.status === 'in-progress');
    if (unfinished) recs.push(['Resume: ' + lessonTitle(unfinished[0]), 'You started this lesson but have not finished it.', '#/learn']);
    if (!recs.length) recs.push(['Try an IELTS-style reading set.', 'You have no pending reviews or unfinished lessons — a good moment for exam practice.', '#/ielts']);
    return el('div', { class: 'card' },
      el('h3', { style: 'margin-bottom:14px' }, 'Recommended next steps'),
      ...recs.slice(0, 4).map(([title, why, href]) =>
        el('div', { class: 'mission-item' },
          el('div', { style: 'flex:1' }, el('div', { style: 'font-size:.92rem;font-weight:600' }, title), el('div', { style: 'font-size:.8rem;color:var(--ink-faint)' }, why)),
          el('a', { class: 'btn small', href }, 'Open')
        )
      )
    );
  }

  window.Dashboard = { render, nextRecommended, missionState, nextCurriculumLesson };
  Router.add('dashboard', 'Dashboard', render);
})();

/* ============================================================
   features/session.js — daily mixed-skill session runner.
   4 activities: grammar → vocab → reading → writing. Preserves
   partial progress; marks the daily mission step on completion.
   ============================================================ */
(function () {
  const { el, icon, runQuiz, toast } = UI;
  const D = () => window.DATA;

  function pickGrammar() {
    const S = Store.s;
    // Prefer a lesson at the learner's level, not yet completed
    const pool = D().grammar.filter(g => g.level === S.profile.level);
    const open = pool.filter(g => !S.lessons['g-' + g.id.replace('g-', '')] || S.lessons[g.id]?.status !== 'completed');
    const g = (open[0] || pool[0] || D().grammar[0]);
    return { lesson: g, questions: g.practice.slice(0, 3) };
  }

  function pickReading() {
    const S = Store.s;
    const pool = D().reading.filter(r => r.level === S.profile.level);
    const p = pool.find(r => !S.reading[r.id]?.read) || pool[0] || D().reading[0];
    return p;
  }

  function pickVocab() {
    const S = Store.s;
    const due = SRS.dueList();
    if (due.length >= 3) return { mode: 'review', ids: due.slice(0, 5) };
    const levelWords = D().vocabulary.filter(w => w.level === S.profile.level && !S.vocab[w.id]);
    return { mode: 'new', ids: levelWords.slice(0, 4).map(w => w.id) };
  }

  const writingMicro = () => D().writingMicro[0] && D().writingMicro.filter(w => w.level === Store.s.profile.level)[0] || D().writingMicro[0];

  let flow = null;

  function buildFlow() {
    const g = pickGrammar();
    const p = pickReading();
    const v = pickVocab();
    const w = writingMicro();
    flow = {
      idx: 0,
      steps: [
        { kind: 'grammar', title: 'Grammar — ' + g.lesson.title, minutes: 2, run: (el) => runGrammar(el, g) },
        { kind: 'vocab', title: v.mode === 'review' ? 'Vocabulary review' : 'New vocabulary', minutes: 2, run: (el) => runVocab(el, v) },
        { kind: 'reading', title: 'Reading — ' + p.title, minutes: 3, run: (el) => runReading(el, p) },
        { kind: 'writing', title: 'Micro writing', minutes: 2, run: (el) => runWriting(el, w) },
      ],
      results: [],
    };
  }

  function render(outlet) {
    const S = Store.s;
    const m = Dashboard.missionState();
    buildFlow();
    // Skip steps already done in today's mission
    flow.steps = flow.steps.filter(st => !(m.steps.find(ms => ms.kind === st.kind)?.done));
    if (!flow.steps.length) return renderDone(outlet);
    const t0 = Date.now();
    flow.t0 = t0;
    renderStep(outlet);
  }

  function renderStep(outlet) {
    const st = flow.steps[flow.idx];
    outlet.innerHTML = '';
    outlet.append(
      el('div', { style: 'display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:12px' },
        el('div', {},
          el('span', { class: 'mono' }, 'Daily session · activity ' + (flow.idx + 1) + ' of ' + flow.steps.length),
          el('h2', { style: 'margin-top:4px' }, st.title)),
        el('div', { class: 'dots', 'aria-label': 'Session progress' },
          ...flow.steps.map((_, i) => el('i', { class: i < flow.idx ? 'done' : i === flow.idx ? 'cur' : '' })))
      ),
      el('div', { id: 'step-body', class: 'card' })
    );
    st.run(document.getElementById('step-body'));
  }

  function stepDone(kind, res) {
    flow.results.push({ kind, ...res });
    const m = Dashboard.missionState();
    const ms = m.steps.find(x => x.kind === kind);
    if (ms) { ms.done = true; m.doneCount = m.steps.filter(x => x.done).length; Store.save(); }
    Store.recordActivity({ skill: kind === 'grammar' ? 'grammar' : kind, minutes: flow.steps[flow.idx].minutes, items: res.items || 1 });
    flow.idx++;
    const outlet = document.getElementById('page');
    if (flow.idx >= flow.steps.length) renderSummary(outlet); else renderStep(outlet);
  }

  function renderSummary(outlet) {
    outlet.innerHTML = '';
    const mins = Math.max(flow.steps.length * 2, Math.round((Date.now() - flow.t0) / 60000));
    const total = flow.results.length;
    const items = flow.results.reduce((a, r) => a + (r.items || 0), 0);
    const correct = flow.results.reduce((a, r) => a + (r.correct || 0), 0);
    outlet.append(
      el('div', { class: 'card tint', style: 'text-align:center;padding:48px 32px' },
        el('div', { style: 'color:var(--good)', html: icon('check', 40) }),
        el('h2', { style: 'margin:12px 0' }, 'Session complete'),
        el('p', { style: 'color:var(--ink-soft)' }, 'Nice work. Everything you completed has been saved and scheduled for review.'),
        el('div', { class: 'grid cols-4', style: 'margin:28px 0;text-align:left' },
          ...[[String(total), 'Activities'], [String(items), 'Items attempted'], [String(correct), 'Correct answers'], [mins + ' min', 'Time spent']].map(([v, k]) =>
            el('div', { class: 'stat' }, el('div', { class: 'v' }, v), el('div', { class: 'k' }, k)))
        ),
        el('div', { class: 'pill-row', style: 'justify-content:center' },
          el('a', { class: 'btn primary', href: '#/dashboard' }, 'Back to dashboard'),
          el('a', { class: 'btn', href: '#/review' }, 'Open Review Center'),
          el('a', { class: 'btn ghost', href: '#/progress' }, 'See progress')
        )
      )
    );
  }

  function renderDone(outlet) {
    outlet.innerHTML = '';
    outlet.append(el('div', { class: 'card tint', style: 'text-align:center;padding:48px' },
      el('h2', {}, 'Today\u2019s mission is complete'),
      el('p', { style: 'color:var(--ink-soft);margin:10px 0 20px' }, 'Come back tomorrow — or explore freely: the library and IELTS sets are always open.'),
      el('div', { class: 'pill-row', style: 'justify-content:center' },
        el('a', { class: 'btn', href: '#/reading' }, 'Reading library'),
        el('a', { class: 'btn', href: '#/ielts' }, 'IELTS Academy'))
    ));
  }

  /* ------- activity renderers ------- */
  function runGrammar(container, g) {
    const { el } = UI;
    container.append(
      el('p', { style: 'margin-bottom:16px', html: g.lesson.explain }),
      el('div', { id: 'qz' })
    );
    UI.runQuiz(document.getElementById('qz'), g.questions.map(q => ({ ...q, skill: 'Grammar', level: g.lesson.level, mkey: g.lesson.id + ':' + q.q.slice(0, 30) })), {
      type: 'grammar',
      onDone: (r) => {
        Store.markLesson(g.lesson.id, { status: 'completed', best: r.pct });
        finishBtn(container, 'grammar', { items: r.total, correct: r.correct });
      }
    });
  }

  function runVocab(container, v) {
    const { el } = UI;
    let i = 0, correct = 0;
    const words = v.ids.map(id => D().vocabulary.find(w => w.id === id)).filter(Boolean);
    if (!words.length) { container.append(el('p', {}, 'No new words available at your level right now. Try the Review Center.')); finishBtn(container, 'vocab', { items: 0, correct: 0 }); return; }
    const wrap = el('div');
    container.append(el('p', { style: 'margin-bottom:16px' }, v.mode === 'review' ? 'These cards are due for review today. Rate how well you remembered each one.' : 'New words. Read each card, flip it, then answer the quick check.'), wrap);
    function show() {
      if (i >= words.length) { finishBtn(container, 'vocab', { items: words.length, correct }); return; }
      const w = words[i];
      SRS.addWord(w.id, w.word);
      wrap.innerHTML = '';
      const card = el('div', { class: 'flashcard', tabindex: '0', role: 'button', 'aria-label': 'Flashcard: ' + w.word + '. Press Enter to flip.', onclick: () => card.classList.toggle('flipped'), onkeydown: (e) => { if (e.key === 'Enter' || e.key === ' ') { card.classList.toggle('flipped'); e.preventDefault(); } } },
        el('div', { class: 'inner' },
          el('div', { class: 'face' },
            el('div', { class: 'word' }, w.word),
            el('div', { class: 'ipa' }, w.ipa || ''),
            el('span', { class: 'chip' }, w.level + ' · ' + w.pos)),
          el('div', { class: 'face back' },
            el('strong', {}, w.def),
            el('p', { style: 'font-size:.9rem;color:var(--ink-soft)' }, w.ex),
            el('span', { class: 'chip accent' }, 'Flip back')
          )
        )
      );
      const q = el('div', { style: 'margin-top:18px' },
        el('p', { style: 'font-weight:600;margin-bottom:10px' }, 'Quick check: which sentence uses "' + w.word + '" correctly?'),
        ...shuffled([w.ex, wrongSentence(w), anotherSentence(w)]).map(s =>
          el('button', { class: 'quiz-opt', style: 'margin-bottom:10px', onclick: (e) => {
            const ok = s === w.ex;
            if (ok) correct++;
            SRS.rate(w.id, ok ? 2 : 0);
            [...q.querySelectorAll('.quiz-opt')].forEach(b => { b.disabled = true; if (b.textContent === w.ex) b.classList.add('correct'); });
            e.currentTarget.classList.add(ok ? 'correct' : 'wrong');
            q.appendChild(el('div', { class: 'explain ' + (ok ? 'ok' : 'err') }, ok ? 'Correct — it will return in a few days.' : 'Not this one. It will come back sooner for more practice.'));
            q.appendChild(el('div', { style: 'text-align:right' }, el('button', { class: 'btn primary small', onclick: () => { i++; show(); } }, 'Next word')));
          } }, s))
      );
      wrap.append(card, q);
    }
    show();
  }

  function wrongSentence(w) { const others = D().vocabulary.filter(x => x.id !== w.id); return others[Math.floor(Math.random() * others.length)].ex; }
  function anotherSentence(w) { const others = D().vocabulary.filter(x => x.id !== w.id && x.ex !== undefined); return others[(Math.floor(Math.random() * 100) + 7) % others.length].ex; }
  function shuffled(a) { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  function runReading(container, p) {
    const { el } = UI;
    container.append(
      el('details', { style: 'margin-bottom:14px' },
        el('summary', { style: 'cursor:pointer;font-weight:600' }, 'Read the passage (' + p.minutes + ' min · ' + p.level + ')'),
        el('div', { class: 'reading-body', style: 'margin-top:14px', html: p.text.map(UI.esc).join('<br><br>') })),
      el('div', { id: 'qz' })
    );
    UI.runQuiz(document.getElementById('qz'), p.questions.map(q => ({ ...q, skill: 'Reading', level: p.level, mkey: p.id + ':' + q.q.slice(0, 30) })), {
      type: 'reading',
      onDone: (r) => {
        const rec = Store.s.reading[p.id] || { attempts: 0 };
        rec.read = true; rec.attempts++; rec.best = Math.max(rec.best || 0, r.pct);
        Store.s.reading[p.id] = rec; Store.save();
        finishBtn(container, 'reading', { items: r.total, correct: r.correct });
      }
    });
  }

  function runWriting(container, w) {
    const { el } = UI;
    container.append(
      el('p', { style: 'margin-bottom:8px', html: '<b>' + w.prompt + '</b>' }),
      el('p', { style: 'font-size:1.05rem;margin-bottom:14px' }, w.task),
      el('textarea', { class: 'input', id: 'wa', rows: 3, 'aria-label': 'Your answer' }),
      el('div', { style: 'display:flex;gap:10px;margin-top:12px;flex-wrap:wrap' },
        el('button', { class: 'btn primary', onclick: () => {
          const val = document.getElementById('wa').value;
          if (!val.trim()) return UI.toast('Write something first.', 'err');
          const ok = UI.norm(val) === UI.norm(w.answer);
          container.appendChild(el('div', { class: 'explain ' + (ok ? 'ok' : 'err') },
            ok ? '<b>Correct — well spotted.</b>' : '<b>Compare with a correct version:</b> ' + w.answer + '.',
            el('br'), (w.explain || '') + ' (Several valid phrasings may exist — the key features are the target structures.)'));
          Store.s.writing.history.push({ id: Date.now(), task: w.task, text: val, date: Date.now(), words: val.trim().split(/\s+/).length });
          Store.save();
          finishBtn(container, 'writing', { items: 1, correct: ok ? 1 : 0 });
        } }, 'Check answer'),
        el('button', { class: 'btn ghost', onclick: () => UI.modal('Hints', [el('ul', { class: 'rubric' }, w.hints.map(h => el('li', {}, h)))]) }, 'Hint'))
    );
  }

  function finishBtn(container, kind, res) {
    if (container.querySelector('.done-row')) return;
    container.appendChild(el('div', { class: 'done-row', style: 'margin-top:18px;text-align:right' },
      el('button', { class: 'btn primary', onclick: () => stepDone(kind, res) }, flow.idx >= flow.steps.length - 1 ? 'Finish session' : 'Next activity →')));
  }

  window.Session = { render };
  Router.add('session', 'Daily Session', render);
})();

/* ============================================================
   features/reading.js — library, reading environment,
   word lookup + save-to-vocabulary, bookmarks, analytics.
   ============================================================ */
(function () {
  const { el, icon, esc } = UI;
  const D = () => window.DATA;

  let filterLevel = 'all', filterTopic = 'all', filterType = 'all';

  function render(outlet) {
    outlet.append(
      el('h2', {}, 'Reading Library'),
      el('p', { style: 'color:var(--ink-soft);margin:6px 0 20px' }, 'Original passages across B1–C2. Select any word to look it up and save it to your vocabulary collection.'),
      filterbar(outlet),
    );
    outlet.appendChild(el('div', { class: 'lib-grid', id: 'lib' }));
    paintLibrary();
  }

  function filterbar(outlet) {
    const seg = (opts, val, on) => el('select', { class: 'input', style: 'width:auto', onchange: (e) => on(e.target.value), 'aria-label': 'Filter' },
      ...opts.map(o => el('option', { value: o.v, selected: o.v === val }, o.t)));
    outlet.appendChild(el('div', { class: 'filterbar' },
      seg([{ v: 'all', t: 'All levels' }, ...D().curriculum.levelOrder.map(l => ({ v: l, t: l }))], filterLevel, v => { filterLevel = v; paintLibrary(); }),
      seg([{ v: 'all', t: 'All topics' }, ...[...new Set(D().reading.map(r => r.topic))].map(t => ({ v: t, t }))], filterTopic, v => { filterTopic = v; paintLibrary(); }),
      seg([{ v: 'all', t: 'All types' }, ...[...new Set(D().reading.map(r => r.type))].map(t => ({ v: t, t }))], filterType, v => { filterType = v; paintLibrary(); })
    ));
  }

  function paintLibrary() {
    const lib = document.getElementById('lib');
    if (!lib) return;
    const items = D().reading.filter(r =>
      (filterLevel === 'all' || r.level === filterLevel) &&
      (filterTopic === 'all' || r.topic === filterTopic) &&
      (filterType === 'all' || r.type === filterType));
    lib.innerHTML = '';
    if (!items.length) { lib.appendChild(el('div', { class: 'empty' }, el('p', {}, 'No passages match this filter yet.'))); return; }
    for (const r of items) {
      const rec = Store.s.reading[r.id] || {};
      lib.appendChild(el('a', { class: 'lib-card', href: '#/reading/' + r.id },
        el('div', { style: 'display:flex;justify-content:space-between;gap:8px;align-items:flex-start' },
          el('span', { class: 'chip accent' }, r.level),
          rec.read ? el('span', { class: 'chip good' }, 'best ' + (rec.best || 0) + '%') : null),
        el('h3', {}, r.title),
        el('p', { style: 'font-size:.85rem;color:var(--ink-soft);flex:1' }, r.text[0].slice(0, 110) + '…'),
        el('div', { class: 'meta' },
          el('span', { class: 'chip' }, icon('clock', 12) + ' ' + r.minutes + ' min'),
          el('span', { class: 'chip' }, r.type),
          el('span', { class: 'chip' }, r.questions.length + ' questions'))
      ));
    }
  }

  /* ---------- Passage view ---------- */
  function renderPassage(outlet, params) {
    const p = D().reading.find(r => r.id === params.id);
    if (!p) { outlet.appendChild(el('div', { class: 'empty' }, el('p', {}, 'Passage not found.'))); return; }
    const S = Store.s;
    const rec = S.reading[p.id] || {};

    outlet.append(
      el('a', { class: 'btn small ghost', href: '#/reading', style: 'margin-bottom:16px' }, '← Library'),
      el('div', { class: 'read-shell' },
        el('div', { class: 'read-tools' },
          el('div', {},
            el('span', { class: 'chip accent' }, p.level),
            el('span', { class: 'chip', style: 'margin-left:6px' }, p.type + ' · ' + p.minutes + ' min'),
            p.story ? el('span', { class: 'chip', style: 'margin-left:6px' }, 'fiction') : null),
          el('div', { class: 'pill-row' },
            el('button', { class: 'btn small', onclick: () => { S.prefs.readSize = Math.max(.9, S.prefs.readSize - .08); Store.save(); UI.applyTheme(); } }, 'A−'),
            el('button', { class: 'btn small', onclick: () => { S.prefs.readSize = Math.min(1.5, S.prefs.readSize + .08); Store.save(); UI.applyTheme(); } }, 'A+'),
            el('button', { class: 'btn small', onclick: () => { const lh = S.prefs.readLh >= 2 ? 1.5 : S.prefs.readLh + .25; S.prefs.readLh = lh; Store.save(); UI.applyTheme(); } }, 'Spacing'),
            el('button', { class: 'btn small', onclick: () => toggleBookmark(p.id) }, (S.reading[p.id]?.bookmark ? '★' : '☆') + ' Bookmark'))
        ),
        el('h2', {}, p.title),
        el('p', { class: 'mono', style: 'margin-bottom:20px' }, p.topic + ' · tap any word to look it up'),
        el('article', { class: 'reading-body card', id: 'passage-body', style: 'padding:32px;margin-bottom:24px' }),
        el('div', { id: 'qz' })
      )
    );

    // Word-lookup: split into spans
    const body = document.getElementById('passage-body');
    for (const para of p.text) {
      const pe = el('p', {});
      para.split(/(\s+)/).forEach(tok => {
        if (/^\s+$/.test(tok) || !/[a-zA-Z]/.test(tok)) { pe.appendChild(document.createTextNode(tok)); return; }
        const clean = tok.replace(/[^a-zA-Z’'-]/g, '');
        pe.appendChild(el('span', { class: 'w', tabindex: '0', role: 'button', onclick: (e) => lookup(e, clean), onkeydown: (e) => { if (e.key === 'Enter') lookup(e, clean); } }, tok));
      });
      body.appendChild(pe);
    }

    UI.runQuiz(document.getElementById('qz'), p.questions.map(q => ({ ...q, skill: 'Reading', level: p.level, mkey: p.id + ':' + q.q.slice(0, 30) })), {
      type: 'reading',
      onDone: (r) => {
        const rec = S.reading[p.id] || { attempts: 0 };
        rec.read = true; rec.attempts++; rec.best = Math.max(rec.best || 0, r.pct);
        S.reading[p.id] = rec; Store.save();
        Store.recordActivity({ skill: 'reading', minutes: p.minutes, items: r.total });
        document.getElementById('qz').insertAdjacentHTML('afterbegin', '<div class="explain ok"><b>Saved.</b> Accuracy ' + r.pct + '% — recorded in your reading history. Explanations above show why each answer is right and where distractors mislead.</div>');
      }
    });
  }

  function lookup(e, word) {
    document.querySelectorAll('.lookup').forEach(n => n.remove());
    const target = e.currentTarget || e.target;
    const data = D().vocabulary.find(v => v.word.toLowerCase() === word.toLowerCase());
    const pop = el('div', { class: 'lookup' },
      el('div', { style: 'display:flex;justify-content:space-between;align-items:baseline' },
        el('strong', {}, word),
        el('button', { class: 'btn ghost small', 'aria-label': 'Close', onclick: () => pop.remove(), html: icon('x', 14) })),
      data ? el('div', {},
        el('div', { class: 'mono' }, data.pos + ' · ' + data.level + (data.ipa ? ' · ' + data.ipa : '')),
        el('p', { style: 'margin:8px 0' }, data.def),
        el('p', { style: 'font-size:.85rem;color:var(--ink-soft)' }, data.ex),
        el('button', { class: 'btn small primary', onclick: () => { SRS.addWord(data.id, data.word); pop.remove(); UI.toast('Saved to your vocabulary collection.'); } }, '+ Add to vocabulary'))
      : el('div', {},
        el('p', { style: 'font-size:.85rem;color:var(--ink-soft)' }, 'Not in the curated collection. ' + (data ? '' : 'You can still note it in Review later.')),
        el('button', { class: 'btn small', onclick: () => { UI.synth.speak(word); } }, UI.synth.available ? '🔊 Hear (synthetic voice)' : 'No audio available'))
    );
    const rect = target.getBoundingClientRect();
    pop.style.left = Math.min(window.innerWidth - 340, rect.left) + 'px';
    pop.style.top = (rect.bottom + window.scrollY + 8) + 'px';
    document.body.appendChild(pop);
    setTimeout(() => document.addEventListener('click', function h(ev) { if (!pop.contains(ev.target)) { pop.remove(); document.removeEventListener('click', h); } }), 10);
  }

  function toggleBookmark(id) {
    const rec = Store.s.reading[id] || (Store.s.reading[id] = {});
    rec.bookmark = !rec.bookmark; Store.save();
    UI.toast(rec.bookmark ? 'Bookmarked.' : 'Bookmark removed.');
    Router.run();
  }

  window.Reading = { render, renderPassage };
  Router.add('reading', 'Reading', render);
  Router.add('reading/:id', 'Reading', renderPassage);
})();

(function () {

      el('div', { class: 'grid cols-4', style: 'margin-bottom:24px' },

        stat(c.dueNow, 'Due now'),
        stat(c.learning, 'Learning'),
        stat(c.known, 'Known')
      ),

        el('button', { class: 'btn', onclick: () => reviewFlow(outlet, 'new') }, 'Learn new words'),

    function stat(v, k) { return el('div', { class: 'card flat stat' }, el('div', { class: 'v' }, String(v)), el('div', { class: 'k' }, k)); }
  }

  /* ---------- Browse ---------- */
  let fl = 'all', ft = 'all';
  function browse(zone) {
    if (!zone) zone = document.getElementById('vz');
    if (!zone) return;
    zone.innerHTML = '';
    const words = D().vocabulary.filter(w => (fl === 'all' || w.level === fl) && (ft === 'all' || w.topic === ft));
    const saved = Object.keys(Store.s.vocab).length;
    zone.append(
      el('div', { class: 'filterbar' },
        el('select', { class: 'input', style: 'width:auto', onchange: e => { fl = e.target.value; browse(zone); }, 'aria-label': 'Level' },
          el('option', {}, 'All levels'), ...D().curriculum.levelOrder.map(l => el('option', { value: l }, l))),

      ));
    }
    table.appendChild(tb);
    zone.appendChild(table);
  }

  /* ---------- Flashcard review flow ---------- */
  function reviewFlow(outlet, mode) {
    let ids;
    if (mode === 'due') ids = SRS.dueList();
    else {
      const fresh = D().vocabulary.filter(w => !Store.s.vocab[w.id]).slice(0, Store.s.prefs.dailyNewWords);
      ids = fresh.map(w => w.id);
      if (!ids.length) { UI.toast('No new words available right now.'); return; }
    }
    if (!ids.length) { UI.toast('Nothing due — your reviews are up to date. ✓', 'ok'); return; }
    const words = ids.map(id => D().vocabulary.find(w => w.id === id)).filter(Boolean);
    const zone = document.getElementById('vz');
    zone.innerHTML = '';
    let i = 0, t0 = Date.now();
    zone.append(el('h3', { id: 'vhead' }, ''), el('div', { id: 'vcard' }));
    showCard();

    function showCard() {
      const head = document.getElementById('vhead');
      const cardZone = document.getElementById('vcard');
      if (i >= words.length) {
        const mins = Math.max(1, Math.round((Date.now() - t0) / 60000));
        Store.recordActivity({ skill: 'vocab', minutes: mins, items: words.length });
        cardZone.innerHTML = '';
        head.textContent = '';
        cardZone.appendChild(el('div', { class: 'card tint', style: 'text-align:center;padding:32px' },
          el('h3', {}, 'Review complete'),
          el('p', { style: 'color:var(--ink-soft);margin:10px 0' }, words.length + ' cards processed. The scheduler has set each card\u2019s next review date.'),
          el('button', { class: 'btn primary', onclick: () => Router.run() }, 'Back to vocabulary')));
        return;
      }
      const w = words[i];
      head.textContent = 'Card ' + (i + 1) + ' of ' + words.length;
      cardZone.innerHTML = '';
      const card = el('div', { class: 'flashcard', tabindex: '0', role: 'button', 'aria-label': 'Flashcard ' + w.word + ' — Enter to flip', onclick: () => card.classList.toggle('flipped'), onkeydown: (e) => { if (e.key === 'Enter' || e.key === ' ') { card.classList.toggle('flipped'); e.preventDefault(); } } },
        el('div', { class: 'inner' },
          el('div', { class: 'face' }, el('div', { class: 'word' }, w.word), el('div', { class: 'ipa' }, w.ipa || w.pos), el('span', { class: 'chip' }, w.level)),
          el('div', { class: 'face back' },
            el('strong', {}, w.def),
            el('p', { style: 'font-size:.88rem;color:var(--ink-soft);max-width:52ch' }, w.ex),
            w.mistakes ? el('p', { class: 'mono', style: 'text-transform:none;color:var(--warn)' }, '⚠ ' + w.mistakes) : null)
        )
      );
      const rates = el('div', { style: 'margin-top:18px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap' },
        [['Again', 0, 'bad'], ['Hard', 1, 'warn'], ['Good', 2, ''], ['Easy', 3, 'good']].map(([label, r, cls]) =>
          el('button', { class: 'btn small ' + (cls === 'bad' ? 'danger' : cls === 'good' ? 'primary' : ''), onclick: () => { SRS.rate(w.id, r); i++; showCard(); } }, label))
      );
      const say = UI.synth.available ? el('button', { class: 'btn small ghost', onclick: () => UI.synth.speak(w.word) }, '🔊 Hear (synthetic)') : null;
      cardZone.append(card, el('div', { style: 'text-align:center' }, say), rates);
    }
  }

  /* ---------- Exercises ---------- */
  function exercises(outlet) {
    const zone = document.getElementById('vz');
    if (!zone) return;
    zone.innerHTML = '';
    zone.append(el('h3', {}, 'Vocabulary exercises'), el('div', { id: 'ex' }));
    const ex = document.getElementById('ex');
    // 1. Word formation
    UI.runQuiz(ex, D().wordFormation.map(f => ({
      q: 'Complete with the correct form: ' + f.sentence, type: 'fill', answer: f.target, skill: 'Word formation', level: f.level, mkey: 'wf:' + f.target,
      explain: 'Word-formation items test your control of prefixes and suffixes.'
    })), { type: 'vocab-ex', onDone: (r) => Store.recordActivity({ skill: 'vocab', minutes: 4, items: r.total }) });
    // 2. Confused words
    const cm = D().confused.map((p, i) => {
      const useA = i % 2 === 0;
      return {
        q: 'Choose the correct word: ' + (useA ? p.aUse : p.bUse),
        options: [useA ? p.b : p.a, useA ? p.a : p.b],
        answer: useA ? p.a : p.b,
        skill: 'Confused words', level: 'B2', mkey: 'conf:' + p.a,
        explain: (useA ? p.aUse : p.bUse) + ' — the other option means something different: ' + (useA ? p.bUse : p.aUse)
      };
    });
    zone.appendChild(el('div', { id: 'ex2', style: 'margin-top:24px' }));
    UI.runQuiz(document.getElementById('ex2'), cm, { type: 'vocab-ex' });
  }

  window.Vocabulary = { render };
  Router.add('vocabulary', 'Vocabulary', render);
})();

/* ============================================================
   features/writing.js — Writing workspace: micro tasks, prompts,
   editor with autosave, deterministic + rule-based feedback.
   ============================================================ */
(function () {
  const { el, icon } = UI;
  const D = () => window.DATA;

  function render(outlet) {
    outlet.append(
      el('h2', {}, 'Writing Workspace'),
      el('p', { style: 'color:var(--ink-soft);margin:6px 0 20px' }, 'Micro tasks take 2–3 minutes. Prompts take longer and autosave your drafts.'),
      el('div', { class: 'pill-row', style: 'margin-bottom:20px' },
        el('button', { class: 'btn primary', onclick: () => microMode(outlet) }, 'Micro writing'),
        el('button', { class: 'btn', onclick: () => promptMode(outlet) }, 'Writing prompts'),
        el('button', { class: 'btn ghost', onclick: () => historyMode(outlet) }, 'History (' + Store.s.writing.history.length + ')')),
      el('div', { id: 'wz' })
    );
    microMode(outlet);
  }

  /* ---------- Micro writing ---------- */
  let mi = 0;
  function microMode(outlet) {
    const zone = document.getElementById('wz');
    if (!zone) return;
    zone.innerHTML = '';
    const w = D().writingMicro[mi % D().writingMicro.length];
    zone.append(
      el('div', { class: 'card' },
        el('span', { class: 'chip accent' }, w.level),
        el('p', { style: 'font-weight:600;margin:10px 0 6px' }, w.prompt),
        el('p', { style: 'font-size:1.05rem;margin-bottom:14px' }, w.task),
        el('textarea', { class: 'input', id: 'micro-in', rows: 2, 'aria-label': 'Your rewritten sentence' }),
        el('div', { style: 'display:flex;gap:10px;margin-top:12px;flex-wrap:wrap' },
          el('button', { class: 'btn primary', onclick: () => checkMicro(w) }, 'Check'),
          el('button', { class: 'btn ghost', onclick: () => UI.modal('Hints', [el('ul', { class: 'rubric' }, w.hints.map(h => el('li', {}, h)))]) }, 'Hint'),
          el('button', { class: 'btn small', onclick: () => { mi++; microMode(outlet); } }, 'Next task →')),
        el('div', { id: 'micro-fb', style: 'margin-top:12px' })
      )
    );
    function checkMicro(w) {
      const val = document.getElementById('micro-in').value;
      const fb = document.getElementById('micro-fb');
      if (!val.trim()) { fb.innerHTML = '<div class="explain err">Write your answer first.</div>'; return; }
      const ok = UI.norm(val) === UI.norm(w.answer);
      fb.innerHTML = '';
      fb.appendChild(el('div', { class: 'explain ' + (ok ? 'ok' : 'err'), html:
        (ok ? '<b>Correct.</b> ' : '<b>Close — compare:</b> A correct version is "' + UI.esc(w.answer) + '". ') + UI.esc(w.explain || '') + '<br><span class="mono" style="text-transform:none">Note: several valid phrasings may exist — the checker looks for the target structure, not one exact sentence.</span>' }));
      Store.s.writing.history.push({ id: Date.now(), task: w.task, text: val, date: Date.now(), words: val.trim().split(/\s+/).length, correct: ok });
      Store.save();
      Store.recordActivity({ skill: 'writing', minutes: 2, items: 1 });
    }
  }

  /* ---------- Prompts + editor ---------- */
  function promptMode(outlet) {
    const zone = document.getElementById('wz');
    if (!zone) return;
    zone.innerHTML = '';
    zone.append(el('div', { class: 'lib-grid', id: 'plist' }));
    for (const p of D().writingPrompts) {
      document.getElementById('plist').appendChild(el('button', { class: 'lib-card', onclick: () => editor(p) },
        el('span', { class: 'chip accent' }, p.level),
        el('h3', { style: 'margin-top:8px' }, p.genre),
        el('p', { style: 'font-size:.86rem;color:var(--ink-soft)' }, p.prompt.slice(0, 120) + '…'),
        el('div', { class: 'meta' }, el('span', { class: 'chip' }, p.minutes + ' min'), el('span', { class: 'chip' }, p.target))
      ));
    }
  }

  function editor(p) {
    const zone = document.getElementById('wz');
    const draftKey = 'draft:' + p.id;
    const saved = Store.s.writing.drafts[draftKey];
    zone.innerHTML = '';
    const ta = el('textarea', { class: 'input', id: 'ta', rows: 14, 'aria-label': 'Your writing' }, saved || '');
    const wc = el('span', { class: 'mono' }, '0 words');
    const updateWC = () => { wc.textContent = (ta.value.trim() ? ta.value.trim().split(/\s+/).length : 0) + ' words / target ' + p.target; };
    ta.addEventListener('input', () => { updateWC(); autosave(); });
    let saveT;
    function autosave() { clearTimeout(saveT); saveT = setTimeout(() => { Store.s.writing.drafts[draftKey] = ta.value; Store.save(); }, 400); }

    zone.append(
      el('div', { class: 'writer' },
        el('div', {},
          el('div', { class: 'card', style: 'margin-bottom:16px' },
            el('span', { class: 'chip accent' }, p.level + ' · ' + p.genre),
            el('p', { style: 'margin:10px 0;font-size:1rem' }, p.prompt),
            el('p', { class: 'mono' }, p.minutes + ' min · ' + p.target)),
          ta,
          el('div', { style: 'display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center' },
            wc,
            el('button', { class: 'btn primary', onclick: () => submit(p, ta.value) }, 'Submit for feedback'),
            el('button', { class: 'btn ghost', onclick: () => UI.confirmDialog('Reset draft?', 'Delete your current draft for this task? This cannot be undone.', () => { ta.value = ''; Store.s.writing.drafts[draftKey] = ''; Store.save(); updateWC(); }) }, 'Reset draft'))),
        el('div', { class: 'meta-panel' },
          el('div', { class: 'card flat' },
            el('h4', { style: 'margin-bottom:10px' }, 'Checklist'),
            el('ul', { class: 'rubric' }, p.checklist.map(c => el('li', {}, c)))),
          el('div', { class: 'card flat' },
            el('h4', { style: 'margin-bottom:10px' }, 'Status'),
            el('p', { style: 'font-size:.85rem;color:var(--ink-soft)' }, 'Drafts autosave locally every few seconds. Feedback is rule-based: spelling, doubled words, capitalisation, and common patterns. It does not grade essays like an examiner — use the checklist and, ideally, a teacher for judgement.'))
        )
      ),
      el('div', { id: 'wfb', style: 'margin-top:20px' })
    );
    updateWC();
  }

  function submit(p, text) {
    const fb = document.getElementById('wfb');
    const issues = ruleCheck(text);
    const words = text.trim() ? text.trim().split(/\s+/).length : 0;
    fb.innerHTML = '';
    fb.appendChild(el('div', { class: 'card tint' },
      el('h3', { style: 'margin-bottom:12px' }, 'Feedback'),
      el('div', { class: 'grid cols-3', style: 'margin-bottom:14px' },
        el('div', { class: 'stat' }, el('div', { class: 'v' }, String(words)), el('div', { class: 'k' }, 'Words')),
        el('div', { class: 'stat' }, el('div', { class: 'v' }, String(p.minutes) + 'm'), el('div', { class: 'k' }, 'Suggested time')),
        el('div', { class: 'stat' }, el('div', { class: 'v' }, String(issues.length)), el('div', { class: 'k' }, 'Flagged items'))),
      issues.length ? el('ul', { class: 'rubric' }, issues.map(i => el('li', { html: i }))) :
        el('p', { style: 'color:var(--good);font-size:.92rem' }, 'No mechanical issues detected by the rule-based checker. Re-read your work against the checklist above — automatic checks cannot judge argument, coherence, or style.'),
      el('p', { style: 'font-size:.8rem;color:var(--ink-faint);margin-top:12px' }, 'This is automated, rule-based feedback with clear limits. It is not an IELTS band score and not a human assessment.')
    ));
    Store.s.writing.history.push({ id: Date.now(), task: p.prompt.slice(0, 80), text, date: Date.now(), words, promptId: p.id });
    Store.save();
    Store.recordActivity({ skill: 'writing', minutes: p.minutes, items: 1 });
  }

  /* Deterministic rule-based checks — deliberately conservative. */
  function ruleCheck(text) {
    const out = [];
    const t = text;
    if (!t.trim()) return ['Your submission is empty.'];
    if (!/^[A-Z"'(]/.test(t.trim())) out.push('<b>Capitalisation:</b> the first character should be a capital letter.');
    const dbl = t.match(/\b(\w+)\s+\1\b/i);
    if (dbl) out.push('<b>Repeated word:</b> "' + dbl[1] + '" appears twice in a row.');
    if (/\bi\b/.test(t)) out.push('<b>Capitalisation:</b> the pronoun "I" is always capitalised.');
    if (/\bdont\b|\bcant\b|\bdoesnt\b|\bwont\b|\bisnt\b|\bwasnt\b/i.test(t)) out.push('<b>Apostrophes:</b> contractions like "don\u2019t / can\u2019t / doesn\u2019t" need apostrophes in standard writing.');
    if (/\bthere is\s+\w+\s+(are|is)\b/i.test(t) === false && /\bthere\s+is\s+(many|several|few)\b/i.test(t)) out.push('<b>Agreement:</b> "there are + plural" — check "there is many…" → "there are many…".');
    if (/\balot\b/i.test(t)) out.push('<b>Spelling:</b> "a lot" is two words (or use "many/much").');
    if (/\b(recieve|beleive|occured|seperate|definately)\b/i.test(t)) out.push('<b>Spelling:</b> watch common traps: receive, believe, occurred, separate, definitely.');
    if (/\s,/.test(t)) out.push('<b>Punctuation:</b> no space before a comma.');
    const long = t.split(/[.!?]/).find(s => s.trim().split(/\s+/).length > 45);
    if (long) out.push('<b>Long sentence:</b> one sentence exceeds 45 words. It may be correct — but check whether it should be split.');
    if (!/[.!?]$/.test(t.trim())) out.push('<b>Punctuation:</b> the text does not end with a full stop.');
    return out;
  }

  function historyMode(outlet) {
    const zone = document.getElementById('wz');
    if (!zone) return;
    zone.innerHTML = '';
    const h = Store.s.writing.history.slice().reverse();
    if (!h.length) { zone.appendChild(el('div', { class: 'empty' }, el('p', {}, 'No submissions yet. Your writing history will appear here.'))); return; }
    zone.appendChild(el('table', { class: 'table' },
      el('thead', {}, el('tr', {}, el('th', {}, 'Date'), el('th', {}, 'Task'), el('th', {}, 'Words'), el('th', {}, ''))),
      el('tbody', {}, ...h.map(x => el('tr', {},
        el('td', {}, UI.fmtDate(x.date)),
        el('td', { style: 'max-width:40ch' }, x.task),
        el('td', {}, String(x.words || 0)),
        el('td', {}, el('button', { class: 'btn small', onclick: () => UI.modal('Submission — ' + UI.fmtDate(x.date), [el('p', { class: 'mono' }, (x.correct === undefined ? '' : (x.correct ? 'Marked correct' : 'Needed correction'))), el('textarea', { class: 'input', rows: 10, readonly: true }, x.text)]) }, 'View'))
      )))));
  }

  window.WritingF = { render, ruleCheck };
  Router.add('writing', 'Writing', render);
})();

        el('h3', {}, 'Speech synthesis is unavailable in this browser'),
        el('p', {}, 'This exercise needs the browser\u2019s built-in speech synthesis. You can still read the transcript as a reading exercise once you attempt the questions, or use a browser that supports speech synthesis.')));
      return;
    }
    zone.innerHTML = '';
    let rate = 1;
    const fullText = l.tracks.map(t => t.text).join(' ');
    const status = el('span', { class: 'mono' }, 'Ready to play · rate ' + rate + '×');

    const controls = el('div', { class: 'pill-row', style: 'margin:14px 0' },
      el('button', { class: 'btn primary', onclick: () => { synth.speak(fullText, rate); status.textContent = 'Playing (synthetic voice)…'; } }, icon('play', 15) + ' Play all'),
      el('button', { class: 'btn small', onclick: () => { synth.speak(l.tracks.map(t => t.text).join(' '), Math.max(0.6, rate - 0.2)); rate = Math.max(0.6, rate - 0.2); status.textContent = 'Rate ' + rate.toFixed(1) + '×'; } }, '− Slower'),
      el('button', { class: 'btn small', onclick: () => { rate = Math.min(1.4, rate + 0.2); status.textContent = 'Rate ' + rate.toFixed(1) + '×'; } }, '+ Faster'),
      el('button', { class: 'btn small ghost', onclick: () => speechSynthesis.cancel() }, 'Stop'),
      status
    );

    zone.append(
      el('div', { class: 'card' },
        el('h3', {}, l.title),
        el('span', { class: 'chip accent' }, l.level + ' · ' + l.type),
        controls,
        el('details', { id: 'transcript', style: 'margin:10px 0' },
          el('summary', { class: 'mono', style: 'cursor:pointer' }, 'Reveal transcript (after attempting the questions)'),
          el('div', { style: 'margin-top:12px' }, ...l.tracks.map(t => el('p', { style: 'margin-bottom:10px' }, el('strong', { class: 'mono', style: 'text-transform:none' }, t.speaker + ': '), t.text)))),
        el('h4', { style: 'margin:16px 0 8px' }, 'Questions'),
        el('div', { id: 'lq' })
      )
    );

    // Dictation item
    const items = l.questions.map(q => q.type === 'dictation'
      ? { ...q, type: 'fill', q: q.q, answer: q.answer, skill: 'Dictation', level: l.level, mkey: l.id + ':dict',
          explain: 'Compare word by word. (Diff shows in feedback.)' }
      : { ...q, skill: 'Listening', level: l.level, mkey: l.id + ':' + q.q.slice(0, 30) });

    UI.runQuiz(document.getElementById('lq'), items, {
      type: 'listening',
      onDone: (r) => {
        const t = document.getElementById('transcript');
        if (t) { t.open = true; }
        Store.recordActivity({ skill: 'listening', minutes: 4, items: r.total });
        // word diff for dictation
        if (l.type === 'dictation') {
          const att = r.answered[0]?.user || '';
          const target = l.questions[0].answer;
          const diff = UI.diffWords(target, att);
          document.getElementById('lq').insertAdjacentHTML('afterbegin',
            '<div class="explain"><b>Word-by-word comparison:</b><br>' +
            diff.map(d => d.ok ? '<span class="w-ok">' + UI.esc(d.w) + '</span> ' : '<span class="w-bad">' + UI.esc(d.w || '—') + '</span>' + (d.target ? ' <span class="mono" style="text-transform:none">(' + UI.esc(d.target) + ')</span>' : '') + ' ')
            .join('') + '</div>');
        }
      }
    });
  }

  window.Listening = { render };
  Router.add('listening', 'Listening', render);
})();

/* ============================================================
   features/speaking.js — Speaking Studio + Pronunciation Lab.
   MediaRecorder only on demand; typed alternative always available;
   speech recognition offered only when the browser supports it.
   ============================================================ */
(function () {
  const { el, icon } = UI;
  const D = () => window.DATA;

  /* ============ Speaking Studio ============ */
  let si = 0;
  function render(outlet) {
    outlet.append(
      el('h2', {}, 'Speaking Studio'),
      el('p', { style: 'color:var(--ink-soft);margin:6px 0 18px' }, 'Respond aloud with a timer, record yourself (permission asked on demand), or type your answer. Feedback is self-evaluation — no automated scoring claims.'),
      el('div', { class: 'lib-grid', id: 'slist' }),
      el('div', { id: 'sz', style: 'margin-top:24px' })
    );
    paintList();
  }

  function paintList() {
    const list = document.getElementById('slist');
    if (!list) return;
    list.innerHTML = '';
    for (const [i, s] of D().speaking.entries()) {
      list.appendChild(el('button', { class: 'lib-card', onclick: () => stage(s) },
        el('span', { class: 'chip accent' }, s.level + ' · ' + s.mode),
        el('h3', { style: 'margin-top:8px' }, s.prompt.slice(0, 80) + '…'),
        el('div', { class: 'meta' }, el('span', { class: 'chip' }, icon('timer', 12) + ' ' + s.seconds + 's'))));
    }
  }

  function stage(s) {
    const zone = document.getElementById('sz');
    if (!zone) return;
    zone.innerHTML = '';
    let timeLeft = s.seconds, timerId = null, running = false, rec = null, chunks = [], recURL = null;
    const display = el('span', { class: 'mono', style: 'font-size:1.2rem;font-variant-numeric:tabular-nums' }, fmt(timeLeft));
    const startBtn = el('button', { class: 'btn primary', onclick: () => running ? pause() : start() }, 'Start response timer');

    function fmt(t) { return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); }
    function start() { running = true; startBtn.textContent = 'Pause'; timerId = setInterval(() => { timeLeft--; display.textContent = fmt(Math.max(0, timeLeft)); if (timeLeft <= 0) { pause(); UI.toast('Time — well done.', 'ok'); } }, 1000); }
    function pause() { running = false; startBtn.textContent = 'Resume'; clearInterval(timerId); }

    const typed = el('textarea', { class: 'input', rows: 5, placeholder: 'Or type/plan your answer here…', 'aria-label': 'Typed response', id: 'typed' });
    typed.addEventListener('input', () => { Store.s.writing.drafts['speak:' + s.id] = typed.value; Store.save(); });
    typed.value = Store.s.writing.drafts['speak:' + s.id] || '';

    const recordBtn = el('button', { class: 'btn', onclick: () => toggleRec() }, icon('mic', 15) + ' Record my attempt');
    const recStatus = el('span', { class: 'mono' }, '');

    async function toggleRec() {
      if (rec) { rec.stop(); return; }
      if (!navigator.mediaDevices?.getUserMedia) { recStatus.textContent = 'Recording not supported in this browser — use the typed response instead.'; return; }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        rec = new MediaRecorder(stream);
        chunks = [];
        rec.ondataavailable = e => chunks.push(e.data);
        rec.onstop = () => {
          stream.getTracks().forEach(t => t.stop());
          const blob = new Blob(chunks, { type: rec.mimeType });
          recURL = URL.createObjectURL(blob);
          recordBtn.innerHTML = icon('mic', 15) + ' Re-record';
          recStatus.innerHTML = '';
          recStatus.appendChild(audioEl(recURL));
          rec = null;
        };
        rec.start();
        recordBtn.innerHTML = '<span class="rec-dot"></span> Stop recording';
        recStatus.textContent = 'Recording… (stays on your device only)';
      } catch (e) {
        recStatus.textContent = e.name === 'NotAllowedError' ? 'Microphone permission denied. You can retry, or use the typed response instead.' : 'Could not record: ' + e.message;
      }
    }
    function audioEl(url) {
      const a = el('audio', { controls: true, src: url, style: 'width:100%;max-width:420px' });
      return a;
    }

    // Optional speech recognition
    let recogOn = false, recog = null;
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const srBtn = SR ? el('button', { class: 'btn small', onclick: () => {
      if (recogOn) { recog.stop(); return; }
      recog = new SR(); recog.continuous = true; recog.interimResults = false; recog.lang = 'en-GB';
      const t = document.getElementById('typed');
      recog.onresult = (e) => { for (const r of e.results) t.value += (t.value ? ' ' : '') + r[0].transcript; };
      recog.onend = () => { recogOn = false; srBtn.textContent = '🎙 Live transcript (experimental)'; };
      recog.onerror = () => { recogOn = false; srBtn.textContent = '🎙 Live transcript (experimental)'; };
      recog.start(); recogOn = true; srBtn.textContent = '⏹ Stop live transcript';
    } }, '🎙 Live transcript (experimental)') : el('span', { class: 'mono' }, 'Live transcript unavailable in this browser');

    zone.append(
      el('div', { class: 'card' },
        el('span', { class: 'chip accent' }, s.level + ' · ' + s.mode),
        el('div', { class: 'speak-stage' },
          el('p', { class: 'prompt' }, s.prompt),
          el('div', { class: 'pill-row', style: 'justify-content:center' },
            startBtn, display, recordBtn, srBtn),
          recStatus,
          typed,
          el('div', { class: 'pill-row', style: 'justify-content:center' },
            el('button', { class: 'btn primary', onclick: () => saveAttempt(s, typed.value) }, 'Save attempt'),
            el('button', { class: 'btn ghost', onclick: () => stage(s) }, 'New prompt')))
      ),
      el('div', { class: 'card', style: 'margin-top:16px' },
        el('h4', {}, 'Response tips'),
        el('ul', { class: 'rubric' }, s.tips.map(t => el('li', {}, t)) ),
        el('h4', { style: 'margin-top:14px' }, 'Self-evaluation rubric (IELTS criteria)'),
        el('ul', { class: 'rubric' }, D().ieltsSpeaking.rubric.map(t => el('li', {}, t))),
        el('p', { style: 'font-size:.8rem;color:var(--ink-faint);margin-top:10px' }, 'Rate yourself honestly against each criterion — this app does not score your speech automatically.'))
    );
  }

  function saveAttempt(s, text) {
    if (!text.trim()) { UI.toast('Speak or type something first — saving helps you track growth over time.'); return; }
    Store.s.writing.history.push({ id: Date.now(), task: 'Speaking: ' + s.prompt.slice(0, 70), text, date: Date.now(), words: text.trim().split(/\s+/).length, speaking: true });
    Store.save();
    Store.recordActivity({ skill: 'speaking', minutes: 2, items: 1 });
    UI.toast('Attempt saved to your history.', 'ok');
  }

  /* ============ Pronunciation Lab ============ */
  function renderPron(outlet) {
    outlet.append(
      el('h2', {}, 'Pronunciation Lab'),
      el('p', { style: 'color:var(--ink-soft);margin:6px 0 8px' }, 'Model audio uses your browser\u2019s synthetic voice — clearly labeled as such.'),
      el('p', { class: 'mono', style: 'color:var(--warn);margin-bottom:20px' }, 'Goal: intelligibility and clear communication — not eliminating your accent.'),
      ...D().pronunciation.map(p => el('div', { class: 'card', style: 'margin-bottom:16px' },
        el('div', { style: 'display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap' },
          el('div', {},
            el('h3', {}, p.title),
            el('span', { class: 'chip accent' }, p.level)),
          el('button', { class: 'btn small', onclick: () => { if (!UI.synth.speak(p.drill)) UI.toast('Speech synthesis unavailable in this browser.', 'err'); } }, '🔊 Hear model (synthetic)')),
        el('div', { style: 'display:flex;flex-wrap:wrap;gap:8px;margin:12px 0' },
          ...p.words.map(w => el('button', { class: 'btn small', onclick: () => { if (w[0] && /[a-z]/i.test(w[0][0])) UI.synth.speak(w[0]); else UI.synth.speak(w[1]); } }, w.join(' · ')))),
        el('p', { style: 'font-size:.9rem' }, el('b', {}, 'Drill: '), '"' + p.drill + '"'),
        el('p', { style: 'font-size:.88rem;color:var(--ink-soft);margin-top:8px' }, p.note),
        el('details', { style: 'margin-top:8px' },
          el('summary', { class: 'mono', style: 'cursor:pointer' }, 'Record & compare (optional)'),
          el('p', { style: 'font-size:.82rem;color:var(--ink-faint);margin:8px 0' }, 'Recording lets you listen back and compare by ear. No waveform is analysed and no automatic pronunciation verdict is claimed.'))
      ))
    );
  }

  window.Speaking = { render, renderPron };
  Router.add('speaking', 'Speaking', render);
  Router.add('pronunciation', 'Pronunciation', renderPron);
})();

/* ============================================================
   features/ielts.js — IELTS Academy: dashboard, reading exam mode,
   Writing Task 1/2 workspaces, Speaking Parts 1–3, history.
   ============================================================ */
(function () {
  const { el, icon } = UI;
  const D = () => window.DATA;

  /* ---------- Dashboard ---------- */
  function render(outlet) {
    const S = Store.s;
    const res = S.ielts.results;
    const bySkill = {};
    for (const r of res) { (bySkill[r.skill] = bySkill[r.skill] || []).push(r); }
    outlet.append(
      el('h2', {}, 'IELTS Academy'),
      el('p', { style: 'color:var(--ink-soft);margin:6px 0 16px' }, 'Target: Academic Band ' + S.prefs.targetBand + '+. All scores here are practice estimates or self-assessments — never official IELTS results.'),
      el('div', { class: 'grid cols-4', style: 'margin-bottom:24px' },
        ...[['Reading', examAccuracy('Reading')], ['Listening', examAccuracy('Listening')], ['Writing', res.filter(r => r.skill === 'Writing').length + ' tasks'], ['Speaking', res.filter(r => r.skill === 'Speaking').length + ' sessions']].map(([k, v]) =>
          el('div', { class: 'card flat stat' }, el('div', { class: 'v' }, String(v)), el('div', { class: 'k' }, k)))
      ),
      el('div', { class: 'grid cols-2' },
        el('div', { class: 'card' },
          el('h3', { style: 'margin-bottom:12px' }, 'Practice'),
          el('div', { class: 'grid', style: 'gap:10px' },
            ...D().ieltsReading.map(set => el('a', { class: 'btn', href: '#/ielts/reading/' + set.id }, icon('book', 15) + ' ' + set.title + ' (' + set.minutes + ' min)')),
            el('a', { class: 'btn', href: '#/ielts/writing' }, icon('pen', 15) + ' Writing Task 1 & 2'),
            el('a', { class: 'btn', href: '#/ielts/speaking' }, icon('mic', 15) + ' Speaking Parts 1–3'),
            el('a', { class: 'btn ghost', href: '#/ielts/strategy', style: 'justify-content:flex-start' }, icon('learn', 15) + ' Test format, band descriptors & strategies'))
        ),
        el('div', { class: 'card' },
          el('h3', { style: 'margin-bottom:12px' }, 'Recent results'),
          res.length ? el('table', { class: 'table' },
            el('thead', {}, el('tr', {}, el('th', {}, 'Date'), el('th', {}, 'Skill'), el('th', {}, 'Result'))),
            el('tbody', {}, ...res.slice(-8).reverse().map(r => el('tr', {},
              el('td', {}, UI.fmtDate(r.date)),
              el('td', {}, r.skill + (r.type ? ' · ' + r.type : '')),
              el('td', {}, r.band != null ? el('span', { class: 'chip accent' }, '≈ Band ' + r.band + ' (practice est.)') : el('span', { class: 'chip' }, r.detail))
            )))) :
          el('div', { class: 'empty', style: 'border:none;padding:24px 0' }, el('p', {}, 'No practice results yet. Reading sets are the fastest place to start — they produce banded practice estimates.')),
          el('div', { style: 'margin-top:14px' },
            el('h4', {}, 'Official score (optional)'),
            el('p', { style: 'font-size:.82rem;color:var(--ink-faint);margin:6px 0' }, 'If you have taken a real test, record your official bands here to compare. This is self-reported.'),
            el('div', { class: 'pill-row' },
              el('button', { class: 'btn small', onclick: () => {
                const inp = document.getElementById('off');
                const v = (inp.value || '').trim();
                if (v) { S.ielts.official = { bands: v, date: Date.now() }; Store.save(); UI.toast('Official score recorded.', 'ok'); Router.run(); }
              } }, 'Save'),
              el('input', { class: 'input', id: 'off', style: 'max-width:220px', placeholder: 'e.g. L7 R6.5 W6 S6.5', 'aria-label': 'Official bands' }),
              S.ielts.official ? el('span', { class: 'chip good' }, 'Saved: ' + S.ielts.official.bands) : null)
          )
        )
      )
    );

    function examAccuracy(skill) {
      const rs = bySkill[skill] || [];
      if (!rs.length) return '—';
      const avg = rs.reduce((a, r) => a + (r.pct || 0), 0) / rs.length;
      return Math.round(avg) + '%';
    }
  }

  /* ---------- Exam-mode reading set ---------- */
  function renderSet(outlet, params) {
    const set = D().ieltsReading.find(s => s.id === params.id);
    if (!set) { outlet.appendChild(el('div', { class: 'empty' }, el('p', {}, 'Set not found.'))); return; }
    const answers = {};
    const flagged = {};
    let left = set.minutes * 60, timerId = null;

    outlet.append(
      el('a', { class: 'btn small ghost', href: '#/ielts', style: 'margin-bottom:12px' }, '← IELTS Academy'),
      el('div', { class: 'exam' },
        el('div', { class: 'exam-head' },
          el('strong', {}, set.title),
          el('span', { class: 'timer', id: 'ex-timer', role: 'timer', 'aria-label': 'Time remaining' }, fmtT(left)),
          el('button', { class: 'btn small', id: 'ex-toggle', onclick: (e) => { timerId ? stopTimer(e) : startTimer(); } }, 'Start timer'),
          el('button', { class: 'btn small primary', onclick: () => submit() }, 'Submit answers'),
          el('span', { class: 'mono' }, Object.keys(answers).length + '/' + set.questions.length + ' answered')
        ),
        el('div', { class: 'exam-body' },
          el('div', { class: 'exam-passage reading-body', id: 'ex-pass' }),
          el('div', { class: 'exam-questions', id: 'ex-qs' })
        )
      )
    );
    document.getElementById('ex-pass').append(...set.passage.map(p => el('p', {}, p)));

    const qs = document.getElementById('ex-qs');
    const answerCount = () => { qs.querySelector('.mono').textContent = Object.keys(answers).length + '/' + set.questions.length + ' answered'; };
    qs.appendChild(el('span', { class: 'mono' }, ''));
    set.questions.forEach(q => {
      const block = el('div', { style: 'padding:14px 0;border-bottom:1px solid var(--line-soft)', id: 'iq-' + q.no },
        el('div', { style: 'display:flex;gap:10px;align-items:flex-start' },
          el('strong', { style: 'color:var(--accent);flex:none' }, String(q.no) + '.'),
          el('div', { style: 'flex:1' },
            el('p', { style: 'margin-bottom:10px' }, q.q),
            q.type === 'mc' ? mcUI(q) : q.type === 'tfng' ? tfngUI(q) : fillUI(q))),
        el('button', { class: 'btn small ghost q-flag', 'aria-pressed': 'false', onclick: (e) => { flagged[q.no] = !flagged[q.no]; e.currentTarget.classList.toggle('on', !!flagged[q.no]); e.currentTarget.setAttribute('aria-pressed', String(!!flagged[q.no])); } }, '⚑ Flag')
      );
      qs.appendChild(block);

      function mcUI(q) {
        const zone = el('div');
        q.options.forEach((opt, oi) => {
          zone.appendChild(el('button', { class: 'quiz-opt', style: 'margin-bottom:8px', dataset: { i: String(oi) }, onclick: (e) => {
            answers[q.no] = oi;
            [...zone.querySelectorAll('.quiz-opt')].forEach(b => b.classList.remove('correct'));
            e.currentTarget.classList.add('correct');
            answerCount();
          } }, el('span', { class: 'key' }, String.fromCharCode(65 + oi)), el('span', {}, opt)));
        });
        return zone;
      }
      function tfngUI(q) {
        const zone = el('div', { class: 'seg' });
        q.options.forEach((opt, oi) => {
          zone.appendChild(el('button', { 'aria-pressed': 'false', onclick: (e) => {
            answers[q.no] = oi;
            [...zone.querySelectorAll('button')].forEach(b => b.setAttribute('aria-pressed', 'false'));
            e.currentTarget.setAttribute('aria-pressed', 'true');
            answerCount();
          } }, opt));
        });
        return zone;
      }
      function fillUI(q) {
        return el('input', { class: 'input', placeholder: 'Your answer', 'aria-label': 'Question ' + q.no, oninput: (e) => { answers[q.no] = e.target.value; answerCount(); } });
      }
    });

    function fmtT(s) { return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
    function startTimer() { timerId = setInterval(() => { left--; document.getElementById('ex-timer').textContent = fmtT(Math.max(0, left)); if (left <= 0) { stopTimer(); UI.toast('Time is up — submit now.', 'err'); } }, 1000); document.getElementById('ex-toggle').textContent = 'Pause timer'; }
    function stopTimer(e) { clearInterval(timerId); timerId = null; document.getElementById('ex-toggle').textContent = 'Resume timer'; }

    function submit() {
      stopTimer();
      let correct = 0;
      const missed = [], wrong = [];
      for (const q of set.questions) {
        const a = answers[q.no];
        const given = a === undefined ? null : (q.type === 'fill' ? UI.norm(a) : q.options[a]);
        const ans = q.type === 'fill' ? UI.norm(q.answer) : q.options[q.answer];
        if (a === undefined) missed.push(q.no);
        else if (given === ans || (q.type === 'fill' && given === ans)) correct++;
        else if (q.type === 'fill' ? given !== ans : given !== ans) wrong.push(q.no);
      }
      const pct = Math.round((correct / set.questions.length) * 100);
      const band = D().ieltsBand.estimate(correct, set.questions.length, D().ieltsBand.reading);
      Store.s.ielts.results.push({ date: Date.now(), skill: 'Reading', type: set.title, pct, correct, total: set.questions.length, band });
      Store.save();
      Store.recordActivity({ skill: 'reading', minutes: set.minutes, items: set.questions.length });

      // Review view
      outlet.innerHTML = '';
      outlet.append(
        el('h2', {}, 'Review — ' + set.title),
        el('div', { class: 'card tint', style: 'margin-bottom:20px' },
          el('div', { class: 'grid cols-4' },
            ...[[String(correct) + '/' + set.questions.length, 'Correct'], [pct + '%', 'Accuracy'], ['≈ ' + band, 'Practice band est.'], [missed.length ? missed.length + ' unanswered' : 'All attempted', 'Completion']].map(([v, k]) =>
              el('div', { class: 'stat' }, el('div', { class: 'v' }, v), el('div', { class: 'k' }, k)))),
          el('p', { style: 'font-size:.8rem;color:var(--ink-faint);margin-top:12px' }, D().ieltsBand.note)),
        ...set.questions.map(q => {
          const a = answers[q.no];
          const correctOpt = q.type === 'fill' ? q.answer : q.options[q.answer];
          const yourAns = a === undefined ? null : (q.type === 'fill' ? a : q.options[a]);
          const ok = a !== undefined && (q.type === 'fill' ? UI.norm(a) === UI.norm(q.answer) : a === q.answer);
          if (!ok && a !== undefined) Store.recordMistake('ielts:' + set.id + ':' + q.no, { type: 'ielts-reading', ref: q.q.slice(0, 80) });
          return el('div', { class: 'card flat', style: 'margin-bottom:12px;padding:16px' },
            el('div', { style: 'display:flex;gap:10px' },
              el('span', { class: 'chip ' + (ok ? 'good' : a === undefined ? 'warn' : 'bad') }, ok ? '✓' : a === undefined ? 'unanswered' : '✗'),
              el('p', { style: 'flex:1' }, el('strong', {}, q.no + '. '), q.q)),
            el('p', { style: 'font-size:.88rem;margin:8px 0 4px' }, 'Your answer: ', el('b', {}, yourAns === null ? '—' : String(yourAns)), ' · Correct: ', el('b', { style: 'color:var(--good)' }, String(correctOpt))),
            el('p', { style: 'font-size:.88rem;color:var(--ink-soft)' }, q.explain),
            flagged[q.no] ? el('span', { class: 'chip warn' }, 'you flagged this') : null
          );
        }),
        el('div', { class: 'pill-row' },
          el('a', { class: 'btn primary', href: '#/ielts' }, 'Back to IELTS Academy'),
          el('a', { class: 'btn', href: '#/review' }, 'Review mistakes'))
      );
    }
  }

  /* ---------- Writing ---------- */
  function renderWriting(outlet) {
    const S = Store.s;

/* ============================================================
   features/review.js — Review Center: due vocab, recurring
   mistakes, unfinished work. Every item explains why it's here.
   ============================================================ */
(function () {
  const { el, icon } = UI;
  const D = () => window.DATA;

  function render(outlet) {
    const S = Store.s;
    const due = SRS.dueList();
    const mistakes = Object.entries(S.mistakes).sort((a, b) => b[1].count - a[1].count);
    const unfinished = Object.entries(S.lessons).filter(([, L]) => L.status === 'in-progress');

    outlet.append(
      el('h2', {}, 'Review Center'),
      el('p', { style: 'color:var(--ink-soft);margin:6px 0 20px' }, 'Everything here is scheduled by your actual activity — nothing is filler.'),
      el('div', { class: 'grid cols-2' },
        el('div', { class: 'card' },
          el('h3', { style: 'margin-bottom:12px' }, 'Vocabulary due today'),
          due.length ? el('div', {},
            el('p', { style: 'font-size:.9rem;color:var(--ink-soft);margin-bottom:12px' }, due.length + ' card' + (due.length > 1 ? 's' : '') + ' have reached their spaced-repetition interval. Reviewing on time is what makes the scheduler work.'),
            ...due.slice(0, 8).map(id => {
              const w = D().vocabulary.find(v => v.id === id);
              return el('div', { class: 'mission-item' }, el('strong', {}, w ? w.word : S.vocab[id].word), el('span', { class: 'mono' }, 'lapses: ' + S.vocab[id].lapses));
            }),
            el('a', { class: 'btn primary', href: '#/vocabulary', style: 'margin-top:12px' }, 'Start review')) :
          el('div', { class: 'empty', style: 'border:none;padding:20px 0' }, el('p', {}, 'No reviews due. New words enter the schedule as you learn them.'))),
        el('div', { class: 'card' },
          el('h3', { style: 'margin-bottom:12px' }, 'Recurring difficulties'),
          mistakes.length ? el('ul', { class: 'rubric' }, ...mistakes.slice(0, 10).map(([key, m]) => {
            const target = mistakeTarget(key, m);
            return el('li', {},
              el('div', { style: 'flex:1' }, el('b', {}, target.label), el('br'), el('span', { style: 'font-size:.82rem;color:var(--ink-faint)' }, 'missed ' + m.count + '× · ' + (m.type || 'practice') + (m.level ? ' · ' + m.level : ''))),
              target.href ? el('a', { class: 'btn small', href: target.href }, 'Redo') : null,
              el('button', { class: 'btn small ghost', 'aria-label': 'Mark resolved', onclick: () => { Store.clearMistake(key); Router.run(); } }, '✓ Resolved'));
          })) :
          el('div', { class: 'empty', style: 'border:none;padding:20px 0' }, el('p', {}, 'No recorded mistakes yet. When you miss a question, it appears here for targeted practice.')))
      ),
      el('div', { class: 'card', style: 'margin-top:20px' },
        el('h3', { style: 'margin-bottom:12px' }, 'Unfinished activities'),
        unfinished.length ? el('ul', { class: 'rubric' }, unfinished.map(([id, L]) => {
          const g = D().grammar.find(x => x.id === id);
          return el('li', {}, el('a', { href: '#/grammar/' + id }, g ? g.title : id), ' — best score so far: ' + (L.best || 0) + '%. Finish it to close the loop.');
        })) : el('p', { style: 'font-size:.92rem;color:var(--ink-soft)' }, 'Nothing in progress. Start something new from the Dashboard or Learn page.'))
    );
  }

  function mistakeTarget(key, m) {
    if (key.startsWith('g-')) { const g = window.DATA.grammar.find(x => key.startsWith(x.id)); return { label: 'Grammar: ' + (g ? g.title : key), href: g ? '#/grammar/' + g.id : '#/grammar' }; }
    if (key.startsWith('ielts:')) { const setId = key.split(':')[1]; return { label: 'IELTS Reading question: ' + (m.ref || ''), href: '#/ielts/reading/' + setId }; }
    if (key.startsWith('wf:')) return { label: 'Word formation: "' + key.slice(3) + '"', href: '#/vocabulary' };
    if (key.startsWith('conf:')) return { label: 'Confused words: ' + key.slice(5), href: '#/vocabulary' };
    const w = window.DATA.vocabulary.find(v => v.id === key);
    if (w) return { label: 'Vocabulary: "' + w.word + '"', href: '#/vocabulary' };
    const r = window.DATA.reading.find(v => key.startsWith(v.id));
    if (r) return { label: 'Reading: "' + r.title + '" — ' + (m.ref || ''), href: '#/reading/' + r.id };
    return { label: m.ref || key, href: null };
  }

  window.Review = { render };
  Router.add('review', 'Review', render);
})();

/* ============================================================
   features/assessments.js — placement + level checkpoints.
   ============================================================ */
(function () {
  const { el, icon } = UI;
  const D = () => window.DATA;

  function render(outlet) {
    const S = Store.s;
    outlet.append(
      el('h2', {}, 'Assessment Center'),
      el('p', { style: 'color:var(--ink-soft);margin:6px 0 20px' }, 'Assessments calibrate your path. A short test can only estimate — it never assigns a definitive CEFR level.'),
      el('div', { class: 'grid cols-2' },
        el('div', { class: 'card tint' },
          el('h3', {}, 'Placement assessment'),
          el('p', { style: 'font-size:.9rem;color:var(--ink-soft);margin:8px 0' }, '14 questions from B1 to C2. ≈5 minutes. Sets your recommended starting level.'),
          S.profile.placementDone ? el('div', {},
            el('span', { class: 'chip good' }, 'Completed'),
            el('p', { style: 'margin-top:10px' }, 'Estimated level: ', el('b', {}, S.assessments.placement.level), ' (' + S.assessments.placement.pct + '%). ', S.assessments.placement.note || ''),
            el('button', { class: 'btn small', onclick: () => runPlacement(outlet) }, 'Retake')) :
          el('button', { class: 'btn primary', onclick: () => runPlacement(outlet) }, 'Start placement'))
      ),
      el('div', { class: 'grid cols-2', style: 'margin-top:20px' },
        ...D().curriculum.levelOrder.map(lvl => {
          const done = S.assessments.checkpoints[lvl];
          return el('div', { class: 'card' },
            el('div', { style: 'display:flex;justify-content:space-between;align-items:center' },
              el('h3', {}, lvl + ' checkpoint'),
              done ? el('span', { class: 'chip good' }, done.pct + '%') : el('span', { class: 'chip' }, 'not taken')),
            el('p', { style: 'font-size:.86rem;color:var(--ink-soft);margin:6px 0 12px' }, D().checkpoints[lvl].length + ' mixed-skill questions. Pass threshold: 70%.'),
            el('button', { class: 'btn small', onclick: () => runCheckpoint(outlet, lvl) }, done ? 'Retake' : 'Start checkpoint'));
        }))
    );
  }

  function runPlacement(outlet) {
    const zone = el('div', { style: 'margin-top:20px' });
    outlet.appendChild(zone);
    const qs = D().placement.map((q, i) => ({ q: q.q, options: q.options, answer: q.options[q.answer], level: q.level, explain: q.explain, skill: 'Placement', mkey: 'place:' + i }));
    zone.appendChild(el('h3', {}, 'Placement — answer honestly; wrong answers are informative too.'));
    UI.runQuiz(zone.appendChild(el('div', {})), qs, {
      type: 'assessment', track: false,
      onDone: (r) => {
        // Level estimate: how far did the learner get with correct answers?
        const answered = r.answered;
        const levels = ['B1', 'B2', 'C1', 'C2'];
        let cutoff = 0;
        // find highest level where learner answered its questions mostly correctly
        const per = {};
        D().placement.forEach((q, i) => { per[q.level] = per[q.level] || { c: 0, t: 0 }; per[q.level].t++; if (answered[i]?.correct) per[q.level].c++; });
        let est = 'B1';
        if ((per['B1']?.c / per['B1']?.t) >= 0.6) est = 'B1';
        if ((per['B2']?.c / per['B2']?.t) >= 0.6) est = 'B2';
        if ((per['C1']?.c / per['C1']?.t) >= 0.6) est = 'C1';
        if ((per['C2']?.c / per['C2']?.t) >= 0.5) est = 'C2';
        const strengths = Object.entries(per).filter(([, v]) => v.c / v.t >= 0.6).map(([k]) => k);
        const weak = Object.entries(per).filter(([, v]) => v.c / v.t < 0.5).map(([k]) => k);
        Store.s.assessments.placement = { date: Date.now(), level: est, pct: r.pct, note: 'Estimate based on ' + r.total + ' questions — indicative only.' };
        Store.s.profile.level = est; Store.s.profile.placementDone = true;
        Store.save();
        Store.recordActivity({ skill: 'grammar', minutes: 5, items: r.total });
        zone.appendChild(el('div', { class: 'card tint', style: 'margin-top:16px' },
          el('h3', {}, 'Estimated starting level: ' + est),
          el('p', { style: 'margin:8px 0' }, 'Strengths: ' + (strengths.join(', ') || '—') + ' · To develop: ' + (weak.join(', ') || '—')),
          el('p', { style: 'font-size:.84rem;color:var(--ink-faint)' }, 'This is an estimate from a short sample, not a CEFR certification. Your level will be refined as you work through the curriculum.'),
          el('a', { class: 'btn primary', href: '#/dashboard' }, 'Continue to dashboard')));
      }
    });
  }

  function runCheckpoint(outlet, lvl) {
    const zone = el('div', { style: 'margin-top:20px' });
    outlet.appendChild(zone);
    zone.appendChild(el('h3', {}, lvl + ' checkpoint'));
    UI.runQuiz(zone.appendChild(el('div', {})), D().checkpoints[lvl].map((q, i) => ({ q: q.q, options: q.options, answer: q.options[q.answer], level: lvl, explain: q.explain, skill: q.skill, mkey: 'chk:' + lvl + ':' + i })), {
      type: 'assessment',
      onDone: (r) => {
        const pass = r.pct >= 70;
        Store.s.assessments.checkpoints[lvl] = { date: Date.now(), pct: r.pct, passed: pass };
        if (pass && D().curriculum.levelOrder.indexOf(lvl) < 3) {
          const next = D().curriculum.levelOrder[D().curriculum.levelOrder.indexOf(lvl) + 1];
          zone.appendChild(el('div', { class: 'explain ok' }, el('b', {}, 'Checkpoint passed (' + r.pct + '%).'), ' You are ready to work at ' + next + '. Your profile level is unchanged until you feel confident — change it any time in Settings.'));
        } else {
          zone.appendChild(el('div', { class: 'explain ' + (pass ? 'ok' : 'err') },
            pass ? 'Checkpoint passed (' + r.pct + '%).' : 'Not yet (' + r.pct + '%) — 70% is the threshold. The Review Center now lists what to target.'));
        }
        Store.save();
        Store.recordActivity({ skill: 'grammar', minutes: 5, items: r.total });
      }
    });
  }

  window.Assessments = { render };
  Router.add('assessments', 'Assessments', render);
})();
