(function () {
  const { el, esc } = UI;

  function lastNDays(n) {
    const days = [];
    for (let i = n - 1; i >= 0; i--) {
      const d = new Date(); d.setDate(d.getDate() - i);
      days.push(Store.todayStr(d));
    }
    return days;
  }

  function render(outlet) {
    const S = Store.s;
    const days = Object.keys(S.activity).sort();
    const active = days.length;
    const totalMin = days.reduce((a, d) => a + (S.activity[d].min || 0), 0);
    const totalItems = days.reduce((a, d) => a + (S.activity[d].items || 0), 0);

    // 14-day activity chart
    const wk = lastNDays(14).map(d => S.activity[d] ? S.activity[d].min : 0);

    // Accuracy trend (quiz attempts across lessons, in chronological order)
    const attempts = [];
    Object.entries(S.lessons).forEach(([, L]) => (L.attempts || []).forEach(a => attempts.push(a)));
    attempts.sort((a, b) => a.ts - b.ts);
    const trend = attempts.slice(-12).map(a => a.score);

    // Skill distribution (all-time)
    const skills = {};
    days.forEach(d => Object.entries(S.activity[d].skills || {}).forEach(([k, v]) => { skills[k] = (skills[k] || 0) + v; }));

    // IELTS results
    const ielts = S.ielts.results || [];

    outlet.append(
      el('h2', {}, 'Progress'),
      el('p', { style: 'color:var(--ink-soft);margin:6px 0 20px' }, 'Every number below is computed from your stored activity — nothing here is simulated.'),
      el('div', { class: 'grid cols-4' },
        stat(String(S.streak.current), 'Day streak', 'best: ' + S.streak.longest),
        stat(fmtMin(totalMin), 'Study time', active + ' active day' + (active === 1 ? '' : 's')),
        stat(String(totalItems), 'Activities', ''),
        stat(String(Object.keys(S.vocab).length), 'Words saved', SRS.dueList().length + ' due')
      ),
      active === 0 ? el('div', { class: 'empty', style: 'margin:16px 0' },
        el('p', {}, 'No activity recorded yet. Complete a daily session or any exercise, and your analytics will start building here.')) : null,
      el('div', { class: 'grid cols-2' },
        el('div', { class: 'card' },
          el('h3', { style: 'margin-bottom:10px' }, 'Study minutes — last 14 days'),
          active ? el('div', { html: UI.barChart(wk.map((v, i) => ({ label: i === 13 ? 'today' : '', value: v }))) })
                 : el('p', { style: 'font-size:.88rem;color:var(--ink-faint)' }, 'Chart appears once you record your first activity.'),
          el('p', { class: 'mono', style: 'font-size:.78rem;color:var(--ink-faint);margin-top:8px' }, 'Daily goal: ' + S.prefs.dailyGoalMin + ' min')),
        el('div', { class: 'card' },
          el('h3', { style: 'margin-bottom:10px' }, 'Practice accuracy trend'),
          trend.length >= 2 ? el('div', { html: UI.sparkline(trend) }) :
            el('p', { style: 'font-size:.88rem;color:var(--ink-faint)' }, 'At least two graded exercises are needed to draw a trend. Each point is one exercise score (%).'),
          trend.length ? el('p', { class: 'mono', style: 'font-size:.78rem;color:var(--ink-faint);margin-top:8px' }, 'last: ' + trend[trend.length - 1] + '% · ' + trend.length + ' recorded attempts') : null)
      ),
      el('div', { class: 'card', style: 'margin-top:20px' },
        el('h3', { style: 'margin-bottom:12px' }, 'Skill breakdown'),
        skillTable(skills)),
      el('div', { class: 'card', style: 'margin-top:20px' },
        el('h3', { style: 'margin-bottom:12px' }, 'Learning calendar'),
        el('div', { style: 'overflow-x:auto' }, UI.heatmap()),
        el('p', { style: 'font-size:.82rem;color:var(--ink-faint);margin-top:8px' }, 'Darker cells mean more minutes studied that day.')),
      el('div', { class: 'card', style: 'margin-top:20px' },
        el('h3', { style: 'margin-bottom:12px' }, 'IELTS practice history'),
        ielts.length ? el('table', { class: 'tbl' },
          el('thead', {}, el('tr', {}, el('th', {}, 'Date'), el('th', {}, 'Skill'), el('th', {}, 'Result'), el('th', {}, 'Notes'))),
          el('tbody', {}, ...ielts.slice().reverse().map(r => el('tr', {},
            el('td', {}, UI.fmtDate(r.date)), el('td', {}, r.skill || 'Reading'),
            el('td', {}, r.raw !== undefined ? r.raw + '/' + r.total + ' · ~' + r.band : (r.note || '—')),
            el('td', {}, r.label || ''))))) :
        el('p', { style: 'font-size:.88rem;color:var(--ink-faint)' }, 'No IELTS practice yet. Timed Reading sets and Writing tasks record their results here automatically. Official scores can be entered manually in the IELTS Academy.'))
    );
  }

  function stat(v, label, sub) {
    return el('div', { class: 'stat' }, el('div', { class: 'v' }, v), el('div', { class: 'k' }, label), sub ? el('div', { class: 'k', style: 'text-transform:none;letter-spacing:0' }, sub) : null);
  }
  function fmtMin(m) { return m >= 60 ? Math.floor(m / 60) + 'h ' + (m % 60) + 'm' : m + 'm'; }

  function skillTable(skills) {
    const rows = ['reading', 'writing', 'vocabulary', 'grammar', 'listening', 'speaking', 'ielts'];
    const max = Math.max(1, ...rows.map(r => skills[r] || 0));
    const tr = (cells) => el('tr', {}, ...cells.map((c, i) => el(i === 0 ? 'th' : 'td', { scope: i === 0 ? 'row' : undefined }, c)));
    const tb = el('tbody', {}, ...rows.map(r => tr([r === 'ielts' ? 'IELTS' : r[0].toUpperCase() + r.slice(1), String(skills[r] || 0)])));
    return el('table', { style: 'width:100%;border-collapse:collapse;font-size:.9rem' }, tb);
  }

  window.Progress = { render };
  Router.add('progress', 'Progress', render);
})();

/* ============================================================
   features/planner.js — Study Planner + Pomodoro timer
   ============================================================ */
(function () {
  const { el } = UI;
  let tick = null, remaining = 25 * 60, running = false, mode = 'focus'; // focus | break

  function render(outlet) {
    const S = Store.s;
    const mission = Dashboard.missionState();
    outlet.append(
      el('h2', {}, 'Study Planner'),
      el('p', { style: 'color:var(--ink-soft);margin:6px 0 20px' }, 'Small daily targets beat occasional marathons. Keep the default plan realistic.'),
      el('div', { class: 'grid cols-2' },
        el('div', { class: 'card' },
          el('h3', { style: 'margin-bottom:12px' }, 'Daily targets'),
          numRow('Study minutes per day', 'dailyGoalMin', [5, 10, 15, 20, 30]),
          numRow('New words per day', 'dailyNewWords', [3, 5, 8, 10]),
          numRow('Review cards per day', 'dailyReviewCards', [5, 10, 15, 20]),
          numRow('Target IELTS band', 'targetBand', [6.5, 7, 7.5, 8]),
          el('p', { style: 'font-size:.82rem;color:var(--ink-faint);margin-top:12px' }, 'These goals drive your daily mission and the dashboard recommendations.')),
        el('div', { class: 'card' },
          el('h3', { style: 'margin-bottom:12px' }, 'Today'),
          el('p', { style: 'font-size:.92rem' }, 'Mission: ' + (mission.total ? mission.done + '/' + mission.total + ' activities done' : 'not generated yet — open the Dashboard.')),
          el('p', { style: 'font-size:.92rem' }, 'Reviews due: ', el('b', {}, String(SRS.dueList().length)), ' vocabulary cards'),
          el('p', { style: 'font-size:.92rem' }, 'Pomodoros completed: ', el('b', {}, String(S.planner.pomodoros || 0))),
          el('a', { class: 'btn small', href: '#/session' }, 'Start daily session'))
      ),
      el('div', { class: 'card tint', style: 'margin-top:20px' },
        el('h3', { style: 'margin-bottom:4px' }, 'Pomodoro timer'),
        el('p', { style: 'font-size:.84rem;color:var(--ink-soft);margin:0 0 14px' }, '25 minutes of focus, then a 5-minute break. The timer keeps running while you navigate around the app.'),
        el('div', { style: 'display:flex;align-items:center;gap:16px;flex-wrap:wrap' },
          el('span', { id: 'pomo-clock', class: 'mono', style: 'font-size:2.2rem;font-weight:600' }, clockText()),
          el('span', { id: 'pomo-mode', class: 'chip' }, mode === 'focus' ? 'Focus' : 'Break'),
          el('button', { class: 'btn primary', id: 'pomo-toggle', onclick: toggle }, running ? 'Pause' : 'Start'),
          el('button', { class: 'btn ghost', onclick: reset }, 'Reset'),
          el('button', { class: 'btn ghost', onclick: skip }, mode === 'focus' ? 'Take break' : 'Back to focus')))
    );
  }

  function numRow(label, pref, values) {
    const S = Store.s;
    return el('div', { style: 'display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-soft)' },
      el('span', { style: 'font-size:.9rem' }, label),
      el('div', { style: 'display:flex;gap:6px' }, ...values.map(v =>
        el('button', {
          class: 'chip chip-btn' + (S.prefs[pref] === v ? ' on' : ''),
          onclick: () => { S.prefs[pref] = v; Store.save(); Router.run(); }
        }, String(v)))));
  }

  function clockText() { return Math.floor(remaining / 60) + ':' + String(remaining % 60).padStart(2, '0'); }

  function paint() {
    const c = document.getElementById('pomo-clock');
    if (!c) return;
    c.textContent = clockText();
    const m = document.getElementById('pomo-mode');
    if (m) m.textContent = mode === 'focus' ? 'Focus' : 'Break';
    const t = document.getElementById('pomo-toggle');
    if (t) t.textContent = running ? 'Pause' : 'Start';
  }

  function toggle() {
    running = !running;
    if (running && !tick) {
      tick = setInterval(() => {
        if (!running) return;
        remaining--;
        if (remaining <= 0) {
          if (mode === 'focus') { Store.s.planner.pomodoros = (Store.s.planner.pomodoros || 0) + 1; Store.save(); UI.toast('Focus session complete — take a break.', 'good'); mode = 'break'; remaining = 5 * 60; }
          else { UI.toast('Break over — back to focus.', ''); mode = 'focus'; remaining = 25 * 60; }
        }
        paint();
      }, 1000);
    }
    paint();
  }
  function reset() { running = false; mode = 'focus'; remaining = 25 * 60; paint(); }
  function skip() { if (mode === 'focus') { mode = 'break'; remaining = 5 * 60; } else { mode = 'focus'; remaining = 25 * 60; } paint(); }

  window.Planner = { render };
  Router.add('planner', 'Study Planner', render);
})();

/* ============================================================
   features/settings.js — themes, prefs, data management
   ============================================================ */
(function () {
  const { el } = UI;

  const THEMES = [
    { id: 'claude', name: 'Claude Warm', sw: ['#F5F0E8', '#D9B778', '#3D3929'] },
    { id: 'nothing', name: 'Nothing Mono', sw: ['#0E0E0E', '#1C1C1C', '#FFFFFF'] },
    { id: 'catppuccin', name: 'Catppuccin Mocha', sw: ['#1E1E2E', '#45475A', '#89B4FA'] },
    { id: 'midnight', name: 'New York Midnight', sw: ['#101522', '#1B2438', '#7FA1E8'] },
    { id: 'light', name: 'Classic Light', sw: ['#F7F7F5', '#E4E4E0', '#1A1A1A'] },
    { id: 'dark', name: 'Classic Dark', sw: ['#131317', '#1E1E24', '#8AB4F8'] },
  ];

  function render(outlet) {
    const S = Store.s;

      el('h2', {}, 'Settings'),

      el('div', { class: 'card' },
        el('h3', { style: 'margin-bottom:14px' }, 'Theme'),
        el('div', { class: 'grid cols-3' }, ...THEMES.map(t =>
          el('button', {
            class: 'theme-card' + (S.theme === t.id ? ' on' : ''),
            onclick: () => { Store.s.theme = t.id; Store.save(); UI.applyTheme(); Router.run(); }
          },
            el('div', { class: 'swatch-row' }, ...t.sw.map(c => el('span', { class: 'swatch', style: 'background:' + c }))),
            el('span', { style: 'font-size:.88rem' }, t.name),
            S.theme === t.id ? el('span', { class: 'mono', style: 'font-size:.66rem;color:var(--good)' }, 'ACTIVE') : null))),

          el('span', { style: 'font-size:.88rem' }, 'Accent color override'),
          el('input', { type: 'color', value: S.accent || '#D9B778', 'aria-label': 'Accent color', style: 'width:44px;height:30px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer', oninput: (e) => { Store.s.accent = e.target.value; Store.save(); UI.applyTheme(); } }),
          S.accent ? el('button', { class: 'btn small ghost', onclick: () => { Store.s.accent = null; Store.save(); UI.applyTheme(); Router.run(); } }, 'Reset to theme default') : null)),

      el('div', { class: 'grid cols-2', style: 'margin-top:20px' },
        el('div', { class: 'card' },
          el('h3', { style: 'margin-bottom:8px' }, 'Profile'),
          field('Name (optional)', el('input', { class: 'input', value: S.profile.name || '', placeholder: 'Your name', oninput: (e) => { S.profile.name = e.target.value; Store.save(); } })),
          field('Learning goal', el('input', { class: 'input', value: S.profile.goal, oninput: (e) => { S.profile.goal = e.target.value; Store.save(); } })),
          field('Current level', el('div', { style: 'display:flex;gap:6px' }, ...['B1', 'B2', 'C1', 'C2'].map(l =>
            el('button', { class: 'chip chip-btn' + (S.profile.level === l ? ' on' : ''), onclick: () => { S.profile.level = l; Store.save(); Router.run(); } }, l)))),
          el('p', { style: 'font-size:.78rem;color:var(--ink-faint)' }, 'Changing level manually affects recommendations, not your recorded results.')),
        el('div', { class: 'card' },
          el('h3', { style: 'margin-bottom:8px' }, 'Preferences'),
          toggleRow('Font size: ' + S.prefs.fontSize + 'px', null,
            el('input', { type: 'range', min: 14, max: 20, value: S.prefs.fontSize, 'aria-label': 'Font size', oninput: (e) => { S.prefs.fontSize = +e.target.value; applyFont(); Store.save(); e.target.parentElement.querySelector('.rv').textContent = S.prefs.fontSize + 'px'; } }),
            el('span', { class: 'rv mono', style: 'font-size:.76rem;color:var(--ink-faint)' }, S.prefs.fontSize + 'px')),
          toggleRow('Reading text size', null,
            el('input', { type: 'range', min: 0.9, max: 1.5, step: 0.02, value: S.prefs.readSize, 'aria-label': 'Reading text size', oninput: (e) => { S.prefs.readSize = +e.target.value; Store.save(); } }),
            el('span', { class: 'rv mono', style: 'font-size:.76rem;color:var(--ink-faint)' }, S.prefs.readSize.toFixed(2) + '×')),
          sel('Animations', 'motion', [['on', 'On'], ['off', 'Off (reduced motion)']]),
          sel('Sound effects', 'sound', [['off', 'Off'], ['on', 'On']])),
      ),

      el('div', { class: 'card', style: 'margin-top:20px' },
        el('h3', { style: 'margin-bottom:12px' }, 'Data'),
        el('div', { style: 'display:flex;gap:10px;flex-wrap:wrap' },
          el('button', { class: 'btn', onclick: exportData }, 'Export progress (JSON)'),
          el('label', { class: 'btn ghost', style: 'cursor:pointer' }, 'Import backup…',
            el('input', { type: 'file', accept: 'application/json,.json', style: 'display:none', onchange: (e) => importData(e.target) })),
          el('button', { class: 'btn danger', onclick: resetData }, 'Reset all learning data')),
        el('p', { style: 'font-size:.78rem;color:var(--ink-faint);margin-top:10px' }, 'Export produces a small JSON file with all your progress, drafts and settings. Keep it safe — the browser storage used by this app cannot be recovered if cleared.'))
    );
    applyFont();
  }

  function field(label, node) {
    return el('div', { style: 'margin:10px 0' }, el('label', { style: 'display:block;font-size:.8rem;color:var(--ink-soft);margin-bottom:6px' }, label), node);
  }
  function toggleRow(label, _x, ...nodes) {
    return el('div', { style: 'display:flex;align-items:center;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid var(--line-soft)' },
      el('span', { style: 'font-size:.9rem' }, label), el('div', { style: 'display:flex;align-items:center;gap:8px' }, ...nodes));
  }
  function sel(label, pref, options) {
    const S = Store.s;
    return toggleRow(label, null, el('div', { style: 'display:flex;gap:6px' }, ...options.map(([v, lbl]) =>
      el('button', { class: 'chip chip-btn' + (S.prefs[pref] === v ? ' on' : ''), onclick: () => { S.prefs[pref] = v; Store.save(); UI.applyTheme(); Router.run(); } }, lbl))));
  }

  function applyFont() {
    document.documentElement.style.fontSize = Store.s.prefs.fontSize + 'px';
  }

  function exportData() {
    try {
      const blob = new Blob([Store.exportJSON()], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'lexicon-progress-' + Store.todayStr() + '.json';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      UI.toast('Progress exported.', 'good');
    } catch (e) { UI.toast('Export failed: ' + e.message, 'bad'); }
  }

  function importData(input) {
    const file = input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try { Store.importJSON(reader.result); UI.applyTheme(); Router.run(); UI.toast('Progress imported successfully.', 'good'); }
      catch (e) { UI.toast('Import failed: ' + e.message, 'bad'); }
    };
    reader.readAsText(file);
  }

  function resetData() {
    UI.confirmDialog('Reset all learning data?',
      'This permanently deletes your progress, streak, vocabulary schedule, drafts and settings from this browser. Export a backup first if you might want it back.',
      () => { Store.reset(); UI.applyTheme(); Router.run(); UI.toast('All data has been reset.', ''); });
  }

  window.SettingsF = { render, applyFont };
  Router.add('settings', 'Settings', render);
})();
