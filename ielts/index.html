    { id: 'r-sleep', level: 'B2', title: 'Why Your Brain Needs Sleep Before an Exam', topic: 'Health', type: 'Science article', minutes: 3,
      text: [
        'Students preparing for important exams often make the same trade: sacrifice a night of sleep for several extra hours of revision. Research suggests this trade is a poor one, and the reason lies in what sleep actually does to memory.',
        'During deep sleep, the brain replays the day\u2019s learning and gradually transfers it from short-term storage in the hippocampus to more stable regions. This process, known as consolidation, is not passive rest; it is active filing. A night without sleep means the day\u2019s revision was never properly filed, however many hours were spent on it.',
        'There is a second, less obvious effect. Sleep deprivation damages the brain\u2019s ability to retrieve what it does hold. In several controlled studies, tired participants recognised material they had studied but struggled to apply it to new problems. An exam rarely rewards recognition alone; it rewards flexible use.',
        'None of this means revision time is unimportant. But the evidence points to a clear recommendation: when the choice is between a final anxious midnight hour and a full night of sleep, the sleep is almost certainly the better investment. The material is still there in the morning; the ability to use it may not be.',
      ],
      questions: [
        { q: 'What is "consolidation", as described in the text?', type: 'mc', options: ['Forgetting unimportant details', 'Transferring learning into stable memory', 'Revising with classmates'], answer: 'Transferring learning into stable memory', skill: 'Vocabulary in context', explain: 'Paragraph 2 defines consolidation as "active filing" from hippocampus to stable regions.' },
        { q: 'The text says sleep deprivation mainly harms the ability to ___.', type: 'mc', options: ['recognise studied material', 'apply knowledge to new problems', 'read quickly'], answer: 'apply knowledge to new problems', skill: 'Detail', explain: 'Paragraph 3: tired participants "recognised material" but "struggled to apply it".' },
        { q: 'The writer\u2019s overall advice is to ___.', type: 'mc', options: ['revise all night', 'sleep rather than cram at the last minute', 'skip revision entirely'], answer: 'sleep rather than cram at the last minute', skill: 'Main idea', explain: 'The final paragraph calls a full night\u2019s sleep "the better investment".' },
        { q: 'Which statement best reflects the writer\u2019s tone?', type: 'mc', options: ['Alarmist: exams are dangerous', 'Balanced: acknowledges revision matters but defends sleep', 'Dismissive: mocks students who study'], answer: 'Balanced: acknowledges revision matters but defends sleep', skill: 'Tone', explain: '"None of this means revision time is unimportant" signals a balanced, measured tone.' },
      ] },

    { id: 'r-remote', level: 'B2', title: 'The Two-Sided Coin of Remote Work', topic: 'Business', type: 'Opinion piece', minutes: 3,
      text: [
        'When offices closed in 2020, millions of workers discovered that their jobs could be done from a kitchen table. Four years on, the argument about remote work has not really been about technology for some time; it is about trust, control, and what work is actually for.',
        'Employers who resist remote work rarely say so openly. Instead, they speak of "culture" and "collaboration", words that sound neutral but carry an assumption: that people are most valuable when they are most visible. Critics respond that visibility was never the same as productivity, and that the office, for all its energy, has always contained an extraordinary amount of pretending to work.',
        'Yet the remote enthusiasts tend to be equally selective. They celebrate the end of commuting and rarely mention the quiet cost: the junior colleague who no longer overhears how a difficult client is handled, the friendship that slowly becomes a quarterly video call, the way "flexible" often quietly becomes "always available".',
        'The most honest reading of the evidence is a mixed blessing, at best: it removes the commute while eroding the boundary between work and everything else.',
      ],
      questions: [
        { q: 'According to the writer, the real debate about remote work concerns ___.', type: 'mc', options: ['which software to use', 'trust, control, and purpose', 'the price of office rent'], answer: 'trust, control, and purpose', skill: 'Main idea', explain: 'Paragraph 1 ends: "it is about trust, control, and what work is actually for."' },
        { q: 'What criticism does the writer make of remote-work supporters?', type: 'mc', options: ['They refuse to use technology', 'They ignore the hidden costs of flexibility', 'They want longer commutes'], answer: 'They ignore the hidden costs of flexibility', skill: 'Inference', explain: 'Paragraph 3: enthusiasts "rarely mention the quiet cost" — learning by overhearing, weaker friendships, blurred boundaries.' },
        { q: 'What does the writer conclude about remote work?', type: 'mc', options: ['It should be banned', 'It is entirely a blessing', 'It is a mixed blessing, with real benefits and real costs'], answer: 'It is a mixed blessing, with real benefits and real costs', skill: 'Main idea', explain: 'The final line describes it as "a mixed blessing": no commute, but no clear end to the working day.' },
        { q: 'The phrase "an extraordinary amount of pretending to work" suggests offices ___.', type: 'mc', options: ['are always efficient', 'contain visible but unproductive behaviour', 'should have stricter managers'], answer: 'contain visible but unproductive behaviour', skill: 'Implication', explain: 'The writer implies visibility (appearing busy) is not equal to actual productivity.' },
      ] },

    { id: 'r-mirror', level: 'B2', title: 'The Mirror and the Rain', topic: 'Literature', type: 'Short story', minutes: 3, story: true,
      text: [
        'The flat had one mirror, in the hallway, and Dana had learned to walk past it without looking. It was not vanity, or the opposite of vanity; it was simply that the mirror had begun to disagree with the person she felt herself to be. In the mirror there was a tired woman in an old coat. Inside, something was still twenty-two and arguing about films at two in the morning.',
        'That autumn it rained for eleven days without pause. The city softened. Paint peeled, arguments dissolved, and people spoke to each other in queues — really spoke, as if the grey sky had given them permission to be unfinished.',
        'On the eleventh day, Dana missed the bus and, having nowhere particular to be, stood under the shelter of a closed bakery and watched the water arrange itself in the gutter. A woman next to her, holding an umbrella she was not using, said, "It\u2019s a lot of weather for a Wednesday." And Dana laughed — properly, unexpectedly — and heard the laugh before she recognised it as hers. It was the twenty-two-year-old\u2019s laugh.',
        'She went home the long way. In the hallway, she stopped, and this time she looked. The tired woman was still there in the old coat, but the mirror, it seemed, had stopped telling the whole truth, and that was enough. She hung the coat by the door, where it could drip, and left it there.',
      ],
      questions: [
        { q: 'Why did Dana avoid the mirror?', type: 'mc', options: ['She was vain about her appearance', 'It seemed to conflict with who she felt she was inside', 'It was broken'], answer: 'It seemed to conflict with who she felt she was inside', skill: 'Detail', explain: 'The mirror "had begun to disagree with the person she felt herself to be."' },
        { q: 'What does the rain seem to do to the city?', type: 'mc', options: ['It makes people hostile', 'It softens people and permits honesty', 'It stops all communication'], answer: 'It softens people and permits honesty', skill: 'Inference', explain: '"People spoke to each other in queues — really spoke, as if the grey sky had given them permission to be unfinished."' },
        { q: 'What changes for Dana by the end?', type: 'mc', options: ['She buys a new coat', 'She stops seeing herself as finished and defined by tiredness', 'She argues with the woman at the bakery'], answer: 'She stops seeing herself as finished and defined by tiredness', skill: 'Theme', explain: '"The mirror had stopped telling the whole truth, and that was enough" — she rejects the mirror\u2019s fixed version of her.' },
        { q: 'The phrase "a lot of weather for a Wednesday" is an example of ___.', type: 'mc', options: ['formal academic style', 'understatement creating gentle humour', 'aggressive criticism'], answer: 'understatement creating gentle humour', skill: 'Rhetoric', explain: 'Describing eleven days of rain as "a lot of weather" is a comic British understatement.' },
      ] },

    { id: 'r-attention', level: 'C1', title: 'The Attention Economy Is Not Neutral', topic: 'Technology & Psychology', type: 'Analytical essay', minutes: 4,
      text: [
        'It has become fashionable to describe the smartphone as a slot machine: intermittent, unpredictable rewards engineered to exploit a weakness in human cognition. The metaphor is vivid, and like most vivid metaphors it conceals as much as it reveals. It implies a solitary weakness — the user\u2019s — and a solitary strategy — the designer\u2019s. The reality is more collective, and more structural.',
        'Consider what a "free" application is. Its owner earns revenue not from the user but from an advertiser, and the commodity exchanged is the user\u2019s attention, harvested in slices. Within this arrangement, the user\u2019s interest and the platform\u2019s incentive are aligned only up to a point. Both want the session to begin; only one of them benefits from the session ever ending. To call the resulting design "addictive" is accurate but insufficient; it would be more precise to say that ending a session has been made expensive — socially, through notifications; cognitively, through infinite scroll; emotionally, through the fear of being left out.',
        'This is why purely individual remedies — digital detoxes, screen-time rules, willpower — so often disappoint. They treat a structural condition as a moral one. One does not resolve a market failure by asking consumers to shop more thoughtfully, and one does not unwind an economy built on attention by asking its participants to blink less.',
        'None of this absolves individuals of responsibility; a platform can be engineered to capture attention while individuals still choose, within narrowed corridors, what to attend to. But the language of "self-control" quietly shifts the entire burden of a collective arrangement onto the person with the least power to change it — which, perhaps, is precisely why that language is so popular among those with the most.',
      ],
      questions: [
        { q: 'The writer\u2019s objection to the "slot machine" metaphor is that it ___.', type: 'mc', options: ['is not vivid enough', 'suggests a purely individual weakness rather than a structural arrangement', 'insults gamblers'], answer: 'suggests a purely individual weakness rather than a structural arrangement', skill: 'Rhetorical structure', explain: 'Paragraph 1: the metaphor "implies a solitary weakness — the user\u2019s — and a solitary strategy" whereas reality is "more collective, and more structural."' },
        { q: 'In a "free" application, whose interests are only partially aligned?', type: 'mc', options: ['The user\u2019s and the platform\u2019s', 'The advertiser\u2019s and the regulator\u2019s', 'The designer\u2019s and the developer\u2019s'], answer: 'The user\u2019s and the platform\u2019s', skill: 'Detail', explain: 'Paragraph 2: "the user\u2019s interest and the platform\u2019s incentive are aligned only up to a point" — both want the session to start; only the platform benefits from it continuing.' },
        { q: 'Why do digital detoxes disappoint, according to the text?', type: 'mc', options: ['They are too expensive', 'They treat a structural condition as a moral failing', 'They increase screen time'], answer: 'They treat a structural condition as a moral failing', skill: 'Inference', explain: 'Paragraph 3: individual remedies "treat a structural condition as a moral one."' },
        { q: 'The final paragraph suggests the language of "self-control" is popular among the powerful because it ___.', type: 'mc', options: ['is scientifically precise', 'shifts responsibility onto those least able to change the system', 'encourages better regulation'], answer: 'shifts responsibility onto those least able to change the system', skill: 'Implication', explain: '"quietly shifts the entire burden of a collective arrangement onto the person with the least power to change it — which… is precisely why that language is so popular among those with the most."' },
        { q: 'The word "corridors" in the final paragraph is closest in meaning to ___.', type: 'mc', options: ['long hallways', 'limited but real choices', 'legal restrictions'], answer: 'limited but real choices', skill: 'Vocabulary in context', explain: 'Individuals "still choose, within narrowed corridors" — i.e., within constrained options.' },
      ] },

    { id: 'r-archive', level: 'C1', title: 'The Library That catalogued Its Own Destruction', topic: 'History', type: 'Long-form article', minutes: 4,
      text: [
        'Among the strangest documents to survive the twentieth century is a library\u2019s ledger from Warsaw. Its keepers, unable to save their collections from bombing, chose an act of defiant bureaucracy: they catalogued what they were losing. Page after page lists titles, donors, and shelf numbers of books that no longer existed, described with the precision normally reserved for treasures.',
        'Historians of the period argue about how to read the ledger. One school treats it as evidence of despair — a final ritual, mourning dressed as administration. Another reads it as evidence of confidence: an assertion, in the face of annihilation, that a catalogue survives its books, that the idea of a library can outlast its walls. The ledger itself refuses to settle the question, which is perhaps why it is so moving.',
        'What both readings share is a belief that description is never neutral. To record a book\u2019s title with care is to assert that it mattered, and that someone, someday, would want to know it existed. In this sense the ledger belongs to a wider wartime genre: inventories of destroyed synagogues, photographs of vanished streets, the meticulous notes of archivists who understood that memory requires paperwork.',
        'The library was rebuilt after the war, and the ledger now sits in its new reading room under glass. Visitors often assume it is an exhibit about loss. The librarians, when asked, tend to answer differently: it is an exhibit about record-keeping — proof that a list, kept with sufficient stubbornness, can function as a promise.',
      ],
      questions: [
        { q: 'What was "an act of defiant bureaucracy"?', type: 'mc', options: ['Hiding books from soldiers', 'Cataloguing books that were being destroyed', 'Rebuilding the library during the war'], answer: 'Cataloguing books that were being destroyed', skill: 'Detail', explain: 'The keepers "catalogued what they were losing" rather than saving it.' },
        { q: 'True, False or Not Given: The ledger clearly proves the librarians believed the library would be rebuilt.', type: 'tfng', options: ['True', 'False', 'Not Given'], answer: 'Not Given', skill: 'Inference', explain: 'The text says the ledger "refuses to settle the question" — the librarians\u2019 actual beliefs are not definitively stated.' },
        { q: 'What do the two schools of interpretation share, per the text?', type: 'mc', options: ['Certainty about the librarians\u2019 despair', 'A belief that description is never neutral', 'Rejection of the ledger\u2019s importance'], answer: 'A belief that description is never neutral', skill: 'Rhetorical structure', explain: 'Paragraph 3: "What both readings share is a belief that description is never neutral."' },
        { q: 'How do today\u2019s librarians interpret the ledger?', type: 'mc', options: ['As an exhibit about loss', 'As proof that a stubbornly kept list can act as a promise', 'As an administrative error'], answer: 'As proof that a stubbornly kept list can act as a promise', skill: 'Main idea', explain: 'The final sentence: "a list, kept with sufficient stubbornness, can function as a promise."' },
      ] },

    { id: 'r-translation', level: 'C2', title: 'On the Silence That Becomes a Word', topic: 'Language & Literature', type: 'Critical essay', minutes: 5,
      text: [
        'Every translator eventually meets the sentence that cannot be carried across. The temptation, at that moment, is to reach for the nearest equivalent and move on — a defensible instinct, and a wasteful one, for the untranslatable sentence is not an obstacle to the work; more often, it is the work.',
        'Consider the Portuguese "saudade", a word which dictionaries render as "longing" and which every Portuguese poet has insisted is nothing of the kind. The dictionaries are not wrong about the denotation; they are wrong about the ambition. "Saudade" names not merely an absence but the presence of that absence — a grief one has agreed to live alongside, almost as a companion. The word is less a label for an emotion than an admission that this culture found the emotion common enough, and specific enough, to deserve its own instrument.',
        'What, then, is the translator to do? The lazy solution is transcription: leave "saudade" in italics and hope the reader forgives. The heroic solution is expansion — three English sentences doing the work of one Portuguese word — which preserves the meaning and destroys the music. Between these poles lies a third path, less discussed because it is less visible: translation by resonance. The translator stops asking what the word means and starts asking what the word does to the sentence around it, and then rebuilds that effect from English materials.',
        'This is not a compromise; it is a theory of language in miniature. It assumes that words are not containers of meaning but instruments for producing effects — that "saudade" matters not because of what it denotes but because of the hush it creates around itself, the way it slows a line of verse, the permission it grants a speaker to be vague in a language that usually rewards precision. An English translation that captures the hush without importing the word has, in the only sense that finally matters, translated it.',
        'The untranslatable, in other words, is not the enemy of translation but its deepest justification. A language that could be mapped perfectly onto another would hardly be worth the crossing. It is precisely at the point where the bridge breaks — where the translator must abandon the dictionary and start listening — that the reader, usually without knowing it, comes closest to standing in the original poem\u2019s room.',
      ],
      questions: [
        { q: 'The writer regards the "untranslatable sentence" as ___.', type: 'mc', options: ['an obstacle to be avoided', 'central to the translator\u2019s task', 'a myth that does not exist'], answer: 'central to the translator\u2019s task', skill: 'Rhetorical structure', explain: 'Paragraph 1: "the untranslatable sentence is not an obstacle to the work; more often, it is the work."' },
        { q: 'The dictionaries are "wrong about the ambition" of saudade because they ___.', type: 'mc', options: ['give an incorrect denotation', 'miss what the word culturally performs', 'invent the word entirely'], answer: 'miss what the word culturally performs', skill: 'Implication', explain: 'Paragraph 2: the word is "an admission that this culture found the emotion common enough… to deserve its own instrument" — dictionaries capture denotation, not function.' },
        { q: '"Translation by resonance" means rebuilding ___.', type: 'mc', options: ['the word\u2019s dictionary meaning', 'the effect the word produces in its context', 'the literal syntax of the original'], answer: 'the effect the word produces in its context', skill: 'Vocabulary in context', explain: 'Paragraph 3: the translator asks "what the word does to the sentence around it, and then rebuilds that effect from English materials."' },
        { q: 'The writer\u2019s underlying theory of language is that words are ___.', type: 'mc', options: ['containers of meaning', 'instruments producing effects', 'random social conventions'], answer: 'instruments producing effects', skill: 'Main idea', explain: 'Paragraph 4 states this explicitly: "words are not containers of meaning but instruments for producing effects."' },
        { q: 'The final paragraph implies that translation is most valuable precisely where ___.', type: 'mc', options: ['languages match perfectly', 'the bridge between languages breaks down', 'the translator is unnecessary'], answer: 'the bridge between languages breaks down', skill: 'Implication', explain: '"It is precisely at the point where the bridge breaks… that the reader… comes closest to standing in the original poem\u2019s room."' },
      ] },

    { id: 'r-city-trees', level: 'B1', title: 'Why Cities Are Planting More Trees', topic: 'Environment', type: 'Report', minutes: 2,
      text: [
        'City governments around the world have begun large tree-planting programmes, and the reasons are more practical than beautiful. Trees cool streets by several degrees in summer. Their leaves catch rain and slow it down, which reduces flooding. They also clean the air by trapping dust and pollution on their surfaces.',
        'There are social benefits too. Studies show that people walk more on streets with trees, and shops on green streets often receive more visitors. In some hospitals, patients recovering in rooms with a view of trees appear to need less medicine for pain.',
        'However, planting the wrong tree in the wrong place causes problems. Some species need far more water than dry cities can provide; others have roots that damage pipes and pavements. Experts say the secret is choosing local species and giving young trees care for at least their first three years. A planted tree is not a finished tree; it is a promise that someone must keep.',
      ],
      questions: [
        { q: 'Name two benefits of city trees mentioned in the text.', type: 'mc', options: ['Cooling streets and reducing flooding', 'Making traffic faster and reducing noise completely', 'Producing food and saving money'], answer: 'Cooling streets and reducing flooding', skill: 'Detail', explain: 'Paragraph 1 mentions cooling by several degrees and leaves that slow rain, reducing flooding.' },
        { q: 'What problem can badly chosen trees cause?', type: 'mc', options: ['They cool the city too much', 'Their roots may damage pipes and pavements', 'They stop people from walking'], answer: 'Their roots may damage pipes and pavements', skill: 'Detail', explain: 'Paragraph 3: "others have roots that damage pipes and pavements."' },
        { q: 'What does the final sentence suggest a newly planted tree needs?', type: 'mc', options: ['Nothing at all', 'Ongoing care for years', 'Only rainwater'], answer: 'Ongoing care for years', skill: 'Implication', explain: '"A planted tree is not a finished tree; it is a promise that someone must keep" — care must continue for at least three years.' },
      ] },

    { id: 'r-migration', level: 'C2', title: 'The Cartographer of Departures', topic: 'Society', type: 'Long-form essay', minutes: 5,
      text: [
        'Statistics on migration arrive to us already aged. A figure published this year describes last year, which measured the year before, in a world that has since redrawn itself. Between the census and the street, between the spreadsheet and the shore, falls the lived fact of movement — and it is precisely this gap that the most interesting contemporary writing on migration tries to close.',
        'The novelist Abdulrazak Gurnah has remarked that exile is not a single event but a condition that renews itself: one is not merely displaced once, at the border; one is displaced again at every form that offers only two boxes for a name, at every greeting that requires an explanation of one\u2019s vowels. Migration, in this account, is not a crossing but a climate — something one continues to live inside, the way one lives inside weather.',
        'Policy language has great difficulty with this. Its categories — "economic migrant", "refugee", "expatriate" — pretend to name kinds of people when in truth they name kinds of paperwork. The same journey, undertaken by the same family, may acquire entirely different moral weights depending on which documents were issued, lost, or burned. It is not the movement that differs; it is the narrative permitted to explain it.',
        'Writers who work against these categories do not deny that they are administratively necessary; they deny that they are descriptively innocent. A label that decides whether a person is pitiable or punishable cannot also pretend to be neutral. And so the literature of migration increasingly proceeds by small correction: the specific name of the village, the exact weight of the suitcase, the particular hour of the departure. These details are not decoration. They are a quiet argument that the person being described has been misdescribed — and that the correction is the story.',
        'The cartography that results does not map departures; it maps the persistence of those who departed. Its true subject is not the crossing but what the crossing leaves behind and what it fails to leave behind: a language that arrives in fragments and reassembles itself in the second generation, a cuisine that becomes a passport, a grief that no form has a box for. To read this literature well is to stop asking whether the migrant "integrated" — a word that assumes the host society was a fixed thing into which one might be absorbed — and to begin asking instead what both places became.',
      ],
      questions: [
        { q: 'What problem with migration statistics does the opening paragraph identify?', type: 'mc', options: ['They are deliberately falsified', 'They describe an already-outdated reality', 'They measure weather instead of people'], answer: 'They describe an already-outdated reality', skill: 'Main idea', explain: '"Statistics on migration arrive to us already aged… in a world that has since redrawn itself."' },
        { q: 'Gurnah\u2019s idea of exile as "a condition that renews itself" is best illustrated by ___.', type: 'mc', options: ['crossing the border once', 'facing forms and greetings that repeatedly mark one as foreign', 'forgetting one\u2019s native language'], answer: 'facing forms and greetings that repeatedly mark one as foreign', skill: 'Implication', explain: 'Displacement renews "at every form that offers only two boxes for a name, at every greeting that requires an explanation of one\u2019s vowels."' },
        { q: 'The claim that policy categories "name kinds of paperwork" implies they ___.', type: 'mc', options: ['are descriptively neutral and fair', 'misrepresent people while claiming objectivity', 'should be used more widely'], answer: 'misrepresent people while claiming objectivity', skill: 'Rhetorical structure', explain: 'Paragraph 4: writers deny the categories are "descriptively innocent"; "a label that decides whether a person is pitiable or punishable cannot also pretend to be neutral."' },
        { q: 'The "small corrections" of migrant literature are described as ___.', type: 'mc', options: ['decorative historical detail', 'a quiet argument against official misdescription', 'a way to avoid politics'], answer: 'a quiet argument against official misdescription', skill: 'Implication', explain: '"These details are not decoration. They are a quiet argument that the person being described has been misdescribed."' },
        { q: 'The writer\u2019s objection to asking whether migrants "integrated" is that the word ___.', type: 'mc', options: ['is too technical', 'assumes host societies are fixed and absorbing', 'only applies to refugees'], answer: 'assumes host societies are fixed and absorbing', skill: 'Implication', explain: 'The final sentence: "integrated" assumes "the host society was a fixed thing into which one might be absorbed" rather than asking "what both places became."' },
        { q: 'The tone of the essay is best described as ___.', type: 'mc', options: ['sentimental and nostalgic', 'analytical and quietly critical of official language', 'neutral reportage'], answer: 'analytical and quietly critical of official language', skill: 'Tone', explain: 'The essay argues through close analysis of language and categories rather than emotional appeal or pure description.' },
      ] },

    { id: 'r-desert', level: 'B1', title: 'The Garden That Drinks Fog', topic: 'Environment', type: 'Report', minutes: 3,
      text: [
        'In the coastal desert of Peru, it almost never rains. Some years pass without a single storm. Yet farmers in the region grow avocados, figs, and even grapes. Their secret is not water from the ground — it is water from the sky\u2019s closest neighbour: the fog.',
        'Every winter morning, a thick fog called the garúa rolls in from the cold Pacific ocean and sits against the hillsides until noon. Local communities hang large nets on the slopes. As the fog passes through the nets, tiny drops of water stick to the threads, join together, and slide down into pipes. A single large net can collect hundreds of litres of clean water in a day.',
        'The technique is not new — it was tested in Chile in the 1950s — but it is becoming popular again because climate change is making dry places drier. Fog collection needs no electricity, no chemicals, and almost no money. Its only real requirement is patience: the nets must be checked, cleaned, and repaired.',
        'Of course, fog collectors do not work everywhere. They need both a reliable fog and a hill for the nets. In flat, sunny deserts, they are useless. But for the villages of the Peruvian coast, the nets have changed daily life. Children who used to walk hours to fetch water now attend school instead, and small gardens have appeared around houses that were empty for years.',
      ],
      questions: [
        { q: 'How do the nets collect water?', type: 'mc', options: ['They catch rain during storms', 'Fog drops stick to the threads and slide down into pipes', 'They pull water up from the ground'], answer: 'Fog drops stick to the threads and slide down into pipes', skill: 'Detail', explain: 'Paragraph 2: drops stick to the threads, join together, and slide down into pipes.' },
        { q: 'One disadvantage of fog collectors is that ___.', type: 'mc', options: ['they use too much electricity', 'they need hills and regular fog to work', 'the water is dirty'], answer: 'they need hills and regular fog to work', skill: 'Detail', explain: 'Paragraph 4: "They need both a reliable fog and a hill for the nets." In flat, sunny deserts they are useless.' },
        { q: 'True, False or Not Given: Fog collection was first invented in Peru.', type: 'tfng', options: ['True', 'False', 'Not Given'], answer: 'False', skill: 'Detail', explain: 'Paragraph 3: the technique "was tested in Chile in the 1950s" — so it was not first developed in Peru.' },
        { q: 'What changed for children after the nets arrived?', type: 'mc', options: ['They work on the nets all day', 'They can go to school instead of walking for water', 'They moved to the city'], answer: 'They can go to school instead of walking for water', skill: 'Detail', explain: 'Paragraph 4: children "who used to walk hours to fetch water now attend school instead".' },
        { q: 'The word "garúa" refers to ___.', type: 'mc', options: ['a seasonal storm', 'a thick coastal fog', 'a type of crop'], answer: 'a thick coastal fog', skill: 'Vocabulary in context', explain: 'Paragraph 2 defines it: "a thick fog called the garúa rolls in from the cold Pacific ocean".' },
      ] },

    { id: 'r-repair-shop', level: 'B1', title: 'The Repair Shop on Corniche Street', topic: 'Everyday life', type: 'Short story', minutes: 2, story: true,
      text: [
        'The repair shop was so narrow that Rashid, the owner, had to turn sideways to pass between the shelves. Inside, broken clocks, radios, kettles, and fans waited their turn in cardboard boxes labelled with dates.',
        'One Thursday, a young woman brought in an old cassette player. "It was my grandmother\u2019s," she said. "Nobody fixes these anymore." Rashid examined it for a long time, turning it over in his hands like a doctor listening for a heartbeat. "Come back in two weeks," he finally said. "If I can find the part."',
        'She was sure he would not find it. Instead, she returned to find the player working perfectly and a small note inside the cassette door: I made the part myself. She asked why he had bothered, for a machine almost nobody wanted. Rashid shrugged. "The machine is easy," he said. "The memory inside it is the difficult thing to repair. I only fixed the machine so the memory could play."',
      ],
      questions: [
        { q: 'What was unusual about the customer\u2019s cassette player?', type: 'mc', options: ['It was very expensive', 'It had belonged to her grandmother', 'It was brand new'], answer: 'It had belonged to her grandmother', skill: 'Detail', explain: '"It was my grandmother\u2019s," she said.' },
        { q: 'How did Rashid solve the problem of the missing part?', type: 'mc', options: ['He ordered it from abroad', 'He made the part himself', 'He replaced the whole machine'], answer: 'He made the part himself', skill: 'Detail', explain: 'The note inside read: "I made the part myself."' },
        { q: 'True, False or Not Given: The customer thought the repair was impossible at first.', type: 'tfng', options: ['True', 'False', 'Not Given'], answer: 'True', skill: 'Inference', explain: '"She was sure he would not find it." — the statement is True.' },
        { q: 'What does Rashid mean by "the memory inside it"?', type: 'mc', options: ['A recorded cassette', 'The grandmother\u2019s recorded voice', 'The family memories attached to the machine'], answer: 'The family memories attached to the machine', skill: 'Implication', explain: 'He means the sentimental value of the object — he repairs machines so memories can be replayed.' },
        { q: 'The shop is described as narrow. Which detail supports this?', type: 'mc', options: ['It had no windows', 'The owner must turn sideways to pass between shelves', 'It only had one customer'], answer: 'The owner must turn sideways to pass between shelves', skill: 'Detail', explain: 'Paragraph 1: "so narrow that Rashid… had to turn sideways to pass between the shelves."' },
      ] },

    { id: 'r-vertical-farm', level: 'B2', title: 'Farms Without Fields', topic: 'Technology', type: 'Science article', minutes: 3,
      text: [
        'In a warehouse on the edge of Singapore, lettuce grows in trays stacked twelve metres high, bathed in purple light and tended by robots. No soil, no rain, no insects — and no pesticides. This is vertical farming, and its supporters claim it will help feed the cities of the future.',
        'The economics are less romantic. A kilogram of vertically farmed lettuce requires several times more energy than the same lettuce grown outdoors, because every photon of light must be manufactured. Sunlight, the outdoor farmer\u2019s greatest subsidy, arrives free; the indoor farmer pays for it in electricity. This is why vertical farms tend to grow only soft, fast, high-value crops: herbs, salad leaves, microgreens. Wheat and rice, which supply most of the world\u2019s calories, remain firmly beyond reach.',
        'Yet energy is only part of the story. Vertical farms use around 95% less water than fields, can operate within hours of their customers, and are immune to droughts, floods, and seasons. In places that import most of their fresh food — Singapore, the Gulf states — that reliability carries a value that a simple price-per-kilo comparison misses.',
        'The likeliest future, most analysts now agree, is not a wholesale replacement of fields but a division of labour: staple crops stay outdoors, while delicate, perishable produce moves indoors near the cities that eat it. In that scenario, the warehouse on the edge of Singapore is not the future of all farming — but it may well be the future of salad.',
      ],
      questions: [
        { q: 'Why do vertical farms mostly grow salad crops rather than grains?', type: 'mc', options: ['Robots cannot harvest grains', 'Indoor light is expensive, so only high-value, fast crops pay', 'Grains need purple light'], answer: 'Indoor light is expensive, so only high-value, fast crops pay', skill: 'Causal reasoning', explain: 'Paragraph 2: energy costs make wheat and rice "firmly beyond reach"; farms grow "soft, fast, high-value crops".' },
        { q: 'True, False or Not Given: Vertical farming uses more water than outdoor farming.', type: 'tfng', options: ['True', 'False', 'Not Given'], answer: 'False', skill: 'Detail', explain: 'Paragraph 3: vertical farms "use around 95% less water than fields".' },
        { q: 'What advantage of vertical farming does the author say price comparisons miss?', type: 'mc', options: ['Lower electricity bills', 'Reliable supply close to the customer', 'Cheaper land in the countryside'], answer: 'Reliable supply close to the customer', skill: 'Implication', explain: 'Paragraph 3: for food-importing places, "that reliability carries a value that a simple price-per-kilo comparison misses".' },
        { q: 'The phrase "Sunlight… arrives free" is used to explain ___.', type: 'mc', options: ['why outdoor farms are disappearing', 'the outdoor farmer\u2019s cost advantage over indoor farms', 'why the warehouse uses purple light'], answer: 'the outdoor farmer\u2019s cost advantage over indoor farms', skill: 'Rhetorical structure', explain: 'It contrasts the free sunlight outdoor farmers receive with the electricity the indoor farmer must buy.' },
        { q: 'According to the final paragraph, vertical farming will most likely ___.', type: 'mc', options: ['replace all traditional farms', 'disappear once energy prices rise', 'specialise in perishable crops near cities'], answer: 'specialise in perishable crops near cities', skill: 'Main idea', explain: '"The likeliest future… is not a wholesale replacement of fields but a division of labour" — delicate produce indoors, staples outdoors.' },
      ] },

    { id: 'r-accents', level: 'B2', title: 'Do We Judge People by Their Accent?', topic: 'Society', type: 'Essay', minutes: 3,
      text: [
        'Ask people whether they discriminate by accent and almost everyone says no. Then show them identical job interview recordings with different accents, and their ratings change. Study after study has found that the same words spoken with a stigmatised accent are judged less intelligent, less educated, and less trustworthy — even by listeners who share that accent themselves.',
        'Linguists are quick to point out the scientific consensus: no accent is objectively "better" or "clearer" than another. The prestige of an accent is a historical accident, usually reflecting the power of the group that happens to speak it. The BBC accent became standard in Britain not because of its phonetic virtues but because the institution behind it was powerful.',
        'What can be done? Awareness alone is weak: knowing a bias exists does not remove it. More promising are structural approaches — anonymous screening, standardised interview scripts, and training that exposes listeners to a wide range of successful speakers. Some organisations now include a simple instruction in interviewer guidelines: rate the content of the answer, not the packaging.',
        'There is a final, uncomfortable point. Accent prejudice does not only affect speakers of "foreign" accents; within many countries, it falls hardest on speakers of regional or working-class accents. It is a prejudice that hides in plain speech: it operates through a channel we rarely examine, because listening seems as natural as breathing.',
      ],
      questions: [
        { q: 'What do the interview recording studies show?', type: 'mc', options: ['Interviewers cannot hear accents clearly', 'Identical content is rated differently depending on accent', 'Speakers change their words for each recording'], answer: 'Identical content is rated differently depending on accent', skill: 'Detail', explain: 'Paragraph 1: the same words with a stigmatised accent are "judged less intelligent, less educated, and less trustworthy".' },
        { q: 'Why did the BBC accent become prestigious, according to the text?', type: 'mc', options: ['It was phonetically superior', 'The institution behind it was powerful', 'It was the easiest accent to teach'], answer: 'The institution behind it was powerful', skill: 'Detail', explain: 'Paragraph 2: prestige is "a historical accident, usually reflecting the power of the group that happens to speak it".' },
        { q: 'True, False or Not Given: Linguists believe some accents are objectively clearer than others.', type: 'tfng', options: ['True', 'False', 'Not Given'], answer: 'False', skill: 'Detail', explain: 'Paragraph 2 states the opposite: "no accent is objectively \u2018better\u2019 or \u2018clearer\u2019 than another".' },
        { q: 'The author\u2019s attitude to "awareness alone" is that it is ___.', type: 'mc', options: ['the best available solution', 'necessary but insufficient', 'irrelevant to the problem'], answer: 'necessary but insufficient', skill: 'Implication', explain: 'Paragraph 3: "knowing a bias exists does not remove it" — followed by "more promising" structural approaches.' },
        { q: 'The phrase "hides in plain speech" suggests accent prejudice ___.', type: 'mc', options: ['is spoken about openly', 'operates through an unnoticed everyday channel', 'only exists in formal interviews'], answer: 'operates through an unnoticed everyday channel', skill: 'Vocabulary in context', explain: 'The metaphor points to the way listening feels natural and so escapes examination.' },
      ] },

    { id: 'r-dust', level: 'C1', title: 'The Long Journey of Dust', topic: 'Science', type: 'Science essay', minutes: 4,
      text: [
        'Every year, some two billion tonnes of dust rise from the earth\u2019s surface and travel through the atmosphere. Most of it comes from a handful of deserts — the Sahara alone contributes more than half — and much of it will cross oceans before it lands. Dust from Africa regularly fertilises the Amazon; so central is this supply that scientists describe the world\u2019s largest rainforest as partly fed by the world\u2019s largest desert.',
        'The mechanisms are elegant. Desert dust carries phosphorus, iron, and other nutrients scarce in weathered tropical soils and in open ocean water. When Saharan plumes settle on the Amazon basin, they replace the phosphorus that rivers constantly wash away. Over the Atlantic, iron-rich particles seed plankton blooms, which in turn draw carbon dioxide out of the air. Dust is therefore not merely a nuisance; it is a slow planetary circulatory system for nutrients.',
        'That system is changing. Satellite records show Saharan dust loads varying by factors that matter: rainfall in the Sahel, the drying of lakes, agricultural practices that expose new soil to wind. Some climate models suggest a warmer world may produce more dust overall, with consequences both helpful and harmful — more ocean fertilisation on the one hand, more degraded air quality and coral-smothering sediment on the other.',
        'Perhaps the hardest lesson of dust research is intellectual humility. The same plume that closes an airport in the Canaries may be feeding a forest three thousand kilometres away. Consequences in one place, benefits in another, and invisible links between them: the atmosphere is indifferent to our habit of dividing the planet into local problems.',
      ],
      questions: [
        { q: 'The relationship between the Sahara and the Amazon described in paragraph 1 is that ___.', type: 'mc', options: ['both are growing larger', 'dust from the desert supplies nutrients to the rainforest', 'rivers carry dust between the two'], answer: 'dust from the desert supplies nutrients to the rainforest', skill: 'Detail', explain: '"Dust from Africa regularly fertilises the Amazon… the world\u2019s largest rainforest as partly fed by the world\u2019s largest desert."' },
        { q: 'Why does the author call dust "a slow planetary circulatory system"?', type: 'mc', options: ['Because it moves nutrients between distant ecosystems', 'Because it follows the same route every year', 'Because it circulates only within deserts'], answer: 'Because it moves nutrients between distant ecosystems', skill: 'Metaphor', explain: 'Paragraph 2 explains the transport of phosphorus and iron across oceans, functioning like nutrient circulation.' },
        { q: 'True, False or Not Given: Rising dust levels would be entirely beneficial for the climate.', type: 'tfng', options: ['True', 'False', 'Not Given'], answer: 'False', skill: 'Detail', explain: 'Paragraph 3: consequences are "both helpful and harmful" — the statement is False.' },
        { q: 'Which factor is NOT mentioned as influencing Saharan dust loads?', type: 'mc', options: ['Rainfall in the Sahel', 'Agricultural practices', 'Volcanic activity in the Canaries'], answer: 'Volcanic activity in the Canaries', skill: 'Detail', explain: 'Paragraph 3 lists rainfall, drying lakes, and agriculture. The Canaries appear only as a place affected by dust, not a cause.' },
        { q: 'The "intellectual humility" of the final paragraph refers to recognising that ___.', type: 'mc', options: ['scientists know very little about dust', 'a single plume can be harmful in one place and beneficial in another', 'local air quality is unimportant'], answer: 'a single plume can be harmful in one place and beneficial in another', skill: 'Main idea', explain: 'The closing lines: "Consequences in one place, benefits in another, and invisible links between them."' },
      ] },

    { id: 'r-translator-note', level: 'C2', title: 'A Note Left in the Margin', topic: 'Language', type: 'Literary essay', minutes: 4,
      text: [
        'On the last page of my copy of an old translation of Borges, a previous owner has pencilled a single word beside a sentence about mirrors: "thinner". The original reads mejor; the printed English reads better. The pencil proposes thin. Whatever the annotator intended, the note has outlasted them and quietly competes with the translator: better is accurate; thin is true.',
        'This is the old quarrel of translation, dressed in a margin. Accuracy, taken alone, is a poor measure, because a word can be denotatively correct and wrong in every other way — wrong in weight, in temperature, in the shadow it throws on its neighbours. Borges, who translated extravagantly and defended the practice, seems to have understood that a translation\u2019s first duty is not to the dictionary but to the effect: what the sentence does to a reader standing at that point in the book.',
        'Yet effect is exactly what cannot be preserved by rule. The young Borges was called careless for the liberties he took; the accusation presumes that fidelity is a matter of matching items across a gap, as if a poem were a list of cargo. But a sentence is not cargo. It has a pulse, an atmosphere, a tact. The translator must decide, again and again, which losses are fatal and which losses the reader never misses — and the reader, in this sense, is the final collaborator: half of every translation is written in the reading.',
        'I keep the pencil note. Not because thin settles anything — better may still be the right choice — but because it is a record of one reader refusing to let the decision look easy. Perhaps that is the honest description of the whole craft: translation is the art of making choices that look, in the result, as though no choice was ever possible.',
      ],
      questions: [
        { q: 'The pencil note "thinner" is presented as an example of ___.', type: 'mc', options: ['a translation error that should have been printed', 'an alternative that captures the sentence\u2019s effect better than the accurate word', 'proof the annotator did not understand Borges'], answer: 'an alternative that captures the sentence\u2019s effect better than the accurate word', skill: 'Rhetorical structure', explain: '"better is accurate; thin is true" — the note competes with the translator on effect, not correctness.' },
        { q: 'The phrase "wrong in weight, in temperature, in the shadow it throws on its neighbours" argues that ___.', type: 'mc', options: ['some words are physically impossible to translate', 'a denotatively correct word can still fail aesthetically', 'neighbouring words should be removed'], answer: 'a denotatively correct word can still fail aesthetically', skill: 'Implication', explain: 'Accuracy alone is "a poor measure" because a word can be correct and "wrong in every other way".' },
        { q: 'The cargo metaphor is used to ___.', type: 'mc', options: ['defend literal translation', 'reject the idea that fidelity means item-by-item matching', 'describe how books are shipped between countries'], answer: 'reject the idea that fidelity means item-by-item matching', skill: 'Metaphor', explain: 'The accusation of carelessness "presumes that fidelity is a matter of matching items across a gap, as if a poem were a list of cargo" — which the author rejects.' },
        { q: 'In what sense does the author call the reader "the final collaborator"?', type: 'mc', options: ['Readers should correct translations themselves', 'Half of a translation\u2019s effect is produced in the act of reading', 'Borges wrote for a specific reader'], answer: 'Half of a translation\u2019s effect is produced in the act of reading', skill: 'Implication', explain: '"half of every translation is written in the reading."' },
        { q: 'Why does the narrator keep the pencil note?', type: 'mc', options: ['Because it proves thin is the better translation', 'Because it records a reader refusing to treat translation as easy', 'Because it is valuable to collectors'], answer: 'Because it records a reader refusing to treat translation as easy', skill: 'Main idea', explain: 'Not because it "settles anything", but because it refuses "to let the decision look easy".' },
        { q: 'The final sentence defines translation as ___.', type: 'mc', options: ['an impossible task best avoided', 'the art of making choices that conceal themselves as inevitable', 'a science of matching words across languages'], answer: 'the art of making choices that conceal themselves as inevitable', skill: 'Tone', explain: '"…the art of making choices that look, in the result, as though no choice was ever possible."' },
      ] },
  ];
})();

    { id: 'w-m5', level: 'B2', type: 'correct', prompt: 'Correct the sentence:', task: 'If I would have known, I would come earlier.', answer: 'if i had known, i would have come earlier', hints: ['Third conditional'], explain: 'Third conditional: if + past perfect, would have + participle.' },
    { id: 'w-m6', level: 'B2', type: 'paraphrase', prompt: 'Paraphrase in formal English:', task: 'Lots of people think social media is bad for teens.', answer: 'it is widely believed that social media may harm teenagers', hints: ['Avoid "lots of"', 'Use hedging'], explain: 'Formal register: "it is widely believed that" + hedged verb ("may harm"). Many valid paraphrases exist — check for formal vocabulary and hedging.' },
    { id: 'w-m7', level: 'B2', type: 'transform', prompt: 'Combine into one sentence with a participle clause:', task: 'The report was published last month. It changed the debate.', answer: 'published last month, the report changed the debate', hints: ['Was published → past participle'], explain: 'Passive participle clause: "Published last month, …".' },
    { id: 'w-m8', level: 'C1', type: 'paraphrase', prompt: 'Make more concise (one clause):', task: 'The government, which had been under pressure for a long time, finally made a decision to resign.', answer: 'under sustained pressure, the government finally decided to resign', hints: ['Reduce the relative clause', 'Nominalise'], explain: 'Cut the relative clause ("which had been…") and tighten: "Under sustained pressure, the government finally decided to resign."' },
    { id: 'w-m9', level: 'C1', type: 'correct', prompt: 'Correct the academic style error:', task: 'Everyone knows that climate change is definitely getting worse and worse.', answer: 'it is widely accepted that climate change is intensifying', hints: ['Hedging', 'Avoid "everyone knows"'], explain: 'Academic writing hedges claims and avoids absolutes like "everyone knows"/"definitely".' },
    { id: 'w-m10', level: 'C1', type: 'transform', prompt: 'Rewrite with inversion:', task: 'I have never seen such dedication.', answer: 'never have i seen such dedication', hints: ['Front the negative adverbial'], explain: 'Negative adverbial first triggers inversion: "Never have I seen…"' },
    { id: 'w-m11', level: 'B1', type: 'correct', prompt: 'Correct the punctuation and capitalisation:', task: 'my brother who lives in muscat is a doctor', answer: 'my brother, who lives in muscat, is a doctor', hints: ['Non-defining clause needs commas', 'Capitalise Muscat'], explain: 'Extra information about a named person is non-defining → commas; place names take capitals.' },
    { id: 'w-m12', level: 'B2', type: 'correct', prompt: 'Correct the sentence:', task: 'The number of students have increased significantly in the last decade.', answer: 'the number of students has increased significantly in the last decade', hints: ['Agreement with "the number"'], explain: '"The number of…" is singular → "has increased". ("A number of… have" is plural.)' },
    { id: 'w-m13', level: 'B2', type: 'transform', prompt: 'Rewrite with a causative (have something done):', task: 'A mechanic repaired our car last week.', answer: 'we had our car repaired last week', hints: ['have + object + past participle'], explain: 'Causative form: "We had our car repaired" — the action was arranged, not performed by us.' },
    { id: 'w-m14', level: 'B2', type: 'correct', prompt: 'Correct the sentence:', task: 'I look forward to meet you next week.', answer: 'i look forward to meeting you next week', hints: ['"to" here is a preposition'], explain: 'In "look forward to", "to" is a preposition → gerund: "look forward to meeting".' },
    { id: 'w-m15', level: 'C1', type: 'transform', prompt: 'Rewrite for emphasis as a cleft sentence:', task: 'The price surprised me, not the delay.', answer: 'it was the price, not the delay, that surprised me', hints: ['It was … that …'], explain: 'It-cleft: "It was the price, not the delay, that surprised me."' },

  /* Longer prompts: {id, level, genre, prompt, target, minutes, checklist[]} */
  window.DATA.writingPrompts = [
    { id: 'w-p1', level: 'B1', genre: 'Informal email', minutes: 8, target: '80–120 words', prompt: 'A friend has invited you to visit their city next month, but you cannot come until later in the year. Write an email: thank them, explain why you cannot come, and suggest a new time.', checklist: ['Friendly opening and closing', 'Clear reason with a connector (because / since)', 'A specific alternative date'] },

    { id: 'w-p3', level: 'B2', genre: 'Formal email', minutes: 12, target: '120–180 words', prompt: 'You bought a laptop online. It arrived damaged and customer service has not replied to your first message. Write a polite but firm formal complaint: describe the problem, mention your earlier message, and state what you want the company to do.', checklist: ['Formal greeting and sign-off', 'Factual description, no aggressive language', 'A clear, reasonable request', 'Reference to previous contact'] },

    { id: 'w-p8', level: 'C2', genre: 'Critical review', minutes: 40, target: '350–450 words', prompt: 'Choose a short story from the Reading library. Write a critical review that evaluates one stylistic choice the author makes and its effect on the reader.', checklist: ['Precise quotation of at most a few words', 'Analysis of effect, not plot summary', 'A judgement supported by evidence', 'Elegant, varied sentence structures'] },
    { id: 'w-p9', level: 'B1', genre: 'Narrative', minutes: 10, target: '100–150 words', prompt: 'Write the beginning of a story that starts: "The letter arrived on a Tuesday…"', checklist: ['Past tenses used correctly', 'At least one past continuous for background', 'A hook — something that creates suspense'] },

    { id: 'w-p11', level: 'B1', genre: 'Formal letter', minutes: 10, target: '80–120 words', prompt: 'You ordered a book online two months ago. It never arrived, and the shop has not answered your email. Write a polite but firm letter of complaint asking for a refund.', checklist: ['Formal opening ("Dear Sir or Madam") and closing ("Yours faithfully")', 'Facts in order: order date, item, what you have already tried', 'A clear request and a deadline for reply'] },
    { id: 'w-p12', level: 'B2', genre: 'Opinion essay', minutes: 25, target: '250 words', prompt: '"Some people believe that students should be taught how to manage money at school; others think school time should be reserved for academic subjects." Discuss both views and give your own opinion.', checklist: ['Four paragraphs: intro, view 1, view 2 + your opinion, conclusion', 'At least four different linking devices', 'One hedged claim ("may", "can", "tends to")'] },
    { id: 'w-p13', level: 'B2', genre: 'Problem–solution report', minutes: 20, target: '200–250 words', prompt: 'Traffic in your city has worsened sharply in five years. Write a report describing the problem, proposing two solutions, and explaining which one you would prioritise and why.', checklist: ['Descriptive paragraph with at least two consequences', 'Two clearly labelled solutions', 'A justified choice (why one over the other)'] },
    { id: 'w-p14', level: 'C1', genre: 'Critical review', minutes: 30, target: '300 words', prompt: 'Choose a book, film, or series you know well. Write a review that argues a clear judgement, supports it with specific evidence from the work, and acknowledges one strong counter-argument to your judgement.', checklist: ['A judgement stated in the first paragraph', 'Specific evidence (scenes, sentences, moments — not vague praise)', 'One counter-argument fairly represented and answered'] },
    { id: 'w-p15', level: 'C1', genre: 'Abstract discussion', minutes: 30, target: '300 words', prompt: '"Technology that makes a task easier usually makes someone\u2019s judgement weaker." Discuss this claim with reference to at least one field you know well.', checklist: ['The claim is defined precisely before you agree or disagree', 'At least one concrete example analysed, not just mentioned', 'A conclusion that does more than repeat the introduction'] },

    { id: 'l-6', level: 'B2', title: 'University Lecture: The Placebo Effect', type: 'lecture',
      tracks: [
        { speaker: 'Lecturer', text: 'Today I want to talk about the placebo effect, and to challenge one popular misunderstanding of it. Many people describe placebos as "fake medicine" that works because patients are gullible. The evidence points somewhere more interesting. Placebo responses are real, measurable biological events, but they are not mysterious. They depend heavily on context: the colour of the pill, the confidence of the doctor, and — crucially — whether the patient has had positive experiences with treatment before. In one well-known study, patients given placebos that were described as expensive reported significantly more pain relief than those given identical pills described as cheap. Price, in other words, became part of the medicine. So if you take one idea from this lecture, take this: the placebo effect is not a failure of science. It is a finding about how treatment works, and serious research now designs around it rather than dismissing it.' },
      ],
      questions: [
        { q: 'The lecturer challenges the idea that placebos work because patients are ___.', type: 'mc', options: ['careful', 'gullible', 'allergic'], answer: 'gullible', skill: 'Detail', explain: 'He challenges the description of placebos working because "patients are gullible".' },

        { q: 'NOT a factor the lecturer mentions as shaping placebo responses:', type: 'mc', options: ['The colour of the pill', 'The doctor\u2019s confidence', 'The weather that day'], answer: 'The weather that day', skill: 'Detail', explain: 'He mentions pill colour, doctor confidence, and past treatment experiences — not weather.' },

    { id: 'l-7', level: 'C1', title: 'Talk: The Science of Habit', type: 'lecture',
      tracks: [
        { speaker: 'Speaker', text: 'Habits, we are often told, are hard to break. The research suggests something subtler: habits are not hard to break so much as hard to notice, because they run on cues the environment supplies rather than on decisions we consciously make. A smoker who always smokes on the balcony is not fighting a desire for nicotine alone; she is fighting a balcony. This is why the most effective habit interventions are not motivational but architectural. Change the layout of the environment — put the phone charger in another room, take the biscuit tin off the counter — and you have changed the cue, which changes the behaviour, often without any willpower being spent at all. Willpower, in this model, is the expensive tool you reach for only after architecture has failed.' },
      ],

    { id: 'l-10', level: 'C1', title: 'Lecture: The Invention of the Calendar', type: 'lecture',
      tracks: [
        { speaker: 'Lecturer', text: 'Today I want to convince you that the calendar is not a neutral tool, but a piece of technology with winners and losers. Consider the French Revolutionary calendar of 1793: twelve months of three ten-day weeks, each day divided into ten hours of one hundred minutes. Mathematically elegant, universally hated, and abandoned within twelve years.' },
        { speaker: 'Lecturer', text: 'Why did it fail? Partly, of course, politics — the calendar was a Revolution product, and when the Revolution fell out of fashion, so did its weeks. But there was a deeper problem: the seven-day week is not merely a counting convention. It is a rhythm that religious observance, markets, and family life had been built around for millennia. The ten-day week demanded that rest come less often, and workers who had rested one day in seven were being told to rest one day in ten.' },
        { speaker: 'Lecturer', text: 'The episode illustrates what historians of technology call embeddedness: a standard becomes almost impossible to replace once enough of life has been organised around it. The same logic explains why attempts to rationalise measurement — spelling, or money, or time — succeed only when they ride along with a power shift. Standards do not win by being better; they win by being adopted by institutions that matter.' },

})();

/* ============================================================
   features/spaced-repetition.js — modified SM-2 scheduler.
   Boxes 0-5; intervals grow [10min, 1d, 3d, 7d, 16d, 35d].
   Rating: again(0) hard(1) good(2) easy(3).
   ============================================================ */
(function () {
  const S = window.Store.s;
  const INTERVALS = [10 / 1440, 1, 3, 7, 16, 35]; // days

  function due(wordId) {
    const r = S.vocab[wordId];
    return r && r.due <= Date.now();
  }

  function addWord(wordId, word) {
    if (S.vocab[wordId]) return;
    S.vocab[wordId] = { status: 'new', box: 0, ease: 2.5, due: Date.now(), reps: 0, lapses: 0, added: Date.now(), word };
    Store.save();
  }

  function rate(wordId, rating) {
    const r = S.vocab[wordId];
    if (!r) return;
    r.reps++;
    if (rating === 0) { // again
      r.box = 0; r.lapses++; r.ease = Math.max(1.3, r.ease - 0.2);
    } else {
      r.box = Math.min(5, r.box + (rating === 3 ? 2 : rating === 1 ? 0 : 1));
      r.ease = Math.max(1.3, Math.min(3.2, r.ease + (rating === 1 ? -0.15 : rating === 3 ? 0.15 : 0.05)));
    }
    let days = INTERVALS[r.box] || 1;
    days = days * (rating === 1 ? 1.2 : 1) * (r.ease / 2.5);
    r.due = Date.now() + days * 864e5;
    r.status = r.box >= 4 ? 'known' : r.box >= 1 ? 'learning' : 'learning';
    if (rating === 0) r.status = 'forgotten';
    Store.save();
  }

  function dueList() {
    return Object.keys(S.vocab).filter(due);
  }

  function counts() {
    const c = { new: 0, learning: 0, known: 0, forgotten: 0, dueNow: 0, total: 0 };
    for (const r of Object.values(S.vocab)) {
      c.total++; c[r.status] = (c[r.status] || 0) + 1;
      if (r.due <= Date.now()) c.dueNow++;
    }
    return c;
  }

  window.SRS = { addWord, rate, due, dueList, counts };
})();

    for (let i = 6; i >= 0; i--) {
      const dt = new Date(); dt.setDate(dt.getDate() - i);
      const key = Store.todayStr(dt);
      const a = S.activity[key] || { min: 0, items: 0 };
      days.push({ key, min: a.min || 0, items: a.items || 0, today: i === 0 });
    }
    const max = Math.max(10, days.reduce((m, d) => Math.max(m, d.min), 0));
    const total = days.reduce((a, d) => a + d.min, 0);
    const active = days.filter(d => d.min > 0).length;
    return el('div', { class: 'card', style: 'margin-bottom:24px' },
      el('div', { style: 'display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px' },

        el('span', { class: 'mono', style: 'font-size:.76rem' },
          total + ' min total · ' + active + '/7 active days · goal ' + S.prefs.dailyGoalMin + ' min/day')),
      el('div', { style: 'display:flex;gap:10px;align-items:flex-end;height:104px;margin-top:16px' },
        ...days.map(d => {
          const h = d.min > 0 ? Math.max(6, Math.round(d.min / max * 72)) : 4;
          const bg = d.min > 0 ? (d.today ? 'var(--accent)' : 'var(--accent-soft)') : 'var(--line-soft)';
          return el('div', { style: 'flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end', title: d.key + ': ' + d.min + ' min, ' + d.items + ' activities' },

            el('div', { style: 'width:68%;height:' + h + 'px;border-radius:5px 5px 2px 2px;background:' + bg + ';' + (d.min > 0 && !d.today ? 'border:1px solid var(--accent)' : '') }),
            el('span', { class: 'mono', style: 'font-size:.7rem;color:' + (d.today ? 'var(--ink)' : 'var(--ink-faint)') }, d.key.slice(8)));
        })));
  }

  function nextRecommended() {
    const S = Store.s;
    // Priority: due reviews > placement > unfinished lesson > next curriculum lesson
    const due = SRS.counts().dueNow;
    if (!S.profile.placementDone) return { text: 'Take the placement assessment to find your starting level.', meta: '5 min · Assessment', href: '#/assessments' };
    if (due >= 3) return { text: 'Review ' + due + ' vocabulary cards that are due today.', meta: due + ' cards · ' + Math.max(2, Math.round(due / 2)) + ' min · Review', href: '#/review' };
    const unfinished = Object.entries(S.lessons).find(([id, L]) => L.status === 'in-progress');
    if (unfinished) return { text: 'Finish the lesson you started: ' + lessonTitle(unfinished[0]) + '.', meta: 'Resume · Learn', href: '#/learn' };
    const next = nextCurriculumLesson();
    if (next) return { text: next.title + ' — your next step in the ' + next.level + ' course.', meta: next.est, href: next.href };
    return { text: 'You have reached the end of the current curriculum. Try an IELTS practice set.', meta: 'Challenge · IELTS', href: '#/ielts' };
  }

  function lessonTitle(id) {
    if (id.startsWith('g-')) return (D().grammar.find(g => g.id === id) || {}).title || id;
    if (id.startsWith('r-')) return (D().reading.find(r => r.id === id) || {}).title || id;
    return id;
  }

  function nextCurriculumLesson() {
    const S = Store.s;
    for (const lvl of D().curriculum.levels) {
      for (const u of lvl.units) {
        for (const l of u.lessons) {
          const st = S.lessons[l.id];
          if (!st || st.status !== 'completed') {
            const href = l.kind === 'grammar' ? '#/grammar/' + l.id : l.kind === 'reading' ? '#/reading/' + l.id : l.kind === 'listening' ? '#/listening/' + l.id : '#/writing';
            return { title: l.title, level: lvl.id, href, est: (l.kind === 'grammar' ? '6 min' : l.kind === 'reading' ? '8 min' : '10 min') + ' · ' + lvl.id + ' ' + l.kind };
          }
        }
      }
      // Level gate: require checkpoint before moving on? Keep simple — sequential.
    }
    return null;
  }

  function missionState() {
    // Deterministic per-day rotation based on date + mistakes
    const S = Store.s;
    const t = Store.todayStr();
    const key = 'mission:' + t;
    let m = S.planner[key] && S.planner[key].date === t ? S.planner[key] : null;
    if (!m) {
      const due = SRS.counts().dueNow;
      m = { date: t, steps: [
        { kind: 'grammar', label: 'Grammar practice', minutes: 2, done: false },
        { kind: 'vocab', label: due >= 3 ? 'Review ' + Math.min(10, due) + ' due words' : 'Learn new vocabulary', minutes: 2, done: false },
        { kind: 'reading', label: 'Reading exercise', minutes: 3, done: false },
        { kind: 'writing', label: 'Micro writing task', minutes: 2, done: false },
      ], doneCount: 0 };
      S.planner[key] = m; Store.save();
    }
    return m;
  }

  function ieltsPanel() {
    const S = Store.s;

  function progressOverview() {
    const S = Store.s;
    const vc = SRS.counts();
    const lessonsDone = Object.values(S.lessons).filter(l => l.status === 'completed').length;
    const grammarDone = Object.values(S.lessons).filter((l, i) => Object.keys(S.lessons)[i].startsWith('g-') && l.status === 'completed').length;
    const readings = Object.entries(S.reading).filter(([id, r]) => r.read).length;
    const reads = Object.values(S.reading).filter(r => r.attempts > 0);
    const readAcc = reads.length ? Math.round(reads.reduce((a, r) => a + (r.best || 0), 0) / reads.length) : null;
    const writes = S.writing.history.length;
    const speak = (S.activity && Object.values(S.activity).reduce((a, d) => a + (d.skills.speaking || 0), 0));

      ),
      el('div', { class: 'grid cols-3' },

    );
    function st(v, k) { return el('div', { class: 'stat' }, el('div', { class: 'v' }, String(v)), el('div', { class: 'k' }, k)); }

  function skillOverview() {
    const S = Store.s;
    const skills = [
      ['Reading', estimateSkill('reading'), lastActive('reading'), '#/reading'],
      ['Writing', estimateSkill('writing'), lastActive('writing'), '#/writing'],
      ['Vocabulary', estimateSkill('vocab'), lastActive('vocab'), '#/vocabulary'],
      ['Grammar', estimateSkill('grammar'), lastActive('grammar'), '#/grammar'],
      ['Listening', estimateSkill('listening'), lastActive('listening'), '#/listening'],
      ['Speaking', estimateSkill('speaking'), lastActive('speaking'), '#/speaking'],
    ];
    return el('div', { class: 'card' },
