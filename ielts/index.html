<style>
/* ============================================================
   Lexicon — Design Tokens & Themes
   Six intentionally designed themes. One token vocabulary.
   ============================================================ */

:root {
  /* Typography */
  --font-ui: "Inter", "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-read: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Source Serif 4", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;

  /* Spacing scale */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px; --s8: 64px;

  /* Radii */
  --r1: 3px; --r2: 6px; --r3: 10px; --r4: 16px;

  /* Motion */
  --t-fast: 120ms ease; --t-med: 220ms ease;

  /* Layout */
  --sidebar-w: 240px;
  --sidebar-w-collapsed: 64px;
  --content-max: 1160px;
  --read-max: 68ch;

  /* Z layers */
  --z-nav: 40; --z-modal: 90; --z-toast: 100;

  /* Accent (may be overridden by settings) */
  --accent: var(--theme-accent);
  --accent-ink: var(--theme-accent-ink);

  /* Chart / semantic hues get per-theme values below */
  --good: var(--theme-good);
  --warn: var(--theme-warn);
  --bad: var(--theme-bad);
}

/* ---------- Theme: Claude Warm (default) ---------- */
:root, [data-theme="claude"] {
  --bg: #F5F1EA;
  --bg-deep: #EFE9DE;
  --surface: #FBF9F4;
  --surface-2: #F1ECE2;
  --ink: #2C2620;
  --ink-soft: #5C5348;
  --ink-faint: #8F8477;
  --line: #E0D7C7;
  --line-soft: #EAE3D5;
  --theme-accent: #B4590B;
  --theme-accent-ink: #FFF8F0;
  --theme-accent-soft: rgba(180, 89, 11, .1);
  --theme-good: #3D6B4F;
  --theme-warn: #9A6A00;
  --theme-bad: #A03D32;
  --shadow: 0 1px 2px rgba(60, 50, 30, .06), 0 4px 16px rgba(60, 50, 30, .05);
  --dot: rgba(44, 38, 32, .16);
  --panel-grad: linear-gradient(180deg, #FBF9F4 0%, #F7F2E9 100%);
}

/* ---------- Theme: Nothing Mono ---------- */
[data-theme="nothing"] {
  --bg: #101010;
  --bg-deep: #0A0A0A;
  --surface: #161616;
  --surface-2: #1D1D1D;
  --ink: #EDEDED;
  --ink-soft: #ABABAB;
  --ink-faint: #6E6E6E;
  --line: #2A2A2A;
  --line-soft: #222222;
  --theme-accent: #F2F2F2;
  --theme-accent-ink: #101010;
  --theme-accent-soft: rgba(255, 255, 255, .08);
  --theme-good: #9FAF9B;
  --theme-warn: #C9B37E;
  --theme-bad: #D69A93;
  --shadow: 0 1px 0 rgba(255,255,255,.04), 0 8px 24px rgba(0,0,0,.4);
  --dot: rgba(255, 255, 255, .22);
  --panel-grad: none;
}

/* ---------- Theme: Catppuccin Mocha ---------- */
[data-theme="catppuccin"] {
  --bg: #1E1E2E;
  --bg-deep: #11111B;
  --surface: #262637;
  --surface-2: #313244;
  --ink: #CDD6F4;
  --ink-soft: #A6ADC8;
  --ink-faint: #7F849C;
  --line: #3B3B52;
  --line-soft: #313244;
  --theme-accent: #89B4FA;
  --theme-accent-ink: #11111B;
  --theme-accent-soft: rgba(137, 180, 250, .12);
  --theme-good: #A6E3A1;
  --theme-warn: #FAB387;
  --theme-bad: #F38BA8;
  --shadow: 0 4px 18px rgba(17, 17, 27, .45);
  --dot: rgba(205, 214, 244, .2);
  --panel-grad: linear-gradient(180deg, #262637 0%, #1E1E2E 100%);
}

/* ---------- Theme: New York Midnight ---------- */
[data-theme="midnight"] {
  --bg: #0C1220;
  --bg-deep: #070B14;
  --surface: #121A2C;
  --surface-2: #1A2440;
  --ink: #D5DFF0;
  --ink-soft: #96A4C2;
  --ink-faint: #5F6E8C;
  --line: #223052;
  --line-soft: #1A2440;
  --theme-accent: #6FA0E8;
  --theme-accent-ink: #0A101E;
  --theme-accent-soft: rgba(111, 160, 232, .12);
  --theme-good: #7BC9A3;
  --theme-warn: #E0B36B;
  --theme-bad: #E07B7B;
  --shadow: 0 6px 24px rgba(4, 8, 18, .55);
  --dot: rgba(213, 223, 240, .18);
  --panel-grad: linear-gradient(180deg, #131C31 0%, #0E1526 100%);
}

/* ---------- Theme: Classic Light ---------- */
[data-theme="light"] {
  --bg: #FFFFFF;
  --bg-deep: #F2F4F7;
  --surface: #FFFFFF;
  --surface-2: #F5F7FA;
  --ink: #1A2029;
  --ink-soft: #4E5866;
  --ink-faint: #8A94A3;
  --line: #DEE3EA;
  --line-soft: #E9EDF2;
  --theme-accent: #0F5EA8;
  --theme-accent-ink: #FFFFFF;
  --theme-accent-soft: rgba(15, 94, 168, .09);
  --theme-good: #1D7A4D;
  --theme-warn: #946200;
  --theme-bad: #B3362C;
  --shadow: 0 1px 2px rgba(20, 30, 50, .07), 0 3px 12px rgba(20, 30, 50, .05);
  --dot: rgba(26, 32, 41, .15);
  --panel-grad: none;
}

/* ---------- Theme: Classic Dark ---------- */
[data-theme="dark"] {
  --bg: #17181C;
  --bg-deep: #101114;
  --surface: #1E2025;
  --surface-2: #262930;
  --ink: #E4E6EA;
  --ink-soft: #A8ACB6;
  --ink-faint: #6C7079;
  --line: #32353D;
  --line-soft: #282B32;
  --theme-accent: #C8A24A;
  --theme-accent-ink: #17181C;
  --theme-accent-soft: rgba(200, 162, 74, .12);
  --theme-good: #7FB98A;
  --theme-warn: #D9B778;
  --theme-bad: #D98B84;
  --shadow: 0 6px 20px rgba(0, 0, 0, .4);
  --dot: rgba(228, 230, 234, .18);
  --panel-grad: none;
}
/* Reset, typography, global behaviors */
*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; }

html { font-size: var(--user-font-size, 16px); }

body {
  font-family: var(--font-ui);
  background: var(--bg);
  color: var(--ink);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

img, svg { display: block; max-width: 100%; }
input, button, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: none; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

h1, h2, h3, h4 { line-height: 1.2; font-weight: 650; letter-spacing: -0.015em; text-wrap: balance; }
h1 { font-size: 1.65rem; }
h2 { font-size: 1.25rem; }
h3 { font-size: 1.02rem; }
p { text-wrap: pretty; }

::selection { background: var(--accent-soft); }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--r1);
}

.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

.mono { font-family: var(--font-mono); font-size: .74rem; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-faint); }
.mono-val { font-family: var(--font-mono); font-size: .95em; }

/* Reduced motion — both OS preference and user setting */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
html[data-motion="off"] *, html[data-motion="off"] *::before, html[data-motion="off"] *::after {
  animation-duration: .01ms !important; transition-duration: .01ms !important;
}

/* Dot-matrix decorative texture (Nothing-inspired, cheap to render) */
.dotgrid {
  background-image: radial-gradient(var(--dot) 1px, transparent 1.2px);
  background-size: 8px 8px;
}

.skip-link { position: absolute; left: -9999px; top: 0; background: var(--accent); color: var(--accent-ink, #101014); padding: 10px 16px; border-radius: 0 0 8px 0; z-index: 200; font-weight: 600; text-decoration: none; }
.skip-link:focus { left: 0; }

.icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; padding: 0; background: transparent; border: 1px solid var(--line); border-radius: 8px; color: var(--ink-soft); cursor: pointer; }
.icon-btn:hover { color: var(--ink); border-color: var(--accent); }
/* App shell: sidebar rail, page header, main region, mobile nav */

.app { display: grid; grid-template-columns: var(--sidebar-w) 1fr; min-height: 100vh; }

.sidebar {
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  background: var(--bg-deep);
  border-right: 1px solid var(--line-soft);
  display: flex; flex-direction: column;
  padding: var(--s4) var(--s3);
  z-index: var(--z-nav);
}
.brand { display: flex; align-items: center; gap: var(--s3); padding: var(--s2) var(--s2) var(--s5); }
.brand-mark {
  width: 38px; height: 38px; border-radius: 10px; flex: none;
  background: var(--surface-2); border: 1px solid var(--line);
  display: grid; place-items: center;
}
.brand-mark svg { display: block; }
.brand-name { font-weight: 700; letter-spacing: -0.02em; }
.brand-sub { font-family: var(--font-mono); font-size: .62rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); }

.nav-group { margin-bottom: var(--s5); }
.nav-group-label {
  font-family: var(--font-mono); font-size: .62rem; letter-spacing: .14em;
  text-transform: uppercase; color: var(--ink-faint);
  padding: 0 var(--s2) var(--s2);
}
.nav-link {
  display: flex; align-items: center; gap: var(--s3);
  padding: 7px var(--s2); border-radius: var(--r2);
  color: var(--ink-soft); font-size: .92rem; font-weight: 500;
  transition: background var(--t-fast), color var(--t-fast);
  border-left: 2px solid transparent;
}
.nav-link:hover { background: var(--surface-2); color: var(--ink); text-decoration: none; }
.nav-link[aria-current="page"] {
  background: var(--accent-soft); color: var(--ink); font-weight: 650;
  border-left-color: var(--accent);
}
.nav-link .ni { width: 18px; height: 18px; flex: none; opacity: .8; }

.sidebar-foot { margin-top: auto; padding-top: var(--s4); border-top: 1px solid var(--line-soft); }

/* Streak chip in sidebar */
.streak-chip { display: flex; align-items: center; gap: var(--s2); padding: var(--s2); font-size: .82rem; color: var(--ink-soft); }
.streak-chip b { color: var(--ink); }

/* Main column */
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: calc(var(--z-nav) - 5);
  display: flex; align-items: center; gap: var(--s4);
  padding: var(--s3) var(--s6);
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line-soft);
}
.topbar h1 { font-size: 1.15rem; }
.topbar .spacer { flex: 1; }

.menu-btn { display: none; }

.page { padding: var(--s5) var(--s6) var(--s8); max-width: var(--content-max); width: 100%; margin: 0 auto; }

/* Mobile */
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .sidebar {
    position: fixed; left: 0; top: 0; width: min(300px, 84vw);
    transform: translateX(-102%); transition: transform var(--t-med);
    box-shadow: var(--shadow);
  }
  .sidebar.open { transform: none; }
  .menu-btn { display: inline-flex; }
  .page { padding: var(--s4) var(--s4) var(--s7); }
  .topbar { padding: var(--s3) var(--s4); }
}
@media (max-width: 600px) {
  .topbar h1 { font-size: 1rem; }
}
/* Buttons, cards, forms, quiz UI, chips, modals, toasts, progress, tables */

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s2);
  padding: 9px 16px; border-radius: var(--r2);
  font-weight: 600; font-size: .92rem;
  border: 1px solid var(--line);
  background: var(--surface); color: var(--ink);
  transition: background var(--t-fast), border-color var(--t-fast), transform var(--t-fast);
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-soft); }
.btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.btn.small { padding: 5px 10px; font-size: .82rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r3); padding: var(--s5);
  box-shadow: var(--shadow);
}
.card.tint { background: var(--panel-grad, var(--surface)); }
.card.flat { box-shadow: none; }

.grid { display: grid; gap: var(--s4); }
.grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
.grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
.grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
@media (max-width: 900px) { .grid.cols-3, .grid.cols-4 { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 600px) { .grid.cols-2, .grid.cols-3, .grid.cols-4 { grid-template-columns: 1fr; } }

/* Chips & badges */
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: var(--font-mono); font-size: .66rem; letter-spacing: .06em; text-transform: uppercase;
  padding: 3px 8px; border-radius: 99px;
  border: 1px solid var(--line); color: var(--ink-soft); background: var(--surface-2);
}
.chip.accent { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
.chip.good { color: var(--good); border-color: color-mix(in srgb, var(--good) 35%, var(--line)); }
.chip.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 35%, var(--line)); }
.chip.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 35%, var(--line)); }

/* Forms */
.field { display: flex; flex-direction: column; gap: var(--s2); }
.field label { font-size: .85rem; font-weight: 600; color: var(--ink-soft); }
.input, textarea.input, select.input {
  background: var(--bg-deep); border: 1px solid var(--line); border-radius: var(--r2);
  padding: 9px 12px; color: var(--ink); width: 100%;
}
.input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
textarea.input { resize: vertical; min-height: 120px; line-height: 1.6; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r2); overflow: hidden; background: var(--bg-deep); }
.seg button { padding: 7px 12px; font-size: .84rem; color: var(--ink-soft); border-right: 1px solid var(--line-soft); }
.seg button:last-child { border-right: none; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }

/* Progress bars */
.bar { height: 7px; border-radius: 99px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--line-soft); }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width var(--t-med); }
.bar.good > i { background: var(--good); }
.bar.slim { height: 4px; }

/* Quiz */
.quiz-opt {
  display: flex; align-items: flex-start; gap: var(--s3); width: 100%; text-align: left;
  padding: var(--s3) var(--s4); border-radius: var(--r2);
  border: 1px solid var(--line); background: var(--surface);
  font-size: .95rem; line-height: 1.45;
  transition: border-color var(--t-fast), background var(--t-fast);
}
.quiz-opt:hover { border-color: var(--accent); background: var(--surface-2); }
.quiz-opt .key { font-family: var(--font-mono); font-size: .72rem; color: var(--ink-faint); border: 1px solid var(--line); border-radius: var(--r1); padding: 1px 6px; flex: none; margin-top: 2px; }
.quiz-opt.correct { border-color: var(--good); background: color-mix(in srgb, var(--good) 10%, var(--surface)); }
.quiz-opt.correct .key { color: var(--good); border-color: var(--good); }
.quiz-opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 8%, var(--surface)); }
.quiz-opt:disabled { cursor: default; }
.quiz-opt:disabled:not(.correct):not(.wrong):hover { border-color: var(--line); background: var(--surface); }

.explain {
  margin-top: var(--s3); padding: var(--s3) var(--s4);
  border-radius: var(--r2); font-size: .88rem; line-height: 1.6;
  border-left: 3px solid var(--accent); background: var(--accent-soft);
}
.explain.ok { border-left-color: var(--good); background: color-mix(in srgb, var(--good) 9%, transparent); }
.explain.err { border-left-color: var(--bad); background: color-mix(in srgb, var(--bad) 8%, transparent); }

/* Tables */
.table { width: 100%; border-collapse: collapse; font-size: .9rem; }
.table th { font-family: var(--font-mono); font-size: .66rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); text-align: left; padding: var(--s2) var(--s3); border-bottom: 1px solid var(--line); }
.table td { padding: var(--s3); border-bottom: 1px solid var(--line-soft); }
.table tr:last-child td { border-bottom: none; }

/* Modal */
.modal-back {
  position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: var(--z-modal);
  display: grid; place-items: center; padding: var(--s4);
}
.modal {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r3);
  max-width: 520px; width: 100%; max-height: 86vh; overflow-y: auto;
  padding: var(--s5); box-shadow: var(--shadow);
}

/* Toast */
.toast-zone { position: fixed; bottom: var(--s5); right: var(--s5); z-index: var(--z-toast); display: flex; flex-direction: column; gap: var(--s2); }
.toast {
  background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--accent);
  padding: var(--s3) var(--s4); border-radius: var(--r2); box-shadow: var(--shadow);
  font-size: .88rem; max-width: 340px; animation: toast-in var(--t-med);
}
.toast.ok { border-left-color: var(--good); }
.toast.err { border-left-color: var(--bad); }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }

/* Heatmap */
.heatmap { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 10px); gap: 3px; width: max-content; }
.heatmap i { width: 10px; height: 10px; border-radius: 2px; background: var(--surface-2); border: 1px solid var(--line-soft); }
.heatmap i[data-lvl="1"] { background: color-mix(in srgb, var(--accent) 30%, var(--surface)); }
.heatmap i[data-lvl="2"] { background: color-mix(in srgb, var(--accent) 55%, var(--surface)); }
.heatmap i[data-lvl="3"] { background: var(--accent); }

/* Stat block */
.stat { border-left: 2px solid var(--line); padding-left: var(--s4); }
.stat .v { font-size: 1.45rem; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.stat .k { font-family: var(--font-mono); font-size: .64rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); }

/* Empty state */
.empty {
  text-align: center; padding: var(--s7) var(--s5); color: var(--ink-soft);
  border: 1px dashed var(--line); border-radius: var(--r3); background: var(--surface);
}
.empty .icon { font-size: 1.6rem; margin-bottom: var(--s3); opacity: .6; }
.empty p { max-width: 46ch; margin: var(--s2) auto var(--s4); font-size: .92rem; }

/* Flashcard */
.flashcard {
  perspective: 900px; cursor: pointer; min-height: 210px;
}
.flashcard .inner {
  position: relative; width: 100%; height: 100%; min-height: inherit;
  transform-style: preserve-3d; transition: transform .35s ease;
}
.flashcard.flipped .inner { transform: rotateY(180deg); }
.flashcard .face {
  position: absolute; inset: 0; backface-visibility: hidden;
  display: flex; flex-direction: column; justify-content: center; align-items: center; gap: var(--s3);
  padding: var(--s5); text-align: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r4);
  box-shadow: var(--shadow);
}
.flashcard .face.back { transform: rotateY(180deg); }
.flashcard .word { font-size: 1.9rem; font-weight: 700; letter-spacing: -0.02em; }
.flashcard .ipa { font-family: var(--font-mono); color: var(--ink-soft); }
html[data-motion="off"] .flashcard .inner { transition: none; }

/* Audio/record pill */
.pill-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s3); }
.rec-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); animation: pulse 1.2s infinite; display: inline-block; }
@keyframes pulse { 50% { opacity: .35; } }
html[data-motion="off"] .rec-dot { animation: none; }

/* Diff for dictation/writing */
diff-w, .w-ok { color: var(--good); }
.w-bad { color: var(--bad); text-decoration: underline wavy; }
.w-miss { color: var(--ink-faint); border-bottom: 1px dashed var(--ink-faint); }

/* Keyboard hint */
kbd {
  font-family: var(--font-mono); font-size: .7rem; padding: 1px 5px;
  border: 1px solid var(--line); border-bottom-width: 2px; border-radius: var(--r1);
  background: var(--surface-2); color: var(--ink-soft);
}

/* Word lookup popover */
.lookup {
  position: absolute; z-index: var(--z-modal); max-width: 320px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r2);
  box-shadow: var(--shadow); padding: var(--s4); font-size: .88rem;
}

.reading-body { font-family: var(--font-read); font-size: var(--read-size, 1.08rem); line-height: var(--read-lh, 1.75); }
.reading-body p { margin-bottom: 1em; }
.reading-body .w { cursor: pointer; border-radius: 2px; }
.reading-body .w:hover { background: var(--accent-soft); }

/* Session progress dots */
.dots { display: flex; gap: 6px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--line); }
.dots i.done { background: var(--good); border-color: var(--good); }
.dots i.cur { border-color: var(--accent); background: var(--accent-soft); }

/* IELTS exam mode */
.exam { border: 1px solid var(--line); border-radius: var(--r3); overflow: hidden; }
.exam-head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s4); padding: var(--s3) var(--s5); background: var(--bg-deep); border-bottom: 1px solid var(--line); }
.exam-head .timer { font-family: var(--font-mono); font-size: 1.05rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.exam-body { display: grid; grid-template-columns: 1fr 340px; min-height: 480px; }
.exam-passage { padding: var(--s5); border-right: 1px solid var(--line-soft); overflow-y: auto; max-height: 70vh; }
.exam-questions { padding: var(--s5); overflow-y: auto; max-height: 70vh; }
.q-flag.on { color: var(--warn); }
@media (max-width: 1000px) { .exam-body { grid-template-columns: 1fr; } .exam-passage { border-right: none; border-bottom: 1px solid var(--line-soft); max-height: none; } .exam-questions { max-height: none; } }

/* Timer ring */
.ring { position: relative; width: 74px; height: 74px; }
.ring svg { transform: rotate(-90deg); }
.ring .num { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-mono); font-size: .95rem; font-weight: 600; }

/* Range */
input[type="range"] { accent-color: var(--accent); }

/* Checklist rubric */
.rubric li { display: flex; gap: var(--s3); align-items: flex-start; padding: var(--s2) 0; border-bottom: 1px solid var(--line-soft); font-size: .92rem; }
.rubric { list-style: none; padding: 0; }

/* ---------- Tables, chip buttons (progress/planner/settings) ---------- */
.tbl { width: 100%; border-collapse: collapse; font-size: .9rem; }
.tbl th, .tbl td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line-soft); }
.tbl thead th { font-family: var(--font-mono); font-size: .64rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); }
.tbl td .bar-track { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; min-width: 120px; }
.tbl td .bar-fill { display: block; height: 100%; background: var(--accent); border-radius: 3px; }

.chip-btn { cursor: pointer; font-family: var(--font-mono); }
.chip-btn.on { background: var(--accent); color: var(--accent-ink, #fff); border-color: var(--accent); }

/* ---------- Theme picker cards ---------- */
.theme-card { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); cursor: pointer; text-align: left; }
.theme-card:hover { border-color: var(--accent); }
.theme-card.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.swatch-row { display: flex; gap: 4px; }
.swatch { width: 22px; height: 22px; border-radius: 5px; border: 1px solid rgba(128,128,128,.35); display: inline-block; }
/* Page-specific layouts */

/* Dashboard hero */
.hero {
  border: 1px solid var(--line); border-radius: var(--r4); padding: var(--s6);
  background: var(--panel-grad, var(--surface)); position: relative; overflow: hidden;
}
.hero::after {
  content: ""; position: absolute; right: -30px; top: -30px; width: 170px; height: 170px;
  background-image: radial-gradient(var(--dot) 1px, transparent 1.2px); background-size: 8px 8px;
  opacity: .5; pointer-events: none;

.hero .greet { font-family: var(--font-mono); font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.hero h2 { font-size: 1.5rem; margin: var(--s2) 0 var(--s3); }

/* Mission card */
.mission-item { display: flex; align-items: center; gap: var(--s3); padding: var(--s3) 0; border-bottom: 1px solid var(--line-soft); }
.mission-item:last-child { border-bottom: none; }
.mission-item .mk { width: 22px; height: 22px; flex: none; }

/* Skill meter rows */
.skill-row { display: flex; align-items: center; gap: var(--s4); padding: var(--s3) 0; border-bottom: 1px solid var(--line-soft); }
.skill-row:last-child { border-bottom: none; }
.skill-row .grow { flex: 1; min-width: 0; }

/* Reading library */
.filterbar { display: flex; flex-wrap: wrap; gap: var(--s3); margin-bottom: var(--s5); align-items: center; }
.lib-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: var(--s4); }
.lib-card { display: flex; flex-direction: column; gap: var(--s2); padding: var(--s4); border: 1px solid var(--line); border-radius: var(--r3); background: var(--surface); transition: border-color var(--t-fast), transform var(--t-fast); }
.lib-card:hover { border-color: var(--accent); transform: translateY(-2px); }
html[data-motion="off"] .lib-card:hover { transform: none; }
.lib-card h3 { font-size: .98rem; }
.lib-card .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; }

/* Reading view */
.read-shell { max-width: 860px; margin: 0 auto; }
.read-tools { display: flex; flex-wrap: wrap; gap: var(--s3); align-items: center; justify-content: space-between; margin-bottom: var(--s5); }

/* Writing workspace */
.writer { display: grid; grid-template-columns: 1fr 300px; gap: var(--s5); }
@media (max-width: 950px) { .writer { grid-template-columns: 1fr; } }
.writer textarea { min-height: 300px; font-family: var(--font-read); font-size: 1.02rem; }
.writer .meta-panel { display: flex; flex-direction: column; gap: var(--s4); }

/* Grammar lesson */
.lesson-nav { display: flex; gap: var(--s2); flex-wrap: wrap; margin-bottom: var(--s5); }
.topic-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: var(--s4); }
.topic-card { padding: var(--s4); border: 1px solid var(--line); border-radius: var(--r3); background: var(--surface); text-align: left; transition: border-color var(--t-fast); }
.topic-card:hover { border-color: var(--accent); }
.topic-card .status { margin-left: auto; }
.topic-card h3 { font-size: .95rem; margin: var(--s2) 0 4px; }
.topic-card p { font-size: .84rem; color: var(--ink-soft); }
.topic-card .head { display: flex; align-items: center; justify-content: space-between; }

.formula {
  font-family: var(--font-mono); font-size: .9rem; padding: var(--s3) var(--s4);
  background: var(--bg-deep); border: 1px solid var(--line-soft); border-radius: var(--r2);
  margin: var(--s3) 0; overflow-x: auto;
}
.ex-list { list-style: none; padding: 0; display: flex; flex-direction: column; gap: var(--s2); }
.ex-list li { padding-left: var(--s4); border-left: 2px solid var(--line); font-size: .93rem; }
.ex-list li b { color: var(--accent); }
.ex-list li.neg { border-left-color: var(--bad); }

/* Vocab browse */
.vocab-table td { font-size: .88rem; }

/* Theme picker */
.theme-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: var(--s4); }
.theme-card { display: flex; flex-direction: column; gap: var(--s2); padding: var(--s4); border: 1px solid var(--line); border-radius: var(--r3); background: var(--surface); text-align: left; }
.theme-card[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.theme-card .sw { display: flex; gap: 4px; }
.theme-card .sw i { width: 18px; height: 18px; border-radius: 4px; border: 1px solid rgba(0,0,0,.15); }

/* Speaking */
.speak-stage { text-align: center; padding: var(--s7) var(--s5); }
.speak-stage .prompt { font-family: var(--font-read); font-size: 1.3rem; max-width: 60ch; margin: var(--s4) auto; }

/* Progress page charts */
.chart { width: 100%; }
.chart svg { width: 100%; height: auto; }

/* Planner */
.plan-day { display: flex; align-items: center; gap: var(--s3); padding: var(--s3) 0; border-bottom: 1px solid var(--line-soft); }

/* Settings rows */
.set-row { display: flex; align-items: center; justify-content: space-between; gap: var(--s4); padding: var(--s4) 0; border-bottom: 1px solid var(--line-soft); flex-wrap: wrap; }
.set-row:last-child { border-bottom: none; }
.set-row .lbl { display: flex; flex-direction: column; gap: 2px; }
.set-row .lbl small { color: var(--ink-faint); }

/* Search */
.searchbar { position: relative; }
.searchbar .results { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r2); box-shadow: var(--shadow); z-index: var(--z-modal); max-height: 320px; overflow-y: auto; }
.searchbar .results button { display: block; width: 100%; text-align: left; padding: var(--s3) var(--s4); font-size: .88rem; border-bottom: 1px solid var(--line-soft); }
.searchbar .results button:hover { background: var(--surface-2); }

<script>
/* ============================================================
   store.js — persistence, state model, activity & streaks
   All progress lives under one key: "lexicon.state.v1"
   ============================================================ */
(function () {
  const KEY = 'lexicon.state.v1';

  const todayStr = (d) => {
    const dt = d ? new Date(d) : new Date();
    return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
  };

  const DEFAULT = () => ({
    version: 1,
    theme: 'claude',
    accent: null,               // null = theme default
    prefs: {
      fontSize: 16, readSize: 1.08, readLh: 1.75, motion: 'on', sound: 'off',
      dailyGoalMin: 10, dailyNewWords: 5, dailyReviewCards: 10, targetBand: 7,
    },
    profile: { name: '', goal: 'Reach IELTS Academic Band 7+', level: 'B1', placementDone: false },
    lessons: {},                 // lessonId -> {status, best, attempts[], lastTs}
    activity: {},                // dateStr -> {min, items, skills:{skill:count}, done:boolean}
    streak: { current: 0, longest: 0, last: null },
    vocab: {},                   // wordId -> {status, box, ease, due, reps, lapses, added, word}
    mistakes: {},                // key -> {count, last, type, ref, level}
    reading: {},                 // passageId -> {read, best, attempts, bookmark, notes}
    writing: { drafts: {}, history: [] },
    ielts: { results: [], official: null },
    assessments: { placement: null, checkpoints: {} },
    planner: { pomodoros: 0, sessions: [] },
    favorites: {},
    notes: {},
    ui: { sidebarOpen: false },
  });

  let state = load();

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return DEFAULT();
      const parsed = JSON.parse(raw);
      if (!parsed || typeof parsed !== 'object') return DEFAULT();
      // Shallow-merge onto defaults so new fields survive upgrades
      const base = DEFAULT();
      for (const k of Object.keys(base)) {
        if (parsed[k] !== undefined) {
          base[k] = (typeof base[k] === 'object' && !Array.isArray(base[k]) && base[k] !== null)
            ? Object.assign(base[k], parsed[k]) : parsed[k];
        }
      }
      return base;
    } catch (e) {
      console.warn('Corrupted state, starting fresh.', e);
      return DEFAULT();
    }
  }

  let saveTimer = null;
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try { localStorage.setItem(KEY, JSON.stringify(state)); }
      catch (e) { console.warn('Could not persist state:', e); }
    }, 120);
  }

  /* Record a qualifying learning activity: updates daily log + streak. */
  function recordActivity(o) {
    // o: {skill, minutes, items}
    const t = todayStr();
    const day = state.activity[t] || (state.activity[t] = { min: 0, items: 0, skills: {}, done: false });
    day.min += Math.max(0, Math.round(o.minutes || 1));
    day.items += o.items || 1;
    if (o.skill) day.skills[o.skill] = (day.skills[o.skill] || 0) + 1;
    day.done = true;
    // Streak: count once per day; consecutive-day logic
    const y = todayStr(new Date(Date.now() - 864e5));
    if (state.streak.last !== t) {
      state.streak.current = (state.streak.last === y) ? state.streak.current + 1 : 1;
      state.streak.last = t;
      state.streak.longest = Math.max(state.streak.longest, state.streak.current);
    }
    save();
    document.dispatchEvent(new CustomEvent('state:activity'));
  }

  function markLesson(id, data) {
    const L = state.lessons[id] || (state.lessons[id] = { status: 'in-progress', attempts: [] });
    Object.assign(L, data);
    if (data.score !== undefined) L.attempts.push({ ts: Date.now(), score: data.score });
    save();
  }

  function recordMistake(key, meta) {
    const m = state.mistakes[key] || (state.mistakes[key] = { count: 0 });
    m.count++; m.last = Date.now(); Object.assign(m, meta || {});
    save();
  }

  function clearMistake(key) {
    delete state.mistakes[key]; save();
  }

  const exportJSON = () => JSON.stringify({ app: 'lexicon', version: state.version, exported: new Date().toISOString(), state }, null, 2);

  function importJSON(text) {
    const data = JSON.parse(text);
    if (!data || data.app !== 'lexicon' || !data.state) throw new Error('Not a valid Lexicon backup file.');
    const base = DEFAULT();
    for (const k of Object.keys(base)) {
      if (data.state[k] !== undefined) {
        base[k] = (typeof base[k] === 'object' && !Array.isArray(base[k]) && base[k] !== null)
          ? Object.assign(base[k], data.state[k]) : data.state[k];
      }
    }
    state = base; save();
  }

  function reset() { state = DEFAULT(); save(); }

  window.Store = {
    get s() { return state; },
    save, load, reset,
    todayStr, recordActivity, markLesson, recordMistake, clearMistake,
    exportJSON, importJSON,
  };
})();

/* ============================================================
   router.js — hash router with page registry
   Routes: #/dashboard, #/reading, #/reading/:id, ...
   ============================================================ */
(function () {
  const routes = []; // {pattern, title, render}
  let outlet = null;

  function add(pattern, title, render) {
    const parts = pattern.split('/').filter(Boolean);
    routes.push({ pattern, parts, title, render });
  }

  function match() {
    const hash = location.hash.replace(/^#\/?/, '');
    const segs = hash.split('/').filter(Boolean);
    for (const r of routes) {
      if (r.parts.length !== segs.length && !r.parts[r.parts.length - 1]?.startsWith('*')) {
        if (!(r.parts.length === segs.length)) continue;
      }
      const params = {};
      let ok = true;
      for (let i = 0; i < Math.max(r.parts.length, segs.length); i++) {
        const p = r.parts[i];
        if (p === undefined) { ok = false; break; }
        if (p.startsWith('*')) { params[p.slice(1)] = segs.slice(i).join('/'); break; }
        if (p.startsWith(':')) { params[p.slice(1)] = segs[i]; continue; }
        if (p !== segs[i]) { ok = false; break; }
      }
      if (ok) return { route: r, params };
    }
    return null;
  }

  function run() {
    const m = match() || match0();
    function match0() {
      return routes.length ? { route: routes[0], params: {} } : null;
    }
    if (!m) { outlet.innerHTML = '<div class="empty"><p>Page not found.</p></div>'; return; }
    document.title = m.route.title + ' — Lexicon';
    const h1 = document.getElementById('page-title');
    if (h1 && h1.textContent !== m.route.title) h1.textContent = m.route.title;
    document.querySelectorAll('.nav-link').forEach(a => {
      const href = a.getAttribute('href').replace(/^#\/?/, '').replace(/\/$/, '');
      const target = m.route.pattern.replace(/\/:[^/]+/g, '').replace(/\/\*.*/, '');
      a.setAttribute('aria-current', href === target && m.route.pattern.split('/')[1] === href.split('/')[0] ? 'page' : 'false');
    });
    outlet.innerHTML = '';
    try { m.route.render(outlet, m.params); }
    catch (e) {
      console.error('Route error', e);
      outlet.innerHTML = '<div class="empty"><h3>Something went wrong</h3><p>' + (e.message || 'Unexpected error') + '</p></div>';
    }
    outlet.scrollIntoView({ block: 'start' });
    window.scrollTo(0, 0);
    document.querySelector('.sidebar')?.classList.remove('open');
  }

  function go(path) { location.hash = path.startsWith('#') ? path : '#/' + path.replace(/^\//, ''); }

  function init(el) {
    outlet = el;
    window.addEventListener('hashchange', run);
    if (!location.hash) location.hash = '#/dashboard';
    run();
  }

  window.Router = { add, go, run, get init() { return init; } };
})();

/* ============================================================
   ui.js — shared UI helpers: el(), icons, toasts, modals,
   quiz runner, mini charts, speech, theme application
   ============================================================ */
(function () {

  /* ---------- DOM factory ---------- */
  function el(tag, attrs, ...children) {
    const node = document.createElement(tag);
    if (attrs) {
      for (const [k, v] of Object.entries(attrs)) {
        if (v === null || v === undefined || v === false) continue;
        if (k === 'class') node.className = v;
        else if (k === 'html') node.innerHTML = v;
        else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);
        else if (k === 'dataset') Object.assign(node.dataset, v);
        else node.setAttribute(k, v === true ? '' : v);
      }
    }
    for (const c of children.flat(9)) {
      if (c === null || c === c === undefined || c === false) continue;
      if (typeof c === 'string' || typeof c === 'number') {

        // otherwise the raw tags render as literal text.
        if (typeof c === 'string' && c.indexOf('<') !== -1) {
          const span = document.createElement('span');
          span.style.display = 'inline-flex';
          span.style.alignItems = 'center';
          span.innerHTML = c;
          node.appendChild(span);
        } else {
          node.appendChild(document.createTextNode(String(c)));
        }
      } else {
        node.appendChild(c);
      }
    }
    return node;
  }

  function icon(name, size = 18, cls = 'ni') {

  }

  /* ---------- Toast ---------- */
  function toastZone() {
    let z = document.querySelector('.toast-zone');
    if (!z) { z = el('div', { class: 'toast-zone', 'aria-live': 'polite' }); document.body.appendChild(z); }
    return z;
  }
  function toast(msg, kind = '') {
    const t = el('div', { class: 'toast ' + kind }, msg);
    toastZone().appendChild(t);
    setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3200);
  }

  /* ---------- Modal (focus-trapped, Esc to close) ---------- */
  function modal(title, bodyNodes, actions) {
    const prevFocus = document.activeElement;
    const back = el('div', { class: 'modal-back', role: 'dialog', 'aria-modal': 'true', 'aria-label': title });
    const close = () => { back.remove(); prevFocus?.focus?.(); };
    back.addEventListener('click', (e) => { if (e.target === back) close(); });
    const m = el('div', { class: 'modal' },
      el('h3', { style: 'margin-bottom:16px' }, title),
      bodyNodes,
      actions && actions.length ? el('div', { style: 'display:flex;gap:12px;justify-content:flex-end;margin-top:24px' },
        ...actions.map(a => el('button', { class: 'btn ' + (a.cls || ''), onclick: () => { if (a.fn ? a.fn() !== false : true) close(); } }, a.label))) : null
    );
    m.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') close();
      if (e.key === 'Tab') {
        const f = [...m.querySelectorAll('button, input, textarea, select, a[href]')].filter(x => !x.disabled);
        if (!f.length) return;
        const first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { last.focus(); e.preventDefault(); }
        else if (!e.shiftKey && document.activeElement === last) { first.focus(); e.preventDefault(); }
      }
    });
    back.appendChild(m);
    document.body.appendChild(back);
    m.querySelector('button, input, textarea, select, a[href]')?.focus();
    return { close };
  }
  function confirmDialog(title, text, onYes, yesLabel = 'Confirm') {
    modal(title, [el('p', { style: 'font-size:.92rem' }, text)], [
      { label: 'Cancel' },
      { label: yesLabel, cls: 'danger', fn: onYes },
    ]);
  }

  /* ---------- Speech synthesis (always labeled synthetic) ---------- */
  const synth = {
    available: typeof speechSynthesis !== 'undefined',
    speak(text, rate = 1) {
      if (!this.available) return false;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = rate; u.lang = 'en-GB';
      speechSynthesis.speak(u);
      return true;
    },
  };

  /* ---------- Quiz runner ----------
     items: [{q, type:'mc'|'tfng'|'fill', options?, answer, explain?, skill}]
     Handles scoring, feedback, mistakes, keyboard (1-9), summary. */
  function runQuiz(container, items, opts = {}) {
    const store = window.Store.s;
    let i = 0, correct = 0, answered = [];
    const key = opts.key || 'quiz';
    const shell = el('div');

    function renderQ() {
      const item = items[i];
      if (!item) return summary();
      shell.innerHTML = '';
      const head = el('div', { style: 'display:flex;justify-content:space-between;align-items:center;margin-bottom:14px' },
        el('span', { class: 'mono' }, 'Question ' + (i + 1) + ' / ' + items.length),
        el('span', { class: 'mono' }, item.skill || '')
      );
      const q = el('h3', { style: 'margin-bottom:16px;white-space:pre-wrap' }, item.q);
      const zone = el('div');
      let locked = false;

      function grade(userAnswer, isCorrect, node) {
        if (locked) return; locked = true;
        answered.push({ q: item.q, user: userAnswer, correct: isCorrect, answer: item.answer });
        if (isCorrect) correct++;
        else if (item.mkey && opts.track !== false) Store.recordMistake(item.mkey, { type: opts.type || 'quiz', level: item.level, ref: item.q.slice(0, 90) });
        // Visual feedback
        if (node) {
          const optsEls = [...zone.querySelectorAll('.quiz-opt')];
          optsEls.forEach(b => { b.disabled = true; if (norm(b.dataset.val) === norm(String(item.answer))) b.classList.add('correct'); });
          if (!isCorrect && node) node.classList.add('wrong');
        }
        const ex = el('div', { class: 'explain ' + (isCorrect ? 'ok' : 'err'), html:
          (isCorrect ? '<b>Correct.</b> ' : '<b>Not quite.</b> The answer is <b>' + esc(String(item.answer)) + '</b>. ') + (item.explain || '')
        });
        const next = el('div', { style: 'display:flex;justify-content:flex-end;margin-top:14px' },
          el('button', { class: 'btn primary', onclick: () => { i++; renderQ(); } }, i === items.length - 1 ? 'Finish' : 'Next question'));
        zone.appendChild(ex); zone.appendChild(next);
        next.focus();
      }

      if (item.type === 'mc' || item.type === 'tfng' || !item.type) {
        (item.options || []).forEach((op, idx) => {
          const b = el('button', { class: 'quiz-opt', dataset: { val: String(op) }, style: 'margin-bottom:10px', onclick: (e) => grade(String(op), norm(String(op)) === norm(String(item.answer)), e.currentTarget) },
            el('span', { class: 'key' }, String.fromCharCode(65 + idx)), el('span', {}, String(op)));
          zone.appendChild(b);
        });
      } else if (item.type === 'fill') {
        const inp = el('input', { class: 'input', style: 'max-width:340px', placeholder: 'Type your answer', 'aria-label': 'Answer' });
        const btn = el('button', { class: 'btn primary', style: 'margin-left:10px' }, 'Check');
        const doGrade = () => grade(inp.value, norm(inp.value) === norm(String(item.answer)), null);
        btn.addEventListener('click', doGrade);
        inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') doGrade(); });
        inp.addEventListener('input', () => {
          if (norm(inp.value) === norm(String(item.answer))) { /* don't auto-grade */ }
        });
        const row = el('div', { style: 'display:flex;flex-wrap:wrap;gap:10px' }, inp, btn);
        zone.appendChild(row);
        setTimeout(() => inp.focus(), 30);
      }

      const keyHandler = (e) => {
        if (locked && (e.key === 'Enter')) { const b = shell.querySelector('button.btn.primary'); if (b && document.activeElement !== b) { b.click(); } return; }
        const n = parseInt(e.key, 10);
        if (n >= 1 && n <= 9 && !locked) {
          const btns = [...zone.querySelectorAll('.quiz-opt')];
          if (btns[n - 1]) { btns[n - 1].click(); }
        }
      };
      shell.onkeydown = keyHandler;

      shell.append(head, q, zone);
      shell.setAttribute('tabindex', '0');
    }

    function summary() {
      shell.innerHTML = '';
      const pct = items.length ? Math.round((correct / items.length) * 100) : 0;
      shell.appendChild(el('div', { class: 'card tint' },
        el('h3', { style: 'margin-bottom:14px' }, 'Results'),
        el('div', { class: 'grid cols-4', style: 'margin-bottom:18px' },
          stat(correct, 'Correct'), stat(items.length - correct, 'Mistakes'), stat(pct + '%', 'Accuracy'), stat(answered.length, 'Attempted')
        ),
        opts.onDone ? el('div', {}, opts.onDone({ correct, total: items.length, pct, answered })) : null
      ));
      function stat(v, k) { return el('div', { class: 'stat' }, el('div', { class: 'v' }, String(v)), el('div', { class: 'k' }, k)); }
    }

    container.appendChild(shell);
    renderQ();
    return { getResults: () => ({ correct, total: items.length, answered }) };
  }

  /* ---------- Writing diff (word-level compare) ---------- */
  function diffWords(target, attempt) {
    const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]/g, '').split(/\s+/).filter(Boolean);
    const T = norm(target), A = norm(attempt);
    return A.map((w, i) => ({ w, ok: T[i] === w, target: T[i] }));
  }

  /* ---------- Mini charts (SVG) ---------- */
  function barChart(data, { height = 120, labelFmt } = {}) {
    // data: [{label, value, color?}]
    const max = Math.max(1, ...data.map(d => d.value));
    const bw = 100 / Math.max(1, data.length);
    let bars = '';
    data.forEach((d, i) => {
      const h = (d.value / max) * 72;
      bars += `<rect x="${i * bw + bw * 0.18}" y="${82 - h}" width="${bw * 0.64}" height="${h}" rx="2" fill="${d.color || 'var(--accent)'}"/>`;
      bars += `<text x="${i * bw + bw / 2}" y="96" text-anchor="middle" font-size="8" fill="var(--ink-faint)" font-family="var(--font-mono)">${esc(d.label)}</text>`;
      if (d.value) bars += `<text x="${i * bw + bw / 2}" y="${78 - h}" text-anchor="middle" font-size="8" fill="var(--ink-soft)">${d.value}</text>`;
    });
    return `<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="height:${height}px" role="img" aria-label="${esc(labelFmt || 'Chart: ' + data.map(d => d.label + ' ' + d.value).join(', '))}">${bars}</svg>`;
  }

  function sparkline(values, { height = 60 } = {}) {
    if (!values.length) return '<span class="mono">no data yet</span>';
    const max = Math.max(1, ...values);
    const pts = values.map((v, i) => (i / Math.max(1, values.length - 1)) * 96 + 2 + ',' + (98 - (v / max) * 92)).join(' ');
    return `<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="height:${height}px" role="img" aria-label="Trend: ${esc(values.join(', '))}"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
  }

  function heatmap(days = 91) {
    const act = Store.s.activity;
    const wrap = el('div', { class: 'heatmap', role: 'img', 'aria-label': 'Activity calendar, last ' + days + ' days' });
    const now = new Date();
    for (let i = days - 1; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
      const k = Store.todayStr(d);
      const a = act[k];
      const lvl = !a || !a.done ? 0 : a.min >= 30 ? 3 : a.min >= 12 ? 2 : 1;
      wrap.appendChild(el('i', { dataset: { lvl: String(lvl) }, title: k + (a ? ' — ' + a.min + ' min, ' + a.items + ' items' : ' — no activity') }));
    }
    return wrap;
  }

  /* ---------- Theming ---------- */
  function applyTheme() {
    const s = Store.s;
    document.documentElement.setAttribute('data-theme', s.theme || 'claude');
    document.documentElement.setAttribute('data-motion', s.prefs.motion === 'off' ? 'off' : 'on');
    document.documentElement.style.setProperty('--user-font-size', s.prefs.fontSize + 'px');
    if (s.accent) {
      document.documentElement.style.setProperty('--accent', s.accent);
      const dark = isDarkTheme();
      document.documentElement.style.setProperty('--accent-ink', dark ? '#101014' : '#fff');
    } else {
      document.documentElement.style.removeProperty('--accent');
      document.documentElement.style.removeProperty('--accent-ink');
    }
    document.documentElement.style.setProperty('--read-size', s.prefs.readSize + 'rem');

  function isDarkTheme() { return ['nothing', 'mocha', 'midnight', 'dark'].includes(Store.s.theme); }

  /* ---------- utils ---------- */
  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
  function norm(s) { return String(s).toLowerCase().replace(/[^a-z0-9']/g, '').trim(); }
  function fmtDate(ts) { return new Date(ts).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }); }
  function ring(pct, num) {
    const r = 30, c = 2 * Math.PI * r;
    return `<div class="ring"><svg width="74" height="74"><circle cx="37" cy="37" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="6"/><circle cx="37" cy="37" r="${r}" fill="none" stroke="var(--accent)" stroke-width="6" stroke-dasharray="${(pct / 100) * c} ${c}" stroke-linecap="round"/></svg><div class="num">${num}</div></div>`;
  }

  window.UI = { el, icon, ICONS, toast, modal, confirmDialog, synth, runQuiz, diffWords, barChart, sparkline, heatmap, applyTheme, isDarkTheme, esc, norm, fmtDate, ring };
})();

      mistakes: ['"I wish I can swim" → "I wish I <b>could</b> swim." (past forms after wish)', '"I wish I would finish early" (about yourself) → "I wish I <b>could</b> finish early." — "would" is used for other people\u2019s actions.'],
      practice: [
        q('I wish I ___ taller.', ['was', 'were'], 'were', 'Formal and exam English prefer "were" for all persons in hypothetical wishes.'),
        q('If only I ___ the train — I missed my interview.', ['hadn\u2019t missed', 'didn\u2019t miss'], 'hadn\u2019t missed', 'A past regret → wish/if only + past perfect.'),
        q('I wish it ___ raining — the match starts in an hour.', ['would stop', 'stopped'], 'would stop', 'A change we want to happen → wish + would.'),
      ], related: ['g-conditionals-1-2', 'g-advanced-conditionals'] },

    { id: 'g-causative', level: 'B2', topic: 'Structures', title: 'Causative: have / get something done', objective: 'Talk about services other people do for you.',
      explain: 'Use <b>have/get + object + past participle</b> when you arrange for someone else to do something. It avoids saying who did it and sounds natural for services.',
      form: 'have + object + past participle  ·  get + object + past participle (more informal)',
      examples: ['I <b>had my car repaired</b> at the garage.', 'She\u2019s <b>getting her hair cut</b> tomorrow.', 'We <b>had the documents translated</b> into Arabic.'],
      mistakes: ['"I cut my hair yesterday" (you did it yourself) vs "I <b>had my hair cut</b>" (the barber did it)', '"I had repaired the car" means you repaired it yourself earlier — not the causative.'],
      practice: [
        q('Our roof was damaged in the storm, so we ___ repaired.', ['had it', 'had'], 'had it', 'Causative: had + object (it) + past participle.'),
        q('She ___ her eyes tested last week.', ['got', 'made'], 'got', '"Get something done" is the informal causative; "make" needs a person + base verb.'),
        q('While I was on holiday, I ___ some photos taken at the studio.', ['took', 'had'], 'had', 'The studio took them — I arranged it → causative "had… taken".'),
      ], related: ['g-passive'] },

    { id: 'g-cleft', level: 'C1', topic: 'Emphasis', title: 'Cleft Sentences (It was X that…)', objective: 'Highlight one part of a sentence for emphasis or contrast.',
      explain: 'Cleft structures split one clause into two to spotlight a chosen element: <b>It was… that/who…</b>, <b>What… is/was…</b>, <b>The reason why… is…</b>',
      form: 'It was Nadia who solved it. · What surprised me was the price. · The reason we left early was the traffic.',
      examples: ['<b>It was the second interview</b> that decided everything.', '<b>What the city needs</b> is affordable housing, not taller towers.', '<b>All (that) I want</b> is a quiet place to work.'],
      mistakes: ['Overusing clefts: two per essay is plenty — they lose force when repeated', '"It was him who called" → in formal writing prefer "It was <b>he</b> who called" (subject pronoun).'],
      practice: [
        q('Rewrite for emphasis: The fog delayed the flight.', ['It was the fog that delayed the flight.', 'The fog it delayed the flight.'], 'It was the fog that delayed the flight.', 'It-cleft moves the spotlight onto the cause.'),
        q('___ I really need is a long holiday.', ['What', 'That'], 'What', 'What-clause as subject: "What I really need is…"'),
        q('The reason ___ she resigned was never explained.', ['why', 'because'], 'why', '"The reason why… is…" — "the reason… because" is redundant.'),
      ], related: ['g-inversion'] },

    { id: 'g-ellipsis', level: 'C1', topic: 'Style', title: 'Ellipsis & Substitution', objective: 'Avoid repetition by leaving out or replacing repeated words.',
      explain: 'Good writers delete or replace repeated material: <b>ellipsis</b> (omission), <b>do so / do</b> (substitution for verbs), <b>one/ones</b> (for countable nouns).',
      form: 'She can swim; I can\u2019t (swim). · He said he\u2019d come, and he did (so). · the red one / these ones',
      examples: ['I haven\u2019t read the report, but Salma has. ("…has read the report" omitted)', '"Will they raise fees?" "They may do." ', 'These routes are safer than the old ones.'],
      mistakes: ['Repeating the full verb: "She can swim and I can swim" → "…and I can."', 'Using "one" for uncountables: "a cheaper equipment" → "cheaper <b>equipment</b>" (no "one").'],
      practice: [
        q('He didn\u2019t pass the first time, but she ___.', ['did', 'does'], 'did', 'Substitute the past verb with "did".'),
        q('This phone is fine, but I prefer the newer ___.', ['one', 'it'], 'one', '"One" replaces a singular countable noun already mentioned.'),
        q('Cut the repetition: "They promised to cut costs, and they promised to cut costs quickly."', ['They promised to cut costs — and quickly.', 'They promised and they promised quickly.'], 'They promised to cut costs — and quickly.', 'Ellipsis removes the repeated clause and keeps only the new information.'),
      ], related: ['g-cohesion'] },

    { id: 'g-register', level: 'C1', topic: 'Register', title: 'Register: Formal vs Neutral vs Informal', objective: 'Match language to audience: contractions, phrasal verbs, and academic alternatives.',
      explain: 'Register is the fit between language and situation. Formal writing avoids contractions, phrasal verbs and vague quantifiers; it prefers Latinate verbs and precise links.',
      form: 'find out → ascertain · look into → investigate · lots of → numerous / a considerable number',
      examples: ['Informal: "We found out loads of people skipped it."', 'Neutral: "We discovered that many people did not attend."', 'Formal: "The investigation established that attendance was considerably lower than expected."'],
      mistakes: ['Contractions in academic essays: "don\u2019t" → "do not"', 'Phrasal verbs in formal reports: "put off" → "postpone"', 'Vague words in exams: "things, stuff, a lot of" → precise nouns and quantities'],
      practice: [
        q('Choose the formal equivalent: "The team looked into the complaint."', ['investigated', 'checked out'], 'investigated', 'Latinate single-word verbs raise the register.'),
        q('Which sentence suits an academic essay?', ['The data suggests a link, as many researchers argue.', 'The data kind of suggests a link, like lots of researchers say.'], 'The data suggests a link, as many researchers argue.', 'Formal register avoids "kind of", "like", "lots of".'),
        q('Formal version of "The company got bigger and bigger."', ['The company expanded continuously.', 'The company got bigger non-stop.'], 'The company expanded continuously.', '"Expanded continuously" is precise and Latinate; "got bigger" is conversational.'),
      ], related: ['g-hedging', 'g-nominalisation'] },

    { id: 'g-articles-advanced', level: 'C1', topic: 'Determiners', title: 'Articles: Zero, The, and Institutions', objective: 'Handle the tricky cases: institutions, generalisation, and fixed phrases.',
      explain: 'Many nouns change meaning with the article: <b>school</b> (the activity) vs <b>the school</b> (the building). Zero article covers abstract generalisations: <b>society, research, information</b>.',
      form: 'go to university (as a student) · go to the university (visit the campus) · zero article with most uncountables in generalisations',
      examples: ['She\u2019s in hospital. (as a patient)', 'The meeting is at the hospital. (the place)', 'Research shows that bilingualism delays cognitive decline. (general, no article)'],
      mistakes: ['"The research shows…" is fine when specific ("the research of 2019"), but general claims take no article', '"He is in the prison" means he is visiting, not serving a sentence'],
      practice: [

        q('___ is one of the fastest-changing fields in science.', ['The artificial intelligence', 'Artificial intelligence'], 'Artificial intelligence', 'Generalisation about a field → zero article.'),
        q('Choose the correct sentence.', ['The most people prefer clear feedback.', 'Most people prefer clear feedback.'], 'Most people prefer clear feedback.', '"Most" in general statements takes no article.'),

    { id: 'r-market', level: 'B1', title: 'A Morning at the Friday Market', topic: 'Culture', type: 'Descriptive essay', minutes: 2,
      text: [
        'The fish market in the old port opens long before the sun. By five o\u2019clock, the concrete floor is already wet and shining, and the air smells of salt, diesel, and cold metal.',
        'Buyers move between the tables with serious faces. Each one lifts a fish, examines the eye, presses the flesh with a thumb, and puts it down again. A fish that looks back at you clearly is fresh; a fish with a cloudy eye is not. Everyone here knows this rule, so nobody says it out loud.',
        'At the corner table, an old man named Yousuf sells to restaurants, never to tourists. His prices are higher, but so is his quality, and his customers have followed him for twenty years. "I do not sell fish," he likes to say. "I sell trust. The fish is free."',
        'By nine, the market is almost empty. The floor is washed, the tables are folded, and the gulls arrive to inspect what remains. The whole economy of the morning disappears so completely that a visitor arriving at noon would never guess what happened here.',
